<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3F5F7">
<title>P3 de Circuitos CC</title>
<!--
  P3 de Circuitos CC: transitórios de 1ª e 2ª ordem (TEE00190, UFF).
  Um arquivo só. O progresso fica no localStorage do navegador.
  Dependências opcionais (CDN): fontes IBM Plex e KaTeX para as fórmulas.
  Sem internet, tudo funciona; as fórmulas aparecem como texto LaTeX.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
  try { var s = JSON.parse(localStorage.getItem('p3-circuitos') || '{}'); } catch (e) { s = {}; }
  document.documentElement.dataset.theme = s.tema || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
/* ============================================================
   Cores com significado: azul = corrente, laranja = tensão.
   Cada instante tem a sua cor: 0⁻ ardósia, 0⁺ âmbar, ∞ verde, τ roxo.
   Os gráficos são telas de osciloscópio.
   ============================================================ */
:root {
  --fundo: #F3F5F7;
  --cartao: #FFFFFF;
  --tinta: #111A22;
  --tinta-2: #52606D;
  --linha: #D2DAE1;
  --linha-2: #E6EBEF;
  --corrente: #1660D8;
  --tensao: #CF4317;
  --f-antes: #5E6E7D;
  --f-inicial: #C98204;
  --f-final: #10885A;
  --f-tau: #7448D1;
  --ok: #10885A;
  --erro: #C8321E;
  --tela: #0A1512;
  --tela-grade: #14291F;
  --tela-grade-forte: #1F4234;
  --traco: #46EE9C;
  --traco-2: #6CB4FF;
  --tela-texto: #93C2AC;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme=dark] {
  --fundo: #0D1217;
  --cartao: #151C23;
  --tinta: #E3E9EE;
  --tinta-2: #94A2AF;
  --linha: #2A3540;
  --linha-2: #1D2630;
  --corrente: #6FA8FF;
  --tensao: #FF8B5E;
  --f-antes: #9AA8B6;
  --f-inicial: #F2B13A;
  --f-final: #35C98A;
  --f-tau: #A88BFF;
  --ok: #35C98A;
  --erro: #FF7A66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 16px/1.6 var(--sans); }
a { color: var(--corrente); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0 0 14px; }
code, .mono { font-family: var(--mono); }
:focus-visible { outline: 2.5px solid var(--corrente); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.katex { font-size: 1.06em; }

button, .botao {
  font: 600 15px/1.2 var(--sans); color: var(--tinta);
  background: var(--cartao); border: 1.5px solid var(--linha); border-radius: 8px;
  padding: 10px 15px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; transition: border-color .12s, background .12s;
}
button:hover, .botao:hover { border-color: var(--tinta-2); }
button.prim, .botao.prim { background: var(--tinta); border-color: var(--tinta); color: var(--cartao); }
button.prim:hover, .botao.prim:hover { filter: brightness(1.15); }
button.leve { border-color: transparent; background: transparent; color: var(--tinta-2); }
button.leve:hover { color: var(--tinta); background: var(--linha-2); }
button:disabled { opacity: .5; cursor: not-allowed; }
input[type=text] {
  font: 500 16px/1.2 var(--mono); color: var(--tinta); background: var(--cartao);
  border: 1.5px solid var(--linha); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 130px;
}
input[type=text]:focus { border-color: var(--corrente); outline: none; }
input.certo { border-color: var(--ok); }
input.errado { border-color: var(--erro); }

/* ---------- topo ---------- */
.topo { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--fundo) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }
.topo-in { max-width: 1180px; margin: 0 auto; height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; color: var(--tinta); text-decoration: none; font-weight: 700; font-size: 16px; }
.marca svg { width: 30px; height: 30px; }
.topo nav { display: flex; gap: 2px; align-items: center; }
.topo nav a { color: var(--tinta-2); text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 11px; border-radius: 6px; }
.topo nav a:hover { color: var(--tinta); background: var(--linha-2); }
.topo nav a[aria-current=page] { color: var(--tinta); font-weight: 600; }
.topo .tema { min-height: 40px; padding: 8px; border-color: transparent; background: transparent; }
@media (max-width: 720px) { .topo nav .longo, .topo nav .so-largo { display: none; } .topo nav a { padding: 8px 6px; font-size: 14px; } .marca span { display: none; } .topo-in { padding: 0 12px; } }

/* ---------- página ---------- */
.pagina { max-width: 1180px; margin: 0 auto; padding: 40px 20px 100px; }
.coluna { max-width: 760px; }
.rotulo-fase { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--mono); padding: 4px 8px; border-radius: 5px; color: #fff; }
.rf-antes { background: var(--f-antes); } .rf-inicial { background: var(--f-inicial); } .rf-final { background: var(--f-final); } .rf-tau { background: var(--f-tau); }
:root[data-theme=dark] .rotulo-fase { color: #0D1217; }

/* início */
.abertura { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 44px; align-items: center; }
.abertura h1 { font-size: clamp(36px, 5vw, 58px); font-weight: 700; letter-spacing: -.03em; line-height: 1.02; margin-bottom: 18px; text-wrap: balance; }
.abertura .lead { font-size: 18px; color: var(--tinta-2); max-width: 44ch; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 14px; }
.progresso-geral { font-size: 14px; color: var(--tinta-2); }
.progresso-geral b { color: var(--tinta); }
.secao { margin-top: 72px; }
.secao > h2 { font-size: 28px; margin-bottom: 8px; }
.secao > p { color: var(--tinta-2); max-width: 64ch; }
.tipos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
.tipo { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 20px; }
.tipo h3 { font-size: 18px; margin-bottom: 6px; }
.tipo p { color: var(--tinta-2); font-size: 15px; margin-bottom: 10px; }
.tipo .freq { font: 600 13px/1 var(--mono); color: var(--tinta-2); margin-bottom: 12px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips a { font-size: 13.5px; font-weight: 600; padding: 4px 10px; border: 1.5px solid var(--linha); border-radius: 99px; text-decoration: none; color: var(--tinta); }
.chips a:hover { border-color: var(--corrente); color: var(--corrente); }
.lista { margin-top: 20px; border-top: 1px solid var(--linha); }
.item-lista { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--linha); color: var(--tinta); text-decoration: none; }
.item-lista:hover { background: var(--cartao); }
.item-lista .num { font: 600 26px/1 var(--mono); color: var(--tinta-2); }
.item-lista h3 { font-size: 18px; margin-bottom: 2px; }
.item-lista p { margin: 0; color: var(--tinta-2); font-size: 15px; }
.item-lista .estado { font: 500 13px/1.3 var(--mono); color: var(--tinta-2); text-align: right; white-space: nowrap; }
.item-lista .estado.ok { color: var(--ok); }
.atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
.atalho { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.atalho h3 { font-size: 20px; }
.atalho p { color: var(--tinta-2); margin: 0 0 8px; }

/* ---------- bancada (circuito + osciloscópio ao vivo) ---------- */
.bancada { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; }
.bancada-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.bancada-topo .modos { display: flex; gap: 4px; }
.bancada-topo .modos button { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.bancada-topo .modos button[aria-pressed=true] { background: var(--tinta); color: var(--cartao); border-color: var(--tinta); }
.bancada-corpo { display: grid; grid-template-columns: minmax(0, 1fr); }
.bancada .esquema { padding: 6px 10px 0; }
.bancada .esquema svg { max-height: 230px; }
.leituras { display: flex; gap: 18px; padding: 0 16px 10px; flex-wrap: wrap; font: 500 15px/1.3 var(--mono); }
.leituras .lv { color: var(--tensao); } .leituras .li { color: var(--corrente); }
.bancada .dica-chave { font-size: 14px; color: var(--tinta-2); padding: 0 16px 10px; }

/* ---------- esquemas ---------- */
.esquema { overflow-x: auto; }
.esquema svg { width: 100%; height: auto; display: block; min-width: 520px; }
.bancada .esquema svg { min-width: 0; }
.cc-esq svg { min-width: 0; max-width: 560px; margin: 0 auto; }
.cc-txt { font-family: var(--sans); font-size: 16px; }
.pergunta-inline { padding: 4px 18px 12px; margin: 18px 0 26px; border-left: 4px solid var(--f-inicial); }
.pergunta-inline .item { border-top: 0; padding-top: 12px; }
.pergunta-inline .item-p { grid-template-columns: 0 minmax(0, 1fr) auto; }
.pergunta-inline .campos, .pergunta-inline .item-acoes, .pergunta-inline .retorno, .pergunta-inline .passos, .pergunta-inline .resposta-final { margin-left: 0; }
.esq-fio { stroke: var(--tinta); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.esq-el { stroke: var(--tinta); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.esq-no { fill: var(--tinta); }
.esq-term { fill: var(--cartao); stroke: var(--tinta); stroke-width: 1.8; }
.esq-txt { fill: var(--tinta-2); font: 500 14px var(--sans); }
.esq-txt.forte { fill: var(--tinta); font-weight: 600; }
.esq-i { stroke: var(--corrente); fill: var(--corrente); }
.esq-i-txt { fill: var(--corrente); font: 600 14px var(--sans); }
.esq-v-txt { fill: var(--tensao); font: 600 14px var(--sans); }
.esq-sinal { fill: var(--tensao); font: 700 16px var(--mono); }
.esq-fase-antes { stroke: var(--f-antes); fill: var(--f-antes); }
.esq-fase-inicial { stroke: var(--f-inicial); }
.esq-fase-final { stroke: var(--f-final); }
.esq-fase-tau { stroke: var(--f-tau); }
.t-antes { fill: var(--f-antes); } .t-inicial { fill: var(--f-inicial); } .t-final { fill: var(--f-final); } .t-tau { fill: var(--f-tau); }
.esq-fluxo { stroke: var(--corrente); stroke-width: 4.5; stroke-linecap: round; fill: none; stroke-dasharray: 0.1 15; opacity: .85; animation: fluir 1s linear infinite; }
@keyframes fluir { to { stroke-dashoffset: -15.1; } }
.esq-fantasma { stroke: var(--tinta-2); stroke-width: 1.6; fill: none; stroke-dasharray: 3 3; opacity: .55; }

/* ---------- explorador de fases ---------- */
.explorador { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; margin: 22px 0; overflow: hidden; }
.fases { display: flex; overflow-x: auto; border-bottom: 1px solid var(--linha); }
.fases button { border: 0; border-radius: 0; min-height: 46px; padding: 10px 16px; font: 600 14.5px var(--sans); color: var(--tinta-2); background: transparent; white-space: nowrap; border-bottom: 3px solid transparent; flex: none; }
.fases button[aria-selected=true] { color: var(--tinta); }
.fases button[data-fase=enunciado][aria-selected=true] { border-bottom-color: var(--tinta); }
.fases button[data-fase=antes][aria-selected=true] { border-bottom-color: var(--f-antes); }
.fases button[data-fase=inicial][aria-selected=true] { border-bottom-color: var(--f-inicial); }
.fases button[data-fase=final][aria-selected=true] { border-bottom-color: var(--f-final); }
.fases button[data-fase=tau][aria-selected=true], .fases button[data-fase=depois][aria-selected=true] { border-bottom-color: var(--f-tau); }
.explorador .esquema { padding: 8px 12px 0; max-width: 640px; margin: 0 auto; }
.leitura { padding: 4px 20px 18px; font-size: 15.5px; }
.leitura p { margin: 0 0 8px; color: var(--tinta-2); }
.valores { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 500 15px/1.4 var(--mono); }
.valores span { white-space: nowrap; }

/* ---------- osciloscópio ---------- */
.osc { background: var(--tela); border-radius: 12px; padding: 10px; margin: 18px 0; box-shadow: inset 0 0 0 1px #000, inset 0 0 40px rgba(70, 238, 156, .06); }
.osc svg { width: 100%; height: auto; display: block; }
.osc-grade { stroke: var(--tela-grade); stroke-width: 1; }
.osc-eixo { stroke: var(--tela-grade-forte); stroke-width: 1.4; }
.osc-traco { fill: none; stroke: var(--traco); stroke-width: 2.6; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(70, 238, 156, .55)); }
.osc-traco.t2 { stroke: var(--traco-2); filter: drop-shadow(0 0 4px rgba(108, 180, 255, .5)); }
.osc-traco.t3 { stroke: var(--tensao); filter: drop-shadow(0 0 4px rgba(255, 139, 94, .5)); }
.math-bloco { overflow-x: auto; margin: 10px 0 16px; }
.campos .forma { flex-basis: 100%; font-size: 15px; }
.osc-antes { fill: none; stroke: #6F8A80; stroke-width: 2.2; }
.osc-guia { stroke: var(--tela-texto); stroke-width: 1.2; stroke-dasharray: 5 5; fill: none; opacity: .8; }
.osc-txt { fill: var(--tela-texto); font: 500 12.5px var(--mono); }
.osc-txt.forte { fill: #DFFBEA; font-weight: 600; }
.osc-legenda { display: flex; gap: 16px; padding: 6px 6px 0; font: 500 13px var(--mono); color: var(--tela-texto); flex-wrap: wrap; }
.osc-legenda i { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }

/* ---------- texto das etapas ---------- */
.texto h3 { font-size: 21px; margin: 34px 0 10px; }
.texto ul, .texto ol { padding-left: 22px; margin: 0 0 16px; }
.texto li { margin-bottom: 6px; }
.texto :not(pre) > code { font-size: .9em; padding: 1px 5px; border-radius: 4px; background: var(--linha-2); }
.texto strong { font-weight: 600; }
.texto table { border-collapse: collapse; margin: 6px 0 20px; font-size: 15px; width: 100%; }
.texto th, .texto td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.texto th { font-weight: 600; background: var(--linha-2); }
.texto .formula { background: var(--cartao); border: 1px solid var(--linha); border-left: 4px solid var(--tinta); border-radius: 8px; padding: 10px 16px; margin: 14px 0 20px; overflow-x: auto; }
.nota { margin: 18px 0; padding: 12px 16px; border-left: 4px solid var(--corrente); background: var(--cartao); border-radius: 0 8px 8px 0; font-size: 15.5px; }
.nota.cuidado { border-left-color: var(--tensao); }
.nota p:last-child { margin-bottom: 0; }
.tabela-wrap { overflow-x: auto; }
.ver { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
.ver a { font-size: 14px; font-weight: 600; padding: 5px 12px; border: 1.5px solid var(--corrente); border-radius: 99px; text-decoration: none; }

.cab-etapa { margin-bottom: 26px; }
.cab-etapa .num { font: 600 14px var(--mono); color: var(--tinta-2); display: block; margin-bottom: 6px; }
.cab-etapa h1 { font-size: clamp(30px, 4vw, 44px); letter-spacing: -.02em; text-wrap: balance; }
.nav-etapas { display: flex; justify-content: space-between; gap: 10px; margin-top: 44px; flex-wrap: wrap; }

/* treino e itens com resposta */
.treino { margin-top: 40px; }
.treino > h2 { font-size: 22px; margin-bottom: 6px; }
.questao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 22px; margin: 22px 0; }
.questao > h2 { font-size: 21px; margin-bottom: 4px; }
.questao .pts { font: 500 13px var(--mono); color: var(--tinta-2); }
.questao .enunciado { margin: 10px 0 4px; }
.item { border-top: 1px solid var(--linha); padding: 18px 0 6px; }
.item:first-of-type { border-top: 0; }
.item-p { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.item-p .l { font: 600 15px var(--mono); color: var(--tinta-2); }
.item-p .ip { font: 500 12.5px var(--mono); color: var(--tinta-2); white-space: nowrap; }
.item-p .feito { color: var(--ok); }
.campos { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 12px 0 0 38px; }
.campo { display: flex; align-items: center; gap: 8px; }
.campo label { font-size: 15px; }
.campo .un { font: 500 15px var(--mono); color: var(--tinta-2); }
.escolhas { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0 38px; }
.escolhas button.certa { border-color: var(--ok); color: var(--ok); }
.escolhas button.errada { border-color: var(--erro); color: var(--erro); text-decoration: line-through; }
.item-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0 38px; align-items: center; }
.retorno { margin: 10px 0 0 38px; font-size: 15px; }
.retorno:empty { display: none; }
.retorno.ok { color: var(--ok); font-weight: 600; }
.retorno.nao { color: var(--erro); }
.passos { margin: 14px 0 0 38px; }
.passo { border-left: 3px solid var(--linha); padding: 4px 0 8px 16px; margin-bottom: 8px; }
.passo .pn { font: 600 12.5px var(--mono); color: var(--tinta-2); display: block; margin-bottom: 4px; }
.passo .esquema { max-width: 520px; margin: 4px 0 8px; }
.passo .valores { margin: 0 0 8px; font-size: 14px; }
.resposta-final { margin: 6px 0 4px 38px; padding: 10px 14px; border-radius: 8px; background: var(--linha-2); font-weight: 600; }
@media (max-width: 640px) {
  .campos, .escolhas, .item-acoes, .retorno, .passos, .resposta-final { margin-left: 0; }
  .questao { padding: 16px; }
}

/* widgets de laboratório */
.lab { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 18px; margin: 22px 0; }
.lab h4 { margin: 0 0 4px; font-size: 16px; }
.lab .controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 22px; margin: 12px 0; }
.lab label.ctl { display: grid; gap: 4px; font-size: 14.5px; }
.lab label.ctl span { display: flex; justify-content: space-between; }
.lab label.ctl b { font: 600 14.5px var(--mono); }
input[type=range] { width: 100%; accent-color: var(--tinta); min-height: 30px; }
.lab .saida-lab { font: 500 15px/1.6 var(--mono); }
.selo-amort { display: inline-block; padding: 4px 12px; border-radius: 99px; font: 600 14px var(--sans); color: #fff; }
.sa-super { background: var(--f-antes); } .sa-critico { background: var(--f-tau); } .sa-sub { background: var(--f-inicial); }
.plano-s { max-width: 260px; }
.lab-duas { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
.edo-entrada { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 500 16px var(--mono); }
.edo-entrada input { width: 76px; }
.resolucao-edo { margin-top: 14px; }
.resolucao-edo .passo { border-left-color: var(--f-tau); }

/* simulado */
.sim-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.sim-tipos { display: flex; flex-wrap: wrap; gap: 8px; }
.sim-tipos button[aria-pressed=true] { background: var(--tinta); color: var(--cartao); border-color: var(--tinta); }
.placar { font: 500 14px var(--mono); color: var(--tinta-2); }

/* janela e aviso */

<textarea class="etapa">
n: 1
titulo: O básico: tensão, corrente e resistência
sobre: Do zero e devagar: o que é cada coisa, lei de Ohm, série, paralelo, nós e malhas. Com circuitos para mexer.
=== texto
Esta etapa começa do zero, em oito partes pequenas. Em cada uma: leia, mexa no circuito e responda a perguntinha antes de seguir. Se uma parte não fizer sentido, pare nela e me pergunte.

### Parte 1: as três grandezas
Pense num circuito como **água correndo em canos**.

- A **fonte** (o símbolo com um traço comprido e um curto) é uma **bomba d'água**: é ela que empurra.
- A **tensão** $v$, em **volts (V)**, é a força desse empurrão. Imagine duas caixas d'água em alturas diferentes: quanto maior a diferença de altura, mais forte a água desce. Por isso a tensão é sempre medida **entre dois pontos**.
- A **corrente** $i$, em **ampères (A)**, é quanta água passa pelo cano a cada segundo.
- A **resistência** $R$, em **ohms (Ω)**, é um trecho de cano estreito, que dificulta a passagem. No desenho, é o zigue-zague.

Os fios são canos largos e perfeitos: não atrapalham nada. Por isso, **pontos ligados só por fio têm a mesma tensão**. Um grupo de pontos ligados por fio se chama **nó**.

Mexa nos controles abaixo. Os pontinhos azuis são a corrente andando. Repare: mais tensão, mais corrente. Mais resistência, menos corrente.

@w cc ohm

### Parte 2: a lei de Ohm
A regra que liga as três grandezas é a **lei de Ohm**:

$$v = R \cdot i$$

Ela serve de três jeitos, conforme o que você quer achar:

| Quero achar | Conta |
|---|---|
| a corrente | $i = \dfrac{v}{R}$ |
| a tensão | $v = R \cdot i$ |
| a resistência | $R = \dfrac{v}{i}$ |

Exemplo: fonte de 10 V ligada num resistor de 5 Ω. A corrente é $i = \frac{10}{5} = 2$ A.

**Para onde a corrente anda:** ela sai pelo **+** da fonte, dá a volta no circuito e volta pelo **−**. Dentro do resistor, ela vai do lado de tensão **maior** para o de tensão **menor**, como água descendo uma ladeira. Por isso o + do resistor fica do lado por onde a corrente entra.

@q Uma fonte de 12 V está ligada num resistor de 4 Ω. Qual é a corrente? | 3 | A | Lei de Ohm: $i = \frac{v}{R} = \frac{12}{4} = 3$ A.

### Parte 3: resistores em série
**Série** quer dizer **um atrás do outro**, num caminho só, sem nenhuma bifurcação no meio.

- Como só existe um caminho, a **mesma corrente** passa por todos.
- As resistências **se somam**: $R_{total} = R_1 + R_2$. (Dois canos estreitos seguidos atrapalham mais que um.)
- A tensão da fonte é **repartida** entre eles. Cada um fica com $v = R \cdot i$, e somando os pedaços dá a tensão da fonte.

Mexa e confira que as duas tensões sempre somam a da fonte. O resistor maior fica com o pedaço maior.

@w cc serie

Exemplo (é a 1ª questão da P3 2024.1): 10 V com 1 Ω e 4 Ω em série.
1. Resistência total: $1 + 4 = 5\ \Omega$.
2. Corrente: $i = \frac{10}{5} = 2$ A, a mesma nos dois.
3. Tensão em cada um: no 1 Ω, $1 \cdot 2 = 2$ V. No 4 Ω, $4 \cdot 2 = 8$ V. E $2 + 8 = 10$ V, a tensão da fonte.

@q Uma fonte de 10 V alimenta 4 Ω e 1 Ω em série. Qual é a tensão no resistor de 1 Ω? | 2 | V | Total: $4 + 1 = 5\ \Omega$. Corrente: $\frac{10}{5} = 2$ A. No 1 Ω: $1 \cdot 2 = 2$ V. (É a P3 2025.2, 2ª questão.)

### Parte 4: resistores em paralelo
**Paralelo** quer dizer **lado a lado**: os resistores ligam nos **mesmos dois nós**, como dois canos saindo do mesmo lugar e chegando no mesmo lugar.

- Como estão nos mesmos dois nós, todos têm a **mesma tensão**.
- A corrente se **divide** entre eles. O caminho mais fácil (o de **menor** resistência) leva **mais** corrente.
- Cada um tem a sua corrente pela lei de Ohm, $i = \frac{v}{R}$. A corrente total é a soma.

@w cc paralelo

Exemplo (P3 2025.2, 1ª questão): fonte de 5 V com um resistor de 5 Ω e outro de 1 Ω em paralelo.
1. Os dois ficam com os mesmos 5 V.
2. No 5 Ω: $\frac{5}{5} = 1$ A. No 1 Ω: $\frac{5}{1} = 5$ A.
3. A fonte entrega a soma: $1 + 5 = 6$ A.

Se precisar trocar dois resistores em paralelo por um só, a conta é "produto pela soma": $R_p = \dfrac{R_1 \cdot R_2}{R_1 + R_2}$. O resultado é sempre **menor** que o menor dos dois, porque abrir mais um caminho só facilita.

@q Quanto vale um resistor de 6 Ω em paralelo com um de 3 Ω? | 2 | Ω | Produto pela soma: $\frac{6 \cdot 3}{6 + 3} = \frac{18}{9} = 2\ \Omega$. Menor que 3, como esperado.

### Parte 5: lei dos nós
Num nó, a corrente não some nem aparece do nada: **tudo que entra, sai**. É como um cano em T: a água que chega se divide, mas o total é o mesmo.

$$\text{soma do que entra} = \text{soma do que sai}$$

Foi o que aconteceu no paralelo: a fonte manda 6 A para o nó, e eles saem divididos em 1 A e 5 A.

@q Num nó chegam 8 A. Por um caminho saem 1 A. Quanto sai pelo outro caminho? | 7 | A | Tudo que entra sai: $8 = 1 + x$, então $x = 7$ A. (Aparece na P3 2024.2.)

### Parte 6: lei das malhas
Uma **malha** é um caminho fechado: você sai de um ponto, dá a volta e chega de novo nele. Como voltou ao mesmo lugar, a "altura" total não mudou. Então **o que a fonte sobe, os resistores descem**:

$$\text{tensão da fonte} = \text{soma das tensões nos resistores da malha}$$

Foi o que vimos na série: $10 = 2 + 8$.

@q Uma fonte de 12 V tem dois resistores em série. Um deles está com 8 V. Quanto tem o outro? | 4 | V | A fonte sobe 12 V e os resistores descem o mesmo total: $12 = 8 + x$, então $x = 4$ V.

### Parte 7: dois atalhos (divisores)
Os divisores não trazem nada novo: só juntam as partes 3 e 4 numa conta só.

**Divisor de tensão** (série): a tensão num resistor é a da fonte vezes a "fatia" dele na resistência total.

$$v_1 = V \cdot \frac{R_1}{R_1 + R_2}$$

**Divisor de corrente** (paralelo, dois ramos): a corrente num ramo é a total vezes a resistência do **outro** ramo, dividida pela soma.

$$i_1 = I \cdot \frac{R_2}{R_1 + R_2}$$

> Por que vai o **outro** em cima? Quanto maior a resistência do outro lado, mais difícil passar por lá, e mais corrente sobra para o seu ramo.

Exemplo (P3 2026.1): 6 A se dividem entre um ramo de 10 Ω e um de 5 Ω. No ramo de 5 Ω: $6 \cdot \frac{10}{10 + 5} = 4$ A. No de 10 Ω: $6 \cdot \frac{5}{15} = 2$ A. Conferindo: $4 + 2 = 6$ A.

@q Uma fonte de 18 V alimenta 6 Ω e 3 Ω em série. Qual é a tensão no resistor de 3 Ω? | 6 | V | Divisor de tensão: $18 \cdot \frac{3}{6 + 3} = 18 \cdot \frac{1}{3} = 6$ V. (Ou pelo caminho longo: corrente $\frac{18}{9} = 2$ A, e $3 \cdot 2 = 6$ V.)

### Parte 8: um nó ligado a duas fontes
Esta é a parte mais difícil da etapa. Só venha para ela depois que as outras estiverem tranquilas.

Às vezes um nó liga em duas fontes diferentes, e aí não é série nem paralelo simples. A receita:
1. Chame a tensão desconhecida do nó de $v$.
2. Para cada resistor ligado no nó, a corrente é $\dfrac{\text{tensão de um lado} - \text{tensão do outro}}{R}$.
3. Escreva "o que entra = o que sai" e resolva a equação.

Exemplo (P3 2025.1): o nó P liga numa fonte de 10 V por um resistor de 1 Ω, e numa fonte de 3 V por um de 2 Ω e outro de 4 Ω.
- Entra no nó, vindo dos 10 V: $\frac{10 - v}{1}$.
- Sai para os 3 V pelo 2 Ω: $\frac{v - 3}{2}$. E pelo 4 Ω: $\frac{v - 3}{4}$.

$$\frac{10 - v}{1} = \frac{v - 3}{2} + \frac{v - 3}{4}$$

Multiplicando tudo por 4 para sumir com as frações: $40 - 4v = 2v - 6 + v - 3$. Juntando: $49 = 7v$, ou seja, $v = 7$ V.

> Uma corrente com sinal negativo não é erro: só quer dizer que ela anda no sentido **contrário** ao da seta desenhada.
=== treino
? Uma fonte de 20 V alimenta 2 Ω e 8 Ω em série. Qual é a corrente? | 2 | A | Total: $2 + 8 = 10\ \Omega$. Corrente: $\frac{20}{10} = 2$ A.
? Uma fonte de 6 V alimenta 2 Ω e 3 Ω em paralelo. Qual é a corrente total da fonte? | 5 | A | Os dois ficam com 6 V: $\frac{6}{2} = 3$ A e $\frac{6}{3} = 2$ A. Total: $3 + 2 = 5$ A.

<textarea class="etapa">
n: 2
titulo: Capacitor e indutor: os dois elementos com memória
sobre: Por que a tensão no capacitor e a corrente no indutor não pulam, e o que eles viram depois de muito tempo.
=== texto
Resistores reagem na hora. Capacitores e indutores, não: eles guardam energia e têm **inércia**. Esta etapa é a base de tudo.

| | Capacitor ($C$, em farads) | Indutor ($L$, em henrys) |
|---|---|---|
| Equação | $i_C = C\,\dfrac{dv_C}{dt}$ | $v_L = L\,\dfrac{di_L}{dt}$ |
| Guarda energia em | campo elétrico: $\frac{1}{2}Cv^2$ | campo magnético: $\frac{1}{2}Li^2$ |
| O que **não pula** | a **tensão** $v_C$ | a **corrente** $i_L$ |
| Em regime CC vira | **circuito aberto** | **curto-circuito** (fio) |

### Por que não pula?
Se a tensão no capacitor pulasse de 2 V para 10 V num instante, $\frac{dv_C}{dt}$ seria infinito, e a corrente $C\,\frac{dv_C}{dt}$ também. Isso não existe. Por isso:

$$v_C(0^+) = v_C(0^-) \qquad\qquad i_L(0^+) = i_L(0^-)$$

Pense no capacitor como uma **caixa d'água**: o nível (a tensão) sobe ou desce, mas nunca muda de repente. E no indutor como uma **roda pesada girando**: a velocidade (a corrente) não para do nada.

> Atenção: é só isso que não pula. A **corrente** no capacitor e a **tensão** no indutor podem pular à vontade. Tensões e correntes em resistores também.

### "Bastante tempo depois": o regime permanente
Quando o enunciado diz que a chave estava fechada "há bastante tempo", tudo já parou de mudar. As derivadas são zero:

- $\frac{dv_C}{dt} = 0 \Rightarrow i_C = 0$: o capacitor é um **circuito aberto**.
- $\frac{di_L}{dt} = 0 \Rightarrow v_L = 0$: o indutor é um **curto-circuito**.

### Veja acontecendo
No laboratório abaixo, clique na chave quando quiser, até no meio da carga. A tela é um osciloscópio. Repare: a curva **verde** (a grandeza com memória) nunca dá saltos, e a **azul** salta toda vez que a chave muda.

@w bancada
=== treino
? Um capacitor está com 8 V em $t = 0^-$ e uma chave muda em $t = 0$. Quanto vale $v_C(0^+)$? | 8 | V | A tensão no capacitor não pula: $v_C(0^+) = v_C(0^-) = 8$ V.
? Depois de bastante tempo ligado em CC, quanto vale a corrente num capacitor? | 0 | A | Em regime CC o capacitor é circuito aberto: $i_C = 0$.
? Depois de bastante tempo ligado em CC, quanto vale a tensão num indutor? | 0 | V | Em regime CC o indutor é um curto: $v_L = 0$.
</textarea>

n: 3
titulo: As três fotografias: 0⁻, 0⁺ e ∞
sobre: O método que resolve a 1ª questão de toda P3: congelar o circuito antes, logo depois e muito depois da chave.
=== texto
Quase toda primeira questão da P3 pede valores em três instantes. O truque é tirar três "fotografias" do circuito. Cada foto é um circuito só de resistores e fontes, que você resolve com a etapa 1.

| Foto | Chave | Capacitor vira | Indutor vira |
|---|---|---|---|
| $t = 0^-$ (logo antes) | posição **antiga** | circuito aberto | curto |
| $t = 0^+$ (logo depois) | posição **nova** | fonte de tensão $v_C(0^-)$ | fonte de corrente $i_L(0^-)$ |
| $t \to \infty$ (muito depois) | posição **nova** | circuito aberto | curto |

### A ordem importa
1. **Sempre comece pelo $0^-$.** É dele que sai a "memória": $v_C(0^-)$ ou $i_L(0^-)$.
2. **No $0^+$**, coloque essa memória como uma fonte e resolva o circuito novo. Qualquer outra grandeza em $0^+$ (corrente num resistor, $i_C$, $v_L$) sai dessa foto.
3. **No $\infty$**, esqueça a memória: é regime de novo, só que com a chave na posição nova.

> Repare que o $0^+$ não é regime: o capacitor tem corrente e o indutor tem tensão. Por isso eles viram **fontes**, e não aberto ou curto.

### Explore
Este é o circuito da 1ª questão da P3 2026.1. Troque de foto nas abas e acompanhe a corrente andando pelos fios (azul). Os valores pedidos na prova aparecem embaixo de cada foto.

@w fotos q261a

### Lendo as fotos
- Em $0^-$ a chave fechada é um atalho para a terra, e o indutor em curto leva o nó da direita para 0 V também. Por isso $i_{10}(0^-) = 0$ e os 6 A passam todos pelo indutor.
- Em $0^+$ o indutor "lembra" os 6 A. Eles não têm para onde ir a não ser pelo 5 Ω: $v_5 = 30$ V. E o nó da direita fica em 0 V, então $v_L = 0 - 30 = -30$ V.
- Em $\infty$ os 6 A se dividem entre o 10 Ω e o ramo de 5 Ω: $i_L = 6 \cdot \frac{10}{15} = 4$ A.

<textarea class="etapa">
n: 4
titulo: A constante de tempo τ
sobre: Quão rápido o circuito muda. Resistência equivalente com as fontes zeradas.
=== texto
Depois da chave, o circuito vai de $x(0^+)$ até $x(\infty)$. A **constante de tempo** $\tau$ (em segundos) diz o quão rápido:

$$\tau_{RC} = R_{eq}\,C \qquad\qquad \tau_{RL} = \frac{L}{R_{eq}}$$

Cuidado para não inverter: no RL a resistência fica **embaixo**. (Truque: resistência grande "segura" o capacitor e deixa a carga lenta, mas "freia" o indutor e deixa tudo rápido.)

### Achando o $R_{eq}$ em 4 passos
1. Use o circuito de **depois da chave** ($t > 0$).
2. Tire o capacitor ou o indutor. Os dois terminais que ficaram são de onde você vai "olhar".
3. **Zere as fontes**: fonte de tensão vira **fio** (curto). Fonte de corrente vira **circuito aberto**.
4. Simplifique série e paralelo até sobrar um resistor só, visto dos dois terminais.

> Por que zerar as fontes? O $\tau$ é o "jeito" do circuito responder, e isso depende só dos resistores e do elemento, não de quem está empurrando a corrente.

### Explore
P3 2024.1, 2ª questão: veja a aba **τ**. A fonte de 18 V vira fio, então o 6 Ω e o 3 Ω ficam em paralelo (2 Ω), e esse paralelo fica em série com o 4 Ω: $R_{eq} = 6\ \Omega$ e $\tau = \frac{1{,}5}{6} = 0{,}25$ s.

@w fotos q241b

### Duas pegadinhas que já caíram
- **Fonte de corrente vira aberta** (P3 2026.1): com a fonte de 6 A aberta, o 10 Ω e o 5 Ω ficam em **série**: $R_{eq} = 15\ \Omega$.
- **Resistor em paralelo com fonte de tensão some** (P3 2025.1, 2ª questão): quando a fonte de 3 V vira fio, o 2 Ω que estava em paralelo com ela fica com os dois terminais na terra. Ele não conduz e sai da conta: $R_{eq} = 1\ \Omega$.

@ver 2026-1:1 2025-2:2 2024-1:2 2025-1:2
=== treino
? P3 2025.2 (2ª questão): para $t > 0$, o capacitor de 1 F vê a fonte de 10 V por 4 Ω e 2 Ω em série. Quanto vale $\tau$? | 6 | s | Fonte zerada vira fio: $R_{eq} = 4 + 2 = 6\ \Omega$, $\tau = 6 \cdot 1 = 6$ s.

<textarea class="etapa">
n: 5
titulo: A fórmula da 1ª ordem e o gráfico
sobre: Uma fórmula só para qualquer tensão ou corrente, e como esboçar o gráfico que vale ponto.
=== texto
Com as três fotos e o $\tau$, você escreve qualquer grandeza do circuito para $t > 0$:

<div class="formula">

$$x(t) = x(\infty) + \big[x(0^+) - x(\infty)\big]\,e^{-t/\tau}$$

</div>

- Vale para **qualquer** tensão ou corrente do circuito de 1ª ordem: $v_C$, $i_L$, $i_C$, $v_L$, corrente num resistor...
- Use o valor em $0^+$ **daquela grandeza**, e não em $0^-$. Para $v_C$ e $i_L$ tanto faz (são iguais), mas para as outras faz toda a diferença.

Exemplo (P3 2026.1): $i_L(0^+) = 6$ A, $i_L(\infty) = 4$ A, $\tau = 0{,}1$ s:

$$i_L(t) = 4 + (6 - 4)\,e^{-t/0{,}1} = 4 + 2\,e^{-10t}\ \text{A}$$

### Quanto falta depois de cada τ

| Tempo | $e^{-t/\tau}$ | Já percorreu |
|---|---|---|
| $\tau$ | 0,368 | 63% |
| $2\tau$ | 0,135 | 86% |
| $3\tau$ | 0,050 | 95% |
| $5\tau$ | 0,007 | mais de 99%: "acabou" |

### Esboçando o gráfico na prova
1. Eixos com nome e unidade: $t$ (s) na horizontal, a grandeza na vertical.
2. Marque $x(0^+)$ no eixo vertical, em $t = 0$.
3. Desenhe uma linha **tracejada** horizontal em $x(\infty)$: é a assíntota.
4. Marque $\tau$ (e se der, $5\tau$) no eixo do tempo.
5. Desenhe a curva saindo de $x(0^+)$ e "deitando" na assíntota. Em $t = \tau$ ela já fez 63% do caminho.
6. Se pedir o gráfico a partir de $t < 0$, desenhe uma reta em $x(0^-)$ antes do zero.

> Truque de desenho: a reta tangente à curva em $t = 0$ encosta na assíntota exatamente em $t = \tau$. Mexa no laboratório e veja.

@w curva

<textarea class="etapa">
n: 6
titulo: Sinais, setas e o que pode pular
sobre: As pegadinhas de sinal mais comuns e a pergunta "é igual em 0⁻ e 0⁺?".
=== texto
### A seta manda no sinal
Quem define o sinal de uma corrente é a **seta do desenho**, e o de uma tensão é o **+ e −** do desenho. Calcule o valor físico e depois compare com o desenho:

- Corrente andando no sentido da seta: positiva.
- Corrente andando contra a seta: **negativa**. Escreva o sinal na resposta.

Exemplo (P3 2025.2): em regime, a fonte de 6 V empurra 3 A pelo 2 Ω da **direita para a esquerda**, mas a seta de $i_2$ aponta para a direita. Resposta: $i_2(\infty) = -3$ A.

### Convenção passiva
As equações $v = Ri$, $i_C = C\frac{dv_C}{dt}$ e $v_L = L\frac{di_L}{dt}$ valem quando a seta da corrente **entra pelo +**. É o caso de quase todos os desenhos da P3. Se a seta entrar pelo −, ponha um sinal de menos: $i_C = -C\frac{dv_C}{dt}$.

> Na P3 2025.1 (3ª questão), a corrente $i$ atravessa o capacitor entrando pelo **−**. Por isso, ali, $i = -C\frac{dv}{dt}$.

### O que pode pular de $0^-$ para $0^+$

| Não pode pular | Pode pular |
|---|---|
| tensão no capacitor $v_C$ | corrente no capacitor $i_C$ |
| corrente no indutor $i_L$ | tensão no indutor $v_L$ |
| | tensão e corrente em qualquer resistor |
| | corrente numa fonte de tensão |

Pergunta clássica (P3 2025.2): **"$v_4(0^-) = v_4(0^+)$? Justifique."**

Resposta modelo: *Não. $v_4(0^-) = 8$ V e $v_4(0^+) = 5{,}33$ V. A tensão num resistor pode variar instantaneamente; só a tensão no capacitor e a corrente no indutor são contínuas.*

> Às vezes um valor de resistor **coincide** em $0^-$ e $0^+$, como $i_2 = 2$ A na P3 2025.1. Pode acontecer, mas não é garantido. Na dúvida, calcule as duas fotos.

### Derivadas em $0^+$
Elas vão aparecer na 2ª ordem, mas já dá para entender aqui:

$$\frac{dv_C}{dt}(0^+) = \frac{i_C(0^+)}{C} \qquad\qquad \frac{di_L}{dt}(0^+) = \frac{v_L(0^+)}{L}$$

O sinal de $v_L(0^+)$ diz se a corrente no indutor vai subir ($+$) ou cair ($-$).

titulo: 2ª ordem: o circuito RLC e o amortecimento
sobre: Quando o circuito tem L e C juntos. α, ω₀ e os três tipos de amortecimento.
=== texto
Se, depois da chave, o circuito tiver um **indutor e um capacitor** que não dá para juntar num só, ele é de **2ª ordem**. A grandeza obedece a uma equação assim:

$$\frac{d^2x}{dt^2} + 2\alpha\,\frac{dx}{dt} + \omega_0^2\,x = K$$

A resposta natural vem da **equação característica**:

<div class="formula">

$$s^2 + 2\alpha s + \omega_0^2 = 0 \quad\Rightarrow\quad s = -\alpha \pm \sqrt{\alpha^2 - \omega_0^2}$$

</div>

### Achando α e ω₀

| Circuito | $\alpha$ | $\omega_0$ |
|---|---|---|
| RLC **série** | $\dfrac{R}{2L}$ | $\dfrac{1}{\sqrt{LC}}$ |
| RLC **paralelo** | $\dfrac{1}{2RC}$ | $\dfrac{1}{\sqrt{LC}}$ |
| Equação $x'' + a\,x' + b\,x = K$ | $\dfrac{a}{2}$ | $\sqrt{b}$ |

Na P3 os circuitos de 2ª ordem foram **série**: depois da chave sobra uma malha só, com resistores, L e C. Some todos os resistores dessa malha (P3 2026.1: $40 + 60 = 100\ \Omega$).

### Os três tipos

| Comparação | Nome | Raízes | Resposta natural |
|---|---|---|---|
| $\alpha > \omega_0$ | **supercrítico** (superamortecido) | reais e diferentes | $A_1e^{s_1t} + A_2e^{s_2t}$ |
| $\alpha = \omega_0$ | **crítico** | real dupla, $s = -\alpha$ | $(A_1 + A_2\,t)\,e^{-\alpha t}$ |
| $\alpha < \omega_0$ | **subamortecido** | complexas, $-\alpha \pm j\omega_d$ | $e^{-\alpha t}(B_1\cos\omega_d t + B_2\sin\omega_d t)$ |

com $\omega_d = \sqrt{\omega_0^2 - \alpha^2}$ (frequência amortecida). Subamortecido é o único que **oscila**.

> Quando a questão pede para "caracterizar a resposta natural", escreva as três coisas: o tipo (com a comparação entre $\alpha$ e $\omega_0$), as raízes e a forma da resposta.

### Explore
Mexa no R, no L e no C. As raízes andam no plano complexo, e a curva muda de forma.

$$\alpha = \frac{1000}{2 \cdot 1} = 500\ \text{s}^{-1} \qquad \omega_0 = \frac{1}{\sqrt{1 \cdot 10^{-8}}} = 10^4\ \text{rad/s}$$

Como $\alpha < \omega_0$: **subamortecido**.

A solução completa é a **resposta forçada** mais a **natural**:

1. **$x(0^+)$**: pela continuidade ($v_C$ e $i_L$ não pulam). Foto de $0^-$, como na etapa 3.
2. **$\frac{dx}{dt}(0^+)$**: na foto de $0^+$, ache $v_L(0^+)$ ou $i_C(0^+)$ e use

$$\frac{di_L}{dt}(0^+) = \frac{v_L(0^+)}{L} \qquad\qquad \frac{dv_C}{dt}(0^+) = \frac{i_C(0^+)}{C}$$

3. **Resposta forçada $x_f$**: é o valor final (foto de $\infty$). Se a questão der a equação $x'' + a\,x' + b\,x = K$, as derivadas de uma constante são zero, então $b\,x_f = K \Rightarrow x_f = \frac{K}{b}$.
4. **Tipo e forma da natural**: etapa 7.
5. **Constantes**: some $x_f$ com a natural, e use $x(0^+)$ e $x'(0^+)$:

| Tipo | Equação de $x(0^+)$ | Equação de $x'(0^+)$ |
|---|---|---|
| supercrítico | $x_f + A_1 + A_2 = x(0^+)$ | $s_1A_1 + s_2A_2 = x'(0^+)$ |
| crítico | $x_f + A_1 = x(0^+)$ | $A_2 - \alpha A_1 = x'(0^+)$ |
| subamortecido | $x_f + B_1 = x(0^+)$ | $-\alpha B_1 + \omega_d B_2 = x'(0^+)$ |

> Erro clássico: usar $x(0^+)$ para achar $A_1$ e esquecer de descontar o $x_f$. A constante é $x(0^+) - x_f$.

### 1ª ordem (um C ou um L)

| | Capacitor | Indutor |
|---|---|---|
| Equação | $i_C = C\,\frac{dv_C}{dt}$ | $v_L = L\,\frac{di_L}{dt}$ |
| Não pula | $v_C(0^+) = v_C(0^-)$ | $i_L(0^+) = i_L(0^-)$ |
| Regime CC ($0^-$ e $\infty$) | aberto | curto |
| Em $0^+$ vira | fonte de tensão $v_C(0^-)$ | fonte de corrente $i_L(0^-)$ |
| Constante de tempo | $\tau = R_{eq}\,C$ | $\tau = \frac{L}{R_{eq}}$ |

$R_{eq}$: circuito de **depois** da chave, sem o C ou L, com as fontes zeradas (fonte de tensão vira fio, fonte de corrente vira aberto).

<div class="formula">

$$x(t) = x(\infty) + \big[x(0^+) - x(\infty)\big]\,e^{-t/\tau}$$

</div>

Vale para qualquer tensão ou corrente. Em $t = \tau$: 63% do caminho. Em $5\tau$: acabou.

Derivadas em $0^+$: $\frac{dv_C}{dt}(0^+) = \frac{i_C(0^+)}{C}$ e $\frac{di_L}{dt}(0^+) = \frac{v_L(0^+)}{L}$.

### 2ª ordem (L e C juntos)

$$x'' + 2\alpha\,x' + \omega_0^2\,x = K \qquad s^2 + 2\alpha s + \omega_0^2 = 0 \qquad s = -\alpha \pm \sqrt{\alpha^2 - \omega_0^2}$$

| | $\alpha$ | $\omega_0$ |
|---|---|---|
| RLC série | $\frac{R}{2L}$ | $\frac{1}{\sqrt{LC}}$ |
| RLC paralelo | $\frac{1}{2RC}$ | $\frac{1}{\sqrt{LC}}$ |
| $x'' + a\,x' + b\,x = K$ | $\frac{a}{2}$ | $\sqrt{b}$ |

| Tipo | Quando | $x(t) = x_f + \dots$ | Constantes |
|---|---|---|---|
| Supercrítico | $\alpha > \omega_0$ | $A_1e^{s_1t} + A_2e^{s_2t}$ | $A_1 + A_2 = x(0) - x_f$; $s_1A_1 + s_2A_2 = x'(0)$ |
| Crítico | $\alpha = \omega_0$ | $(A_1 + A_2t)\,e^{-\alpha t}$ | $A_1 = x(0) - x_f$; $A_2 - \alpha A_1 = x'(0)$ |
| Subamortecido | $\alpha < \omega_0$ | $e^{-\alpha t}(B_1\cos\omega_dt + B_2\sin\omega_dt)$ | $B_1 = x(0) - x_f$; $-\alpha B_1 + \omega_dB_2 = x'(0)$ |

$\omega_d = \sqrt{\omega_0^2 - \alpha^2}$. Resposta forçada: $x_f = x(\infty)$, ou $x_f = \frac{K}{b}$ pela equação.

### Sinais
- A seta do desenho manda: contra a seta, a resposta é **negativa**.
- Convenção passiva (seta entrando pelo +): $v = Ri$, $i_C = C\frac{dv}{dt}$, $v_L = L\frac{di}{dt}$. Entrando pelo −, ponha um sinal de menos.
- Podem pular de $0^-$ para $0^+$: $i_C$, $v_L$ e tudo nos resistores. Não pulam: $v_C$ e $i_L$.

<script>
'use strict';
/* ============================================================
   Motor de circuitos: análise nodal modificada (MNA) em CC
   e transitórios de 1ª e 2ª ordem.
   Coordenadas em "grade". Cada ponto da grade é um nó.
   Convenções de cada elemento (de a para b):
   - R: corrente a→b, tensão Va−Vb
   - V: a = −, b = +; corrente medida de a para b por dentro (sai pelo +)
   - I: a corrente passa pela fonte de a para b (a seta aponta para b)
   - C, L: a é o terminal +; corrente a→b (convenção passiva)
   - SW: chave entre a e b; SPDT: comum c, posições A e B
   - W: fio (lista de pontos)
   ============================================================ */
const MOTOR = (() => {
  const chave = p => p[0] + ',' + p[1];
  const eps = 1e-9;

  function noSegmento(p, a, b) {
    if (a[0] === b[0] && p[0] === a[0]) return p[1] > Math.min(a[1], b[1]) + eps && p[1] < Math.max(a[1], b[1]) - eps;
    if (a[1] === b[1] && p[1] === a[1]) return p[0] > Math.min(a[0], b[0]) + eps && p[0] < Math.max(a[0], b[0]) - eps;
    return false;
  }

  /* Lista todos os pontos com terminais e quebra os fios nesses pontos. */
  function preparar(circ) {
    const pontos = new Map();
    const add = p => pontos.set(chave(p), p);
    for (const e of circ.elementos) {
      if (e.t === 'W') e.p.forEach(add);
      else if (e.t === 'SPDT') [e.c, e.A, e.B].forEach(add);
      else { add(e.a); add(e.b); }
    }
    const segmentos = [];
    for (const e of circ.elementos) {
      if (e.t !== 'W') continue;
      for (let i = 0; i < e.p.length - 1; i++) {
        const a = e.p[i], b = e.p[i + 1];
        const dentro = [...pontos.values()].filter(p => noSegmento(p, a, b));
        dentro.sort((p, q) => (Math.abs(p[0] - a[0]) + Math.abs(p[1] - a[1])) - (Math.abs(q[0] - a[0]) + Math.abs(q[1] - a[1])));
        const seq = [a, ...dentro, b];
        for (let k = 0; k < seq.length - 1; k++) segmentos.push({ a: seq[k], b: seq[k + 1] });
      }
    }
    return { pontos, segmentos };
  }

  /* Resolve um circuito resistivo. ramos: {tipo:'G'|'E'|'J', a, b, valor, ref} */
  function resolver(circ, ramos) {
    const { pontos } = preparar(circ);
    const terra = chave(circ.terra);
    const idx = new Map();
    let n = 0;
    for (const k of pontos.keys()) if (k !== terra) idx.set(k, n++);
    const nE = ramos.filter(r => r.tipo === 'E').length;
    const N = n + nE;
    const A = Array.from({ length: N }, () => new Float64Array(N));
    const z = new Float64Array(N);
    const I = p => { const k = chave(p); return k === terra ? -1 : idx.get(k); };
    for (let i = 0; i < n; i++) A[i][i] += 1e-10;   // gmin: evita nós flutuantes
    let e = 0;
    const posE = new Map();
    for (const r of ramos) {
      const a = I(r.a), b = I(r.b);
      if (r.tipo === 'G') {
        if (a >= 0) A[a][a] += r.valor;
        if (b >= 0) A[b][b] += r.valor;
        if (a >= 0 && b >= 0) { A[a][b] -= r.valor; A[b][a] -= r.valor; }
      } else if (r.tipo === 'J') {
        if (a >= 0) z[a] -= r.valor;
        if (b >= 0) z[b] += r.valor;
      } else {
        const k = n + e++;
        posE.set(r, k);
        // corrente x flui de a para b por dentro do ramo: sai do nó b, entra... (sai de a)
        if (a >= 0) { A[a][k] += 1; A[k][a] -= 1; }
        if (b >= 0) { A[b][k] -= 1; A[k][b] += 1; }
        z[k] = r.valor;   // Vb − Va = valor
      }
    }
    const x = gauss(A, z);
    const V = p => { const i = I(p); return i < 0 ? 0 : x[i]; };
    const corrente = r => {
      if (r.tipo === 'G') return (V(r.a) - V(r.b)) * r.valor;
      if (r.tipo === 'J') return r.valor;
      return x[posE.get(r)];
    };
    return { V, corrente };
  }

  function gauss(A, b) {
    const n = b.length;
    const M = A.map((l, i) => [...l, b[i]]);
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let l = c + 1; l < n; l++) if (Math.abs(M[l][c]) > Math.abs(M[p][c])) p = l;
      [M[c], M[p]] = [M[p], M[c]];
      const piv = M[c][c];
      if (Math.abs(piv) < 1e-14) continue;
      for (let l = 0; l < n; l++) {
        if (l === c) continue;
        const f = M[l][c] / piv;
        if (f) for (let k = c; k <= n; k++) M[l][k] -= f * M[c][k];
      }
    }
    return M.map((l, i) => Math.abs(l[i]) < 1e-14 ? 0 : l[n] / l[i]);
  }

  /*
    Monta os ramos para uma situação:
    modo: 'regime' (C aberto, L curto), 'inicial' (C = fonte vC, L = fonte iL), 'zerado' (fontes zeradas, para Req)
    chaves: 'antes' ou 'depois'
    estado: { [idC]: vC, [idL]: iL } para o modo inicial
  */
  function ramos(circ, { modo, chaves, estado = {}, zerar = false, teste = null }) {
    const { segmentos } = preparar(circ);
    const rs = [];
    const lig = new Map();   // elemento → ramo (para medir)
    for (const s of segmentos) rs.push({ tipo: 'E', a: s.a, b: s.b, valor: 0, fio: true });
    for (const e of circ.elementos) {
      let r = null;
      if (e.t === 'R') r = { tipo: 'G', a: e.a, b: e.b, valor: 1 / e.valor };
      if (e.t === 'V') r = { tipo: 'E', a: e.a, b: e.b, valor: zerar ? 0 : e.valor };
      if (e.t === 'I') r = zerar ? null : { tipo: 'J', a: e.a, b: e.b, valor: e.valor };
      if (e.t === 'SW') {
        const st = e[chaves];
        if (st === 'fechada') r = { tipo: 'E', a: e.a, b: e.b, valor: 0 };
      }
      if (e.t === 'SPDT') {
        const pos = e[chaves];
        if (pos === 'A' || pos === 'B') r = { tipo: 'E', a: e.c, b: e[pos], valor: 0 };
      }
      if (e.t === 'C') {
        if (teste === e.id) r = { tipo: 'J', a: e.b, b: e.a, valor: 1 };
        else if (modo === 'inicial') r = { tipo: 'E', a: e.b, b: e.a, valor: estado[e.id] || 0, inv: true };
      }
      if (e.t === 'L') {
        if (teste === e.id) r = { tipo: 'J', a: e.b, b: e.a, valor: 1 };
        else if (modo === 'inicial') r = { tipo: 'J', a: e.a, b: e.b, valor: estado[e.id] || 0 };
        else r = { tipo: 'E', a: e.a, b: e.b, valor: 0 };
      }
      if (r) { rs.push(r); lig.set(e.id, r); }
    }
    return { rs, lig, segmentos };
  }

  /* Fotografia do circuito: tensões de nó e corrente/tensão de cada elemento. */
  function foto(circ, opcoes) {
    const { rs, lig, segmentos } = ramos(circ, opcoes);
    const sol = resolver(circ, rs);
    const el = {};
    for (const e of circ.elementos) {
      if (!e.id) continue;
      const r = lig.get(e.id);
      let i = 0;
      if (r) {
        i = sol.corrente(r);
        if (r.inv) i = -i;             // fonte que substitui o C está ao contrário
      }
      if (e.t === 'SPDT') { el[e.id] = { i, v: 0 }; continue; }
      const v = sol.V(e.a) - sol.V(e.b);
      el[e.id] = { i, v };
    }
    const fios = segmentos.map((s, k) => ({ a: s.a, b: s.b, i: sol.corrente(rs[k]) }));
    return { V: sol.V, el, fios, ramos: rs, lig, sol };
  }

  function armazenadores(circ) { return circ.elementos.filter(e => e.t === 'C' || e.t === 'L'); }

  /* Resistência equivalente vista pelos terminais de um elemento (fontes zeradas, chaves depois). */
  function req(circ, id) {
    const f = foto(circ, { modo: 'zerado', chaves: 'depois', zerar: true, teste: id, estado: {} });
    // teste injeta 1 A em a (entra por a vindo de b): Req = Va − Vb
    const e = circ.elementos.find(x => x.id === id);
    return f.V(e.a) - f.V(e.b);
  }

  /*
    Análise completa do transitório.
    Retorna as fotos (antes, inicial, final), o estado inicial e a dinâmica:
    1ª ordem: tau; 2ª ordem: alfa, w0, raízes e matriz de estado.
  */
  function analisar(circ) {
    const arm = armazenadores(circ);
    const antes = foto(circ, { modo: 'regime', chaves: 'antes' });
    const estado = {};
    for (const e of arm) estado[e.id] = e.t === 'C' ? antes.el[e.id].v : antes.el[e.id].i;
    const inicial = foto(circ, { modo: 'inicial', chaves: 'depois', estado });
    const final = foto(circ, { modo: 'regime', chaves: 'depois' });
    const res = { antes, inicial, final, estado, arm };
    if (arm.length === 1) {
      const e = arm[0];
      const R = req(circ, e.id);
      res.req = R;
      res.tau = e.t === 'C' ? R * e.valor : e.valor / R;
      res.ordem = 1;
    } else if (arm.length === 2) {
      // matriz de estado: x = [vC, iL]; dvC/dt = iC/C; diL/dt = vL/L
      const C = arm.find(e => e.t === 'C'), L = arm.find(e => e.t === 'L');
      const unit = (vc, il) => foto(circ, { modo: 'inicial', chaves: 'depois', zerar: true, estado: { [C.id]: vc, [L.id]: il } });
      const f1 = unit(1, 0), f2 = unit(0, 1);
      const M = [
        [f1.el[C.id].i / C.valor, f2.el[C.id].i / C.valor],
        [f1.el[L.id].v / L.valor, f2.el[L.id].v / L.valor],
      ];
      const tr = M[0][0] + M[1][1], det = M[0][0] * M[1][1] - M[0][1] * M[1][0];
      res.ordem = 2;
      res.M = M;
      res.alfa = -tr / 2;
      res.w0 = Math.sqrt(det);
      res.C = C; res.L = L;
      res.derivadas = { [C.id]: inicial.el[C.id].i / C.valor, [L.id]: inicial.el[L.id].v / L.valor };
      res.unit = unit;
    }
    return res;
  }

  /* Valor de uma medida numa foto. medida: {el:'id', q:'i'|'v'} */
  function medir(f, m) { const x = f.el[m.el]; return m.q === 'v' ? x.v : x.i; }

  /* Derivada de uma medida em 0+ (2ª ordem): combinação linear das derivadas do estado. */
  function derivada(res, m) {
    const d = res.derivadas;
    const f = res.unit(d[res.C.id], d[res.L.id]);
    return medir(f, m);
  }

  /* Raízes e forma da resposta natural a partir de alfa e w0. */
  function amortecimento(alfa, w0) {
    const d = alfa * alfa - w0 * w0;
    const tol = 1e-6 * Math.max(1e-12, alfa * alfa, w0 * w0);
    if (Math.abs(d) <= tol) return { tipo: 'critico', s1: -alfa, s2: -alfa };
    if (d > 0) return { tipo: 'super', s1: -alfa + Math.sqrt(d), s2: -alfa - Math.sqrt(d) };
    return { tipo: 'sub', wd: Math.sqrt(-d), s1: -alfa, s2: -alfa };
  }

  /* Solução geral x(t) = xf + natural, com x(0)=x0 e x'(0)=dx0. */
  function solucao2(alfa, w0, xf, x0, dx0) {
    const am = amortecimento(alfa, w0);
    const y0 = x0 - xf;
    let f, k;
    if (am.tipo === 'super') {
      const { s1, s2 } = am;
      const A2 = (dx0 - s1 * y0) / (s2 - s1), A1 = y0 - A2;
      k = { A1, A2, s1, s2 };
      f = t => xf + A1 * Math.exp(s1 * t) + A2 * Math.exp(s2 * t);
    } else if (am.tipo === 'critico') {
      const A1 = y0, A2 = dx0 + alfa * y0;
      k = { A1, A2 };
      f = t => xf + (A1 + A2 * t) * Math.exp(-alfa * t);
    } else {
      const B1 = y0, B2 = (dx0 + alfa * y0) / am.wd;
      k = { B1, B2, wd: am.wd };
      f = t => xf + Math.exp(-alfa * t) * (B1 * Math.cos(am.wd * t) + B2 * Math.sin(am.wd * t));
    }
    return { ...am, ...k, xf, f };
  }

/* ============================================================
   Desenho: texto (markdown + fórmulas), esquemas de circuito e osciloscópio
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Número no formato brasileiro, com até 4 algarismos significativos. */
function fmt(x, sig = 4) {
  if (x === null || x === undefined || Number.isNaN(x)) return '–';
  if (Math.abs(x) < 1e-9) return '0';
  const a = Math.abs(x);
  let s;
  if (a >= 1e5 || a < 1e-3) {
    const e = Math.floor(Math.log10(a));
    const m = +(x / 10 ** e).toPrecision(3);
    return `${String(m).replace('.', ',')}·10^${e}`;
  }
  s = String(+x.toPrecision(sig));
  return s.replace('-', '−').replace('.', ',');
}
const fmtTex = x => {
  const s = fmt(x).replace('−', '-');
  const m = s.match(/^(-?[\d,]+)·10\^(-?\d+)$/);
  if (m) return `${m[1].replace(',', '{,}')} \\cdot 10^{${m[2]}}`;
  return s.replace(',', '{,}');
};
const UN_TEX = { 'Ω': '\\Omega', 'A/s': '\\text{A/s}', 'V/s': '\\text{V/s}', '1/s': '\\text{s}^{-1}', 'rad/s': '\\text{rad/s}' };
const unTex = u => u ? '\\ ' + (UN_TEX[u] || `\\text{${u}}`) : '';

/* ---------- markdown com fórmulas ---------- */
function md(src) {
  const linhas = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  const especial = /^(```|### |> |- |\d+\. |@w |@q |@ver |\$\$|\||<)/;
  while (i < linhas.length) {
    const l = linhas[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith('<')) { out += l; i++; continue; }
    if (l.startsWith('$$')) {
      const buf = [l];
      if (!(l.length > 2 && l.trim().endsWith('$$') && l.trim() !== '$$')) {
        i++;
        while (i < linhas.length && !linhas[i].trim().endsWith('$$')) buf.push(linhas[i++]);
        if (i < linhas.length) buf.push(linhas[i]);
      }
      i++;
      out += `<div class="math-bloco">${esc(buf.join('\n'))}</div>`;
      continue;
    }
    if (l.startsWith('### ')) { out += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (l.startsWith('@q ')) { out += `<div class="widget" data-w="q" data-arg="${esc(l.slice(3).trim())}"></div>`; i++; continue; }
    if (l.startsWith('@w ')) {
      const [nome, ...args] = l.slice(3).trim().split(/\s+/);
      out += `<div class="widget" data-w="${esc(nome)}" data-arg="${esc(args.join(' '))}"></div>`; i++; continue;
    }
    if (l.startsWith('@ver ')) {
      const links = l.slice(5).trim().split(/\s+/).map(ref => {
        const [pid, qn] = ref.split(':');
        const p = PROVAS.find(x => x.id === pid);
        return p ? `<a href="#/prova/${pid}/${qn}">${esc(p.nome)}, ${qn}ª questão</a>` : '';
      }).join('');
      out += `<div class="ver"><span class="sr">Questões que usam isto:</span>${links}</div>`; i++; continue;
    }
    if (l.startsWith('|')) {
      const rows = [];
      while (i < linhas.length && linhas[i].startsWith('|')) rows.push(linhas[i++]);
      const cel = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const cab = cel(rows[0]);
      const corpo = rows.slice(2).map(cel);
      out += `<div class="tabela-wrap"><table><thead><tr>${cab.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${corpo.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }
    if (l.startsWith('> ')) {
      const buf = [];
      while (i < linhas.length && linhas[i].startsWith('>')) buf.push(linhas[i++].replace(/^> ?/, ''));
      out += `<aside class="nota">${md(buf.join('\n'))}</aside>`;
      continue;
    }
    if (/^(- |\d+\. )/.test(l)) {

const U = 58;
const FASE_CHAVE = { enunciado: 'antes', antes: 'antes', inicial: 'depois', final: 'depois', tau: 'depois', depois: 'depois' };

      } else {

/* ---------- osciloscópio ---------- */
function osciloscopio({ curvas, t0 = 0, t1, antes = null, marcas = {}, rotY = '', un = '', rotT = 't (s)', altura = 250, legenda = null }) {
  const W = 640, H = altura, ml = 62, mr = 16, mt = 28, mb = 32;
  const N = 360;
  const amostras = curvas.map(c => {
    const pts = [];
    for (let k = 0; k <= N; k++) { const t = Math.max(0, t0) + (t1 - Math.max(0, t0)) * k / N; pts.push([t, c.f(t)]); }
    return pts;
  });

  const pad = (ymax - ymin) * 0.12;
  ymin -= pad; ymax += pad;
  const X = t => ml + (t - t0) / (t1 - t0) * (W - ml - mr);
  const Y = y => mt + (ymax - y) / (ymax - ymin) * (H - mt - mb);
  let s = '';
  for (let k = 0; k <= 10; k++) { const x = ml + k * (W - ml - mr) / 10; s += `<line class="osc-grade" x1="${x}" y1="${mt}" x2="${x}" y2="${H - mb}"/>`; }
  for (let k = 0; k <= 6; k++) { const y = mt + k * (H - mt - mb) / 6; s += `<line class="osc-grade" x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}"/>`; }
  if (ymin < 0 && ymax > 0) s += `<line class="osc-eixo" x1="${ml}" y1="${Y(0)}" x2="${W - mr}" y2="${Y(0)}"/>`;
  if (t0 < 0) s += `<line class="osc-eixo" x1="${X(0)}" y1="${mt}" x2="${X(0)}" y2="${H - mb}"/>`;
  // marcas de tempo
  if (marcas.tau) {
    for (let k = 1; k <= 5; k++) {
      const t = k * marcas.tau;
      if (t > t1) break;
      s += `<text class="osc-txt" x="${X(t)}" y="${H - mb + 18}" text-anchor="middle">${k === 1 ? 'τ' : k + 'τ'}</text>`;
      if (k === 1) s += `<line class="osc-guia" x1="${X(t)}" y1="${mt}" x2="${X(t)}" y2="${H - mb}"/>`;
    }
  } else {
    for (let k = 0; k <= 4; k++) { const t = t0 + (t1 - t0) * k / 4; s += `<text class="osc-txt" x="${X(t)}" y="${H - mb + 18}" text-anchor="middle">${fmt(t, 3)}</text>`; }
  }
  s += `<text class="osc-txt" x="${X(0)}" y="${H - mb + 18}" text-anchor="middle">0</text>`;
  s += `<text class="osc-txt" x="${W - mr}" y="17" text-anchor="end">${esc(rotT)}</text>`;
  // valores no eixo vertical
  const marcaY = (v, forte) => `<text class="osc-txt${forte ? ' forte' : ''}" x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  const yVals = new Set();
  if (marcas.assintota !== undefined) {
    s += `<line class="osc-guia" x1="${ml}" y1="${Y(marcas.assintota)}" x2="${W - mr}" y2="${Y(marcas.assintota)}"/>`;
    yVals.add(marcas.assintota);
  }
  if (marcas.inicio !== undefined) yVals.add(marcas.inicio);
  if (antes !== null) yVals.add(antes);
  const lista = [...yVals].sort((a, b) => b - a);
  let ultimo = -1e9;
  for (const v of lista) { const y = Y(v); if (Math.abs(y - ultimo) > 14) { s += marcaY(v, true); ultimo = y; } }
  if (!lista.length) { s += marcaY(ymax - pad, false); s += marcaY(ymin + pad, false); }
  if (marcas.tangente) {
    const { x0, xinf, tau } = marcas.tangente;
    s += `<line class="osc-guia" x1="${X(0)}" y1="${Y(x0)}" x2="${X(tau)}" y2="${Y(xinf)}" style="stroke-dasharray:2 4"/>`;
  }
  if (marcas.envelope) for (const e of marcas.envelope) {
    let d1 = '', d2 = '';
    const cl = y => Math.max(ymin, Math.min(ymax, y));
    for (let k = 0; k <= 80; k++) { const t = t1 * k / 80; d1 += `${k ? 'L' : 'M'} ${X(t)} ${Y(cl(e.base + e.f(t)))} `; d2 += `${k ? 'L' : 'M'} ${X(t)} ${Y(cl(e.base - e.f(t)))} `; }
    s += `<path class="osc-guia" d="${d1}"/><path class="osc-guia" d="${d2}"/>`;
  }
  if (antes !== null && t0 < 0) {
    s += `<path class="osc-antes" d="M ${X(t0)} ${Y(antes)} L ${X(0)} ${Y(antes)}"/>`;
    const ini = curvas[0].f(0);
    if (Math.abs(ini - antes) > 1e-9) s += `<line class="osc-guia" x1="${X(0)}" y1="${Y(antes)}" x2="${X(0)}" y2="${Y(ini)}"/>`;
  }
  amostras.forEach((pts, k) => {
    const d = pts.map((p, j) => `${j ? 'L' : 'M'} ${X(p[0]).toFixed(1)} ${Y(Math.max(ymin, Math.min(ymax, p[1]))).toFixed(1)}`).join(' ');
    s += `<path class="osc-traco${k ? ' t2' : ''}" d="${d}"/>`;
  });
  if (rotY) s += `<text class="osc-txt forte" x="8" y="17">${esc(rotY)}${un ? ' (' + esc(un) + ')' : ''}</text>`;
  const leg = legenda ? `<div class="osc-legenda">${legenda}</div>` : '';
  return `<div class="osc"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico ${esc(rotY)}">${s}</svg>${leg}</div>`;
}

/* Gráfico de uma grandeza de 1ª ordem a partir da análise do circuito. */
function grafico1(res, g) {
  const m = { el: g.el, q: g.q };
  const xm = MOTOR.medir(res.antes, m), x0 = MOTOR.medir(res.inicial, m), xi = MOTOR.medir(res.final, m), tau = res.tau;
  const f = t => xi + (x0 - xi) * Math.exp(-t / tau);
  return osciloscopio({
    curvas: [{ f }], t0: -0.6 * tau, t1: 5.2 * tau, antes: xm, rotY: g.nome.replace('_', ''), un: g.un,
    marcas: { tau, assintota: xi, inicio: x0, tangente: { x0, xinf: xi, tau } },
    legenda: `<span><i style="background:var(--traco)"></i>${esc(g.nome.replace('_', ''))}(t) = ${fmt(xi)} ${x0 - xi < 0 ? '−' : '+'} ${fmt(Math.abs(x0 - xi))}·e^(−t/${fmt(tau)})</span><span>τ = ${fmt(tau)} s</span>`,
  });
}
/* Gráfico de 2ª ordem a partir de uma solução de MOTOR.solucao2. */
function grafico2(sol, nome, un) {
  const lento = sol.tipo === 'super' ? Math.min(Math.abs(sol.s1), Math.abs(sol.s2)) : Math.abs(sol.s1);
  let t1 = 6 / Math.max(lento, 1e-9);
  if (sol.tipo === 'sub') t1 = Math.min(t1, 4 * 2 * Math.PI / sol.wd + 2 / Math.abs(sol.s1));
  const env = sol.tipo === 'sub' && sol.wd > 0.5 * Math.abs(sol.s1) ? [{ base: sol.xf, f: t => Math.hypot(sol.B1, sol.B2) * Math.exp(sol.s1 * t) }] : null;
  return osciloscopio({
    curvas: [{ f: sol.f }], t0: 0, t1, rotY: nome, un,
    marcas: { assintota: sol.xf, inicio: sol.f(0), envelope: env },
    legenda: `<span><i style="background:var(--traco)"></i>${esc(nome)}(t)</span><span>${{ super: 'supercrítico', critico: 'crítico', sub: 'subamortecido' }[sol.tipo]}</span>${env ? '<span>tracejado: envelope e^(−αt)</span>' : ''}`,
  });
}

const ETAPAS = $$('textarea.etapa').map(ta => {
  const partes = ta.value.split(/^=== *(\w+) *$/m);
  const e = {};
  for (const l of partes[0].split('\n')) { const m = l.match(/^(\w+):\s*(.*)$/); if (m) e[m[1]] = m[2].trim(); }
  for (let i = 1; i < partes.length; i += 2) e[partes[i]] = partes[i + 1].trim();
  e.treino = (e.treino || '').split('\n').filter(l => l.startsWith('? ')).map(l => {

/* ---------- números digitados: aceita 1,5  4/3  -9.6  2m  10^4 ---------- */
function parseNum(txt) {
  if (txt === undefined || txt === null) return NaN;
  let s = String(txt).trim().replace(/−/g, '-').replace(/×/g, '*').replace(/\s+/g, '').replace(/,/g, '.');
  const sufixo = { m: 1e-3, k: 1e3, u: 1e-6, µ: 1e-6, n: 1e-9 };
  const ms = s.match(/^(.*\d)([mkuµn])$/);
  let mult = 1;
  if (ms) { s = ms[1]; mult = sufixo[ms[2]]; }
  let i = 0;
  const ver = () => s[i];
  function expr() { let v = termo(); while (ver() === '+' || ver() === '-') { const o = s[i++]; const w = termo(); v = o === '+' ? v + w : v - w; } return v; }
  function termo() { let v = pot(); while (ver() === '*' || ver() === '/') { const o = s[i++]; const w = pot(); v = o === '*' ? v * w : v / w; } return v; }
  function pot() { let v = un(); if (ver() === '^') { i++; v = Math.pow(v, pot()); } return v; }
  function un() { if (ver() === '-') { i++; return -un(); } if (ver() === '+') { i++; return un(); } return prim(); }
  function prim() {
    if (ver() === '(') { i++; const v = expr(); if (ver() === ')') i++; return v; }
    const m = s.slice(i).match(/^\d*\.?\d+(e[-+]?\d+)?/i);
    if (!m) throw new Error('número');
    i += m[0].length;
    return parseFloat(m[0]);
  }
  try { const v = expr(); return i === s.length ? v * mult : NaN; } catch (e) { return NaN; }
}
function confere(x, v) {
  if (!Number.isFinite(x)) return false;
  if (Math.abs(v) < 1e-6) return Math.abs(x) < 1e-3;
  return Math.abs(x - v) <= 0.02 * Math.abs(v) + 1e-9;
}

/* ---------- registro de circuitos usados na tela ---------- */
const REG = new Map();

const cacheRes = new WeakMap();
function analise(circ) { if (!cacheRes.has(circ)) cacheRes.set(circ, MOTOR.analisar(circ)); return cacheRes.get(circ); }

const NOME_FASE = { enunciado: 'Circuito', antes: 't = 0⁻', inicial: 't = 0⁺', final: 't → ∞', tau: 'τ', depois: 't > 0 (RLC)' };
function textoFase(fase, res, circ) {
  const temC = circ.elementos.some(e => e.t === 'C'), temL = circ.elementos.some(e => e.t === 'L');
  const quem = [temC ? 'capacitor' : '', temL ? 'indutor' : ''].filter(Boolean).join(' e ');
  if (fase === 'enunciado') return 'O circuito como está na prova, com a chave na posição de antes de t = 0.';
  if (fase === 'antes') return `Regime antes da chave: ${[temC ? 'capacitor = <b>aberto</b>' : '', temL ? 'indutor = <b>curto</b>' : ''].filter(Boolean).join(', ')}. Daqui sai a "memória" do ${quem}.`;
  if (fase === 'inicial') return `Logo depois da chave: ${[temC ? 'o capacitor vira <b>fonte de tensão</b> com o valor de 0⁻' : '', temL ? 'o indutor vira <b>fonte de corrente</b> com o valor de 0⁻' : ''].filter(Boolean).join('; ')}.`;
  if (fase === 'final') return `Regime depois da chave: ${[temC ? 'capacitor = <b>aberto</b>' : '', temL ? 'indutor = <b>curto</b>' : ''].filter(Boolean).join(', ')} de novo.`;
  if (fase === 'tau') return `Fontes zeradas (tensão vira fio, corrente vira aberta), olhando dos terminais do ${quem}: R<sub>eq</sub> = ${fmt(res.req)} Ω, então τ = ${fmt(res.tau)} s.`;
  if (fase === 'depois') return `Para t > 0: α = ${fmt(res.alfa)} s⁻¹ e ω₀ = ${fmt(res.w0)} rad/s.`;
  return '';
}
function valoresFase(fase, res, anot) {
  const foto = res && FASE_FOTO[fase] ? res[FASE_FOTO[fase]] : null;
  if (!foto) return '';
  const cls = { antes: 'antes', inicial: 'inicial', final: 'final' }[fase];

    const v = a.t === 'i' ? foto.el[a.el].i : foto.el[a.el].v;
    return `<span style="color:var(--f-${cls})">${rotSVGtxt(a.txt)}(${{ antes: '0⁻', inicial: '0⁺', final: '∞' }[fase]}) = ${fmt(v)} ${a.t === 'i' ? 'A' : 'V'}</span>`;
  }).join('')}</div>`;
}
const rotSVGtxt = t => esc(t).replace(/_(\w+)/, '<sub>$1</sub>');

/* Explorador: abas de fase + esquema + leitura. */
function explorador(circ, anot, ordem, faseIni = 'enunciado') {

function bancadaDesenhar() {

    <text class="osc-txt" x="10" y="16">${BANC.modo === 'RC' ? 'vC: 0 a 10 V' : 'iL: 0 a 5 A'}</text><text class="osc-txt" x="630" y="16" text-anchor="end">${BANC.modo === 'RC' ? 'iC: −5 a 5 A' : 'vL: −10 a 10 V'}</text></svg>

function gradeOsc(W, H) {
  let s = '';
  for (let k = 0; k <= 12; k++) s += `<line class="osc-grade" x1="${k * W / 12}" y1="0" x2="${k * W / 12}" y2="${H}"/>`;
  for (let k = 0; k <= 6; k++) s += `<line class="osc-grade" x1="0" y1="${k * H / 6}" x2="${W}" y2="${k * H / 6}"/>`;
  return s + `<line class="osc-eixo" x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}"/>`;
}
function bancadaPasso(agora) {
  if (!$('#bancada')) { BANC.raf = 0; return; }
  const dt = Math.min(0.05, (agora - (BANC.ult || agora)) / 1000);
  BANC.ult = agora;
  BANC.t += dt;
  const tau = 1;
  let x, y;
  if (BANC.modo === 'RC') {
    const alvo = BANC.pos === 'A' ? 10 : 0;
    BANC.x += (alvo - BANC.x) * (1 - Math.exp(-dt / tau));
    x = BANC.x; y = (alvo - BANC.x) / 2;
  } else {
    const alvo = BANC.pos === 'A' ? 5 : 0;
    BANC.x += (alvo - BANC.x) * (1 - Math.exp(-dt / tau));
    x = BANC.x; y = BANC.pos === 'A' ? 10 - 2 * BANC.x : -2 * BANC.x;
  }
  BANC.hist.push([BANC.t, x, y]);
  while (BANC.hist.length && BANC.hist[0][0] < BANC.t - 6) BANC.hist.shift();
  const W = 640, H = 220;
  const X = t => W - (BANC.t - t) / 6 * W;
  const Y1 = BANC.modo === 'RC' ? v => H - 12 - v / 10 * (H - 24) : v => H - 12 - v / 5 * (H - 24);
  const Y2 = BANC.modo === 'RC' ? v => H / 2 - v / 5 * (H / 2 - 12) : v => H / 2 - v / 10 * (H / 2 - 12);
  const p1 = $('#banc-t1'), p2 = $('#banc-t2');
  if (p1) {
    p1.setAttribute('d', BANC.hist.map((h, k) => `${k ? 'L' : 'M'}${X(h[0]).toFixed(1)} ${Y1(h[1]).toFixed(1)}`).join(''));
    p2.setAttribute('d', BANC.hist.map((h, k) => `${k ? 'L' : 'M'}${X(h[0]).toFixed(1)} ${Y2(h[2]).toFixed(1)}`).join(''));
  }
  const leit = $('#banc-leit');
  if (leit && agora - (leit._t || 0) > 120) {
    leit._t = agora;
    leit.innerHTML = BANC.modo === 'RC'
      ? `<span style="color:var(--f-final)">v<sub>C</sub> = ${fmt(x, 3)} V</span><span class="li">i<sub>C</sub> = ${fmt(y, 3)} A</span>`
      : `<span style="color:var(--f-final)">i<sub>L</sub> = ${fmt(x, 3)} A</span><span class="lv">v<sub>L</sub> = ${fmt(y, 3)} V</span>`;
    const i = BANC.modo === 'RC' ? y : x;
    const max = 5;
    for (const f of $$('#banc-esq .esq-fluxo')) {
      const vel = Math.abs(i) / max;
      f.style.opacity = vel < 0.03 ? 0 : 0.85;
      f.style.animationDuration = (0.9 / (0.15 + 0.85 * vel)).toFixed(2) + 's';
    }
  }
  BANC.raf = requestAnimationFrame(bancadaPasso);
}
function bancadaIniciar() {
  if (!$('#bancada')) return;
  bancadaDesenhar();
  if (!BANC.raf) { BANC.ult = 0; BANC.raf = requestAnimationFrame(bancadaPasso); }
}

function rlcAtualizar() {
  const lab = $('#lab-rlc');
  const modo = $('[data-acao=rlc-modo][aria-pressed=true]', lab).dataset.valor;
  const bonito = v => +(10 ** parseFloat(v)).toPrecision(2);
  const R = bonito($('#r-R').value), L = bonito($('#r-L').value), C = bonito($('#r-C').value);

  const alfa = modo === 'serie' ? R / (2 * L) : 1 / (2 * R * C), w0 = 1 / Math.sqrt(L * C);
  // tensão no capacitor, começando com 10 V e corrente zero no indutor
  const dx0 = modo === 'serie' ? 0 : -10 / (R * C);
  const sol = MOTOR.solucao2(alfa, w0, 0, 10, dx0);
  $('#rlc-osc').innerHTML = grafico2(sol, 'vC', 'V');
  const nome = { super: 'Supercrítico', critico: 'Crítico', sub: 'Subamortecido' }[sol.tipo];
  // plano s
  const Wp = 260, Hp = 190;
  const esc0 = Math.max(Math.abs(sol.s1), Math.abs(sol.s2), sol.wd || 0, w0) * 1.25;
  const PX = s => Wp - 22 - (-s) / esc0 * (Wp - 40), PY = w => Hp / 2 - w / esc0 * (Hp / 2 - 14);
  const raizes = sol.tipo === 'sub' ? [[sol.s1, sol.wd], [sol.s1, -sol.wd]] : [[sol.s1, 0], [sol.s2, 0]];

/* Gera o texto da resolução de x'' + a x' + b x = K. */
function resolucaoEdo({ a, b, K, x0, dx0, nome = 'x', un = '' }) {
  const F = fmtTex;
  const alfa = a / 2, w0 = Math.sqrt(b), xf = K / b;
  const s = MOTOR.solucao2(alfa, w0, xf, x0, dx0);
  const passos = [];
  passos.push(`Equação característica: $s^2 + ${F(a)}s + ${F(b)} = 0$. Então $\\alpha = \\frac{${F(a)}}{2} = ${F(alfa)}$ e $\\omega_0 = \\sqrt{${F(b)}} = ${F(w0)}$.`);
  if (s.tipo === 'super') passos.push(`$\\alpha > \\omega_0$: **supercrítico**. Raízes reais: $s = -${F(alfa)} \\pm \\sqrt{${F(alfa * alfa)} - ${F(b)}}$, ou seja, $s_1 = ${F(s.s1)}$ e $s_2 = ${F(s.s2)}$.`);
  if (s.tipo === 'critico') passos.push(`$\\alpha = \\omega_0$: **crítico**. Raiz dupla $s = ${F(-alfa)}$.`);
  if (s.tipo === 'sub') passos.push(`$\\alpha < \\omega_0$: **subamortecido**. $\\omega_d = \\sqrt{${F(b)} - ${F(alfa * alfa)}} = ${F(s.wd)}$, raízes $s = ${F(-alfa)} \\pm j${F(s.wd)}$.`);
  passos.push(`Resposta forçada (derivadas de constante são zero): $${F(b)}\\,${nome}_f = ${F(K)} \\Rightarrow ${nome}_f = ${F(xf)}$.`);
  const y0 = x0 - xf;
  if (s.tipo === 'super') {
    passos.push(`Forma: $${nome}(t) = ${F(xf)} + A_1e^{${F(s.s1)}t} + A_2e^{${F(s.s2)}t}$. Condições: $A_1 + A_2 = ${F(x0)} - ${F(xf)} = ${F(y0)}$ e $${F(s.s1)}A_1 ${s.s2 < 0 ? '-' : '+'} ${F(Math.abs(s.s2))}A_2 = ${F(dx0)}$.`);
    passos.push(`Resolvendo: $A_1 = ${F(s.A1)}$ e $A_2 = ${F(s.A2)}$.<br>$${nome}(t) = ${F(xf)} ${s.A1 < 0 ? '-' : '+'} ${F(Math.abs(s.A1))}e^{${F(s.s1)}t} ${s.A2 < 0 ? '-' : '+'} ${F(Math.abs(s.A2))}e^{${F(s.s2)}t}${unTex(un)}$`);
  } else if (s.tipo === 'critico') {
    passos.push(`Forma: $${nome}(t) = ${F(xf)} + (A_1 + A_2t)e^{${F(-alfa)}t}$. Em $t = 0$: $A_1 = ${F(x0)} - ${F(xf)} = ${F(s.A1)}$.`);
    passos.push(`Derivada em 0: $A_2 - ${F(alfa)}A_1 = ${F(dx0)} \\Rightarrow A_2 = ${F(s.A2)}$.<br>$${nome}(t) = ${F(xf)} + (${F(s.A1)} ${s.A2 < 0 ? '-' : '+'} ${F(Math.abs(s.A2))}t)\\,e^{${F(-alfa)}t}${unTex(un)}$`);
  } else {
    passos.push(`Forma: $${nome}(t) = ${F(xf)} + e^{${F(-alfa)}t}(B_1\\cos ${F(s.wd)}t + B_2\\sin ${F(s.wd)}t)$. Em $t = 0$: $B_1 = ${F(x0)} - ${F(xf)} = ${F(s.B1)}$.`);
    passos.push(`Derivada em 0: $-${F(alfa)}B_1 + ${F(s.wd)}B_2 = ${F(dx0)} \\Rightarrow B_2 = ${F(s.B2)}$.<br>$${nome}(t) = ${F(xf)} + e^{${F(-alfa)}t}(${F(s.B1)}\\cos ${F(s.wd)}t ${s.B2 < 0 ? '-' : '+'} ${F(Math.abs(s.B2))}\\sin ${F(s.wd)}t)${unTex(un)}$`);
  }
  return passos;
}

function simRlc() {

    if (w.dataset.w === 'cc') { w.innerHTML = ccHTML(arg); ccAtualizar($('.lab', w)); }
    if (w.dataset.w === 'bancada') w.innerHTML = bancadaHTML();
    if (w.dataset.w === 'fotos') { const r = questaoProva(arg); w.innerHTML = explorador(CIRCUITOS[arg], r ? r.q.anot : []); }
    if (w.dataset.w === 'curva') { w.innerHTML = curvaHTML(); curvaAtualizar(); }
    if (w.dataset.w === 'rlc') { w.innerHTML = rlcHTML(); rlcAtualizar(); }
    if (w.dataset.w === 'edo') { w.innerHTML = edoHTML(); edoResolver(); }
  }
}
function telaProva(id, qn) {
  const p = PROVAS.find(x => x.id === id) || PROVAS[0];
  const r = progressoProva(p);
  $('#app').innerHTML = topo('prova') + `<main class="pagina"><div class="coluna" style="max-width:900px">
    <div class="sim-cab"><div><span class="num mono" style="color:var(--tinta-2);font-size:14px">${p.data}, TEE00190, Prof. Tiago Abud</span><h1 style="font-size:clamp(30px,4vw,42px)">${p.nome}</h1></div>
    <div class="sim-tipos" role="group" aria-label="Escolher prova">${PROVAS.map(x => `<a class="botao${x.id === p.id ? ' prim' : ''}" href="#/prova/${x.id}">${x.nome.slice(3)}</a>`).join('')}</div></div>
    <p class="placar" style="margin-top:10px">${r.feitos} de ${r.total} itens feitos. Use as abas de cada circuito para ver as três fotos.</p>
    ${p.questoes.map(q => questaoHTML(q, `${p.id}:${q.n}`, `${q.n}ª questão`)).join('')}
  </div></main>`;
  p.questoes.forEach(q => { const s = document.getElementById(`q-${p.id}:${q.n}`); if (s) s._q = q; });
  formulas($('#app'));
  if (qn) setTimeout(() => document.getElementById(`q-${p.id}:${qn}`)?.scrollIntoView(), 30);
}
function telaSimulado() {
  if (!SIM.q) novaSimulada();
  const tipos = [['primeira', '1ª ordem (fotos, τ, expressão)'], ['segunda', '2ª ordem com circuito'], ['edo', '2ª ordem pela equação'], ['rlc', 'Tipo de amortecimento']];
  $('#app').innerHTML = topo('simulado') + `<main class="pagina"><div class="coluna" style="max-width:900px">
    <div class="sim-cab"><h1 style="font-size:clamp(30px,4vw,42px)">Simulado</h1><span class="placar" id="placar"></span></div>
    <p style="color:var(--tinta-2);margin-top:8px">Os circuitos são os das provas, com valores sorteados. As respostas são calculadas na hora pelo simulador de circuitos desta página.</p>
    <div class="sim-tipos" role="group" aria-label="Tipo de questão">${tipos.map(([id, n]) => `<button data-acao="sim-tipo" data-valor="${id}" aria-pressed="${SIM.tipo === id}">${n}</button>`).join('')}</div>
    <div id="sim-q">${questaoHTML(SIM.q.q, `sim${SIM.n}`, SIM.q.titulo)}</div>
    <div class="nav-etapas"><span></span><button class="prim" data-acao="sim-nova">Gerar outra questão</button></div>
  </div></main>`;
  const sec = $('#sim-q .questao'); if (sec) sec._q = SIM.q.q;
  formulas($('#app'));
  atualizarPlacar();
}
function telaFormulas() {
  $('#app').innerHTML = topo('formulas') + `<main class="pagina"><article class="coluna"><header class="cab-etapa"><span class="num">Para a véspera</span><h1>Folha de fórmulas</h1></header><div class="texto">${md($('#formulas').value)}</div></article></main>`;
  formulas($('#app'));
}

function render() {
  const [, nome = '', a = '', b = ''] = location.hash.split('/');
  ITENS.clear(); REG.clear();
  if (nome === 'etapa') telaEtapa(a);
  else if (nome === 'prova') telaProva(a, b);
  else if (nome === 'simulado') telaSimulado();
  else if (nome === 'formulas') telaFormulas();
  else telaInicio();
  if (!b) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ---------- ações: um ouvinte para todos os cliques ---------- */
const A = {
  tema() {
    estado.tema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    save();
    document.documentElement.dataset.theme = estado.tema;
    const b = $('.topo .tema');
    b.textContent = estado.tema === 'dark' ? '☀' : '☾';
  },
  fase: mudarFase,
  conferir, escolher, passo: proximoPasso,
  'banc-modo'(v) { BANC.modo = v; BANC.pos = 'A'; BANC.x = 0; BANC.hist = []; $$('[data-acao=banc-modo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.valor === v))); bancadaDesenhar(); },
  'banc-chave'() { BANC.pos = BANC.pos === 'A' ? 'B' : 'A'; bancadaDesenhar(); },
  'rlc-modo'(v) { $$('[data-acao=rlc-modo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.valor === v))); rlcAtualizar(); },
  'edo-resolver': edoResolver,
  'edo-exemplo'(v) { const [a, b, K, x0, dx0] = v.split(','); $('#e-a').value = a; $('#e-b').value = b; $('#e-K').value = K; $('#e-x0').value = x0; $('#e-dx0').value = dx0; edoResolver(); },
  'sim-tipo'(v) { SIM.tipo = v; novaSimulada(); telaSimulado(); },
  'sim-nova'() { novaSimulada(); telaSimulado(); window.scrollTo(0, 0); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-acao]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.acao];
  if (!fn) return;
  try { fn(b.dataset.valor, b); } catch (err) { toast('Algo deu errado: ' + err.message); console.error(err); }
});
document.addEventListener('input', e => {
  const w = e.target.dataset.input;
  if (w === 'curva') curvaAtualizar();
  if (w === 'rlc') rlcAtualizar();
  if (w === 'cc') ccAtualizar(e.target.closest('.lab'));
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('.campo input, .edo-entrada input')) return;
  e.preventDefault();
  if (e.target.closest('#lab-edo')) edoResolver();
  else { const b = $('[data-acao=conferir]', e.target.closest('.item')); if (b) b.click(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ev => { if (!estado.tema) document.documentElement.dataset.theme = ev.matches ? 'dark' : 'light'; });
// O KaTeX carrega depois (defer): quando chegar, desenha as fórmulas da tela atual.
window.addEventListener('load', () => formulas($('#app')));
render();

</script>
</body>
</html>
