titulo: Estado, render e save
modo: html
semente: {"tarefas-app": "{\"tarefas\":[{\"texto\":\"Revisar derivadas\",\"feita\":false}]}"}
=== texto
Agora você tem todas as peças. O padrão do seu app, que é o mesmo de quase todo app moderno, é este:

1. **Estado**: um objeto com todos os dados. `let state = {...}`
2. **render()**: desenha a tela a partir do estado
3. **save()**: guarda o estado no armazenamento
4. **Ao abrir**: carrega o estado salvo (ou cria um novo) e chama `render()`
5. **Em cada ação**: muda o estado, chama `save()` e depois `render()`

```js
const CHAVE = 'tarefas-app';
let state = JSON.parse(localStorage.getItem(CHAVE)) || { tarefas: [] };

function save() {
  localStorage.setItem(CHAVE, JSON.stringify(state));
}

function adicionar(texto) {
  state.tarefas.push({ texto, feita: false });
  save();
  render();
}
```

Repare em `{ texto, feita: false }`: é um atalho para `{ texto: texto, feita: false }`, quando a variável tem o mesmo nome da chave.

E por que `JSON.parse(...) || {...}` funciona? Se não houver nada salvo, `getItem` devolve `null`, `JSON.parse(null)` também dá `null`, e aí o `||` usa o objeto da direita.

> No seu app: `let state = fresh()` cria o estado inicial, `boot()` lê o que foi salvo quando a página abre, e `save()` grava. É o mesmo desenho, só que maior.

Nas próximas seis etapas você vai montar um **Meu Espaço mini**: lista de matérias com notas, média e situação, uma tela para cada matéria, tema escuro e tudo salvo no navegador. Ele usa a mesma arquitetura do seu app de verdade, só que em umas 150 linhas.

id: p-dados
titulo: Etapa 2: as matérias vêm do estado
modo: html
=== texto
Na etapa 1 os cards estavam escritos à mão no HTML. Num app de verdade, eles vêm dos **dados**. Agora você vai:

1. Apagar o conteúdo de dentro do `<main id="app">`, deixando só `<main id="app"></main>`
2. Criar um `<script>` no final do `<body>`, com o `state` e a lista de matérias:

```js
let state = {
  materias: [
    { nome: 'Cálculo I-A', p1: 7, p2: 8.5 },
    { nome: 'Física I', p1: 5, p2: 6 },
    { nome: 'Geometria Analítica', p1: 3, p2: 4.5 },
  ],
};
```

3. Criar `cardMateria(m)`, que devolve o HTML de **um** card
4. Criar `inicio()`, que devolve a tela inicial inteira (o `<h2>` e a `.grade`)
5. Criar `render()`, que coloca o `inicio()` dentro do `#app`, e chamar `render()` no final

Por enquanto, mostre no card só o nome e as duas notas (`P1: 7 | P2: 8.5`). A média vem na próxima etapa.

```js
function inicio() {
  return `
    <h2>Minhas matérias</h2>
    <div class="grade">${state.materias.map(cardMateria).join('')}</div>`;
}
```

Repare em `map(cardMateria)`: passamos o **nome** da função, sem parênteses. Quem chama a função para cada matéria é o próprio `map`.

> Compare com o seu app: a `subjectCard(s)` dele é o seu `cardMateria(m)`, e a `home()` dele é o seu `inicio()`.

- A tela mostra um `.card` para cada matéria, com o nome dela
  const s = t.valor('state'); if (!s || !s.materias) return false; const cs = t.$$('#app .card'); return cs.length === s.materias.length && s.materias.every((m, i) => cs[i].textContent.includes(m.nome))
- Mudar o estado e chamar `render()` atualiza a tela
  const s = t.valor('state'), render = t.valor('render');
  if (typeof render !== 'function') t.falha('Não achei a função render.');
  s.materias.push({ nome: 'Teste da Oficina', p1: 1, p2: 2 });
  render();

id: p-notas
titulo: Etapa 3: média e situação
modo: html
=== texto
Agora cada card vai mostrar a média e uma etiqueta colorida com a situação.

1. `media(m)` devolve `(m.p1 + m.p2) / 2`, ou `null` se faltar alguma das notas
2. `situacao(md)` devolve `'Aprovado'`, `'VS'` ou `'Reprovado'`. Você já escreveu essa no módulo 3!
3. No card, mostre a média com **uma casa decimal**: `md.toFixed(1)` transforma `7.75` em `'7.8'`
4. A etiqueta: `<span class="badge Aprovado">Aprovado</span>`. Usando a própria situação como classe, o CSS pinta cada uma de uma cor:

```css
.badge.Aprovado { color: var(--ok); }
.badge.VS { color: var(--warn); }
.badge.Reprovado { color: var(--urg); }
```

Crie as variáveis `--ok: #16A37A`, `--warn: #C9861A` e `--urg: #D9534F` no `:root`. São as cores do seu app.

5. Uma matéria sem notas mostra `–` no lugar da média, e nenhuma etiqueta

Dentro de um form, cada campo com `name` vira uma propriedade: `f.nome.value` é o texto digitado.

## Por que esc()?
Se alguém digitar `<b>Física</b>` como nome, o `innerHTML` criaria um negrito de verdade. E com nomes maliciosos daria até para rodar código. A função `esc` faz o navegador tratar o nome como texto puro:

```js
function esc(texto) {
  const div = document.createElement('div');
  div.textContent = texto;   // o navegador guarda como texto puro...
  return div.innerHTML;      // ...e devolve a versão segura: &amp;lt;b&amp;gt;
}
```

Use assim: `<h3>${esc(m.nome)}</h3>`. O seu app tem uma `esc()` que faz a mesma coisa.

=== texto
A última etapa junta tudo no formato do seu app.

**Telas.** Uma variável `rota` diz qual tela mostrar, e a função `go(r)` troca de tela:

```js
let rota = 'inicio';
let aberta = 0;   // posição da matéria aberta

function go(r) {
  rota = r;
  render();
}

function render() {
  document.querySelector('#app').innerHTML = rota === 'materia' ? paginaMateria() : inicio();
}
```

**Ações.** Um objeto `A`, com uma função para cada `data-acao`, e um único ouvinte de clique:

```js
const A = {
  abrir(valor) { aberta = Number(valor); go('materia'); },
  voltar() { go('inicio'); },
};

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-acao]');
  if (b && A[b.dataset.acao]) A[b.dataset.acao](b.dataset.valor);
});
```

Dentro de um objeto, `abrir(valor) { ... }` é um atalho para `abrir: function (valor) { ... }`. E `A[b.dataset.acao]` pega a função pelo nome guardado no botão.

**O card** ganha um botão `<button data-acao="abrir" data-valor="${i}">Abrir</button>`. Lembre que o `map` entrega a posição: `state.materias.map((m, i) => cardMateria(m, i))`, ou simplesmente `map(cardMateria)`, que já repassa os dois.

**A página da matéria** (`paginaMateria()`) tem: um botão Voltar (`data-acao="voltar"`), o nome num `<h2>`, um `<form id="notas">` com inputs `name="p1"` e `name="p2"`, e um botão para remover a matéria (`data-acao="remover"`). No submit do `#notas`, guarde `Number(f.p1.value)` na matéria aberta (ou `null`, se o campo estiver vazio).

**Tema.** Guarde `tema` dentro do `state` (assim ele é salvo junto), e no `render()` aplique: `document.documentElement.dataset.theme = state.tema`. O botão do header ganha `data-acao="tema"`, e o CSS ganha um `:root[data-theme=dark]` com as cores escuras do seu app: `#0E131B`, `#161D29`, `#2A3444`, `#E6EBF3`, `#94A3B8` e `#6E9BFF`.

O seu app tem mais de 300 KB num arquivo só, o `index.html`. Parece muita coisa, e é. Mas ele é construído com as mesmas peças que a trilha ensina. Abaixo estão trechos reais do código dele (reorganizados em várias linhas para ficar mais fácil de ler) e a lição que explica cada um.

## 1. Um arquivo, três linguagens
```html
<!doctype html>
<html lang="pt-BR">
<head>
  <title>estudos</title>
  <style> :root { --bg: #F5F6F8; ... } </style>
</head>

  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>

</body>

```
O `<body>` é quase vazio! Tem só a `<div id="app">` e algumas peças de apoio. Tudo o que você vê na tela é desenhado pelo JavaScript dentro dessa div.
@ver estrutura p-dados

## 2. As cores e o tema escuro
```css
:root {
  --bg: #F5F6F8; --card: #FFFFFF; --ink: #172B4D; --blue: #2563EB;
}
:root[data-theme=dark] {
  --bg: #0E131B; --card: #161D29; --ink: #E6EBF3; --blue: #6E9BFF;
}
body { background: var(--bg); color: var(--ink); }

```js
function applyTheme() {
  localStorage.setItem('pachecuff-theme', JSON.stringify(state.theme || null));
  const t = state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
}
```
Uma novidade aqui: `matchMedia('(prefers-color-scheme: dark)')` pergunta ao sistema se o celular ou computador está no modo escuro. Se você nunca escolheu um tema, o app segue o sistema. Esta Oficina faz igual.
@ver variaveis-css tema storage

## 3. Atalhos para achar elementos
```js
const $ = (s, r = document) => r.querySelector(s),
      $$ = (s, r = document) => [...r.querySelectorAll(s)];
```
O `r = document` é um **valor padrão**: se ninguém passar o segundo argumento, ele vale `document`. E `[...lista]` transforma o resultado do `querySelectorAll` num array de verdade, para dar para usar `map` e `filter`.
@ver dom

## 4. HTML montado com template strings
```js
function subjectCard(s) {
  const e = nextExam(s.id);
  return `<article class="scard">
    <button class="subject-card-main" data-action="subject-open" data-value="${s.id}">
      <span class="name">${esc(s.name)}</span>
      ...
    </button>
  </article>`;
}
```
Cada pedaço da tela é uma função que recebe dados e devolve um texto com HTML. Repare no `esc(s.name)`, que protege contra nomes com `<` e `>`, e no `data-action`, que diz o que o botão faz.
@ver render p-dados p-adicionar

## 5. Telas sem trocar de página
```js
let state = fresh(), route = 'home', subjectId = null;

function go(r) {
  route = r;
  render();
  window.scrollTo({ top: 0 });
}
```
O endereço da página nunca muda. A variável `route` diz qual tela mostrar, e o `render()` desenha a tela certa.
@ver p-telas

## 6. Um ouvinte para todos os cliques
```js
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if (b.disabled) return;
  const fn = A[b.dataset.action];
  if (!fn) return;
  try {
    await fn(b.dataset.value, b);
  } catch (err) {
    toast(err.message);
  }
});
```
O `A` é um objeto: as chaves são os nomes das ações e os valores são funções. Duas coisas novas aqui:

- `try { ... } catch (err) { ... }`: se algo der erro lá dentro, em vez de travar, o app mostra uma mensagem.
- `async` e `await`: servem para ações que demoram, como salvar ou falar com um servidor. O `await` espera a ação terminar antes de seguir.
@ver delegacao p-telas

## 7. Salvando os dados
```js
async function save() {
  state.updated = new Date().toISOString();
  try {
    await store.write(state);
    return true;
  } catch (e) {
    toast('Não consegui salvar: ' + e.message);

@ver storage estado p-salvar

## 8. Avisos e confirmações
```js
function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.style.display = 'none', 4500);
}
```
O `setTimeout` agenda uma função para rodar daqui a 4500 milissegundos (4,5 segundos). E as confirmações ("Tem certeza?") usam a tag `<dialog>`:

```js
function ask(msg) {
  return new Promise(res => {
    const d = $('#ask');
    d.innerHTML = `<p>${esc(msg)}</p>
      <button data-a="0">Cancelar</button>
      <button class="primary" data-a="1">Confirmar</button>`;
    d.onclick = e => {
      const b = e.target.closest('[data-a]');
      if (b) { d.close(); res(b.dataset.a === '1'); }
    };
    d.showModal();
  });
}
```
Uma `Promise` é uma **promessa de um valor no futuro**: o `ask` devolve a promessa na hora, e ela só se resolve quando a pessoa clicar num botão. Quem usa escreve `if (await ask('Remover esta matéria?')) { ... }`. É o próximo assunto depois da trilha.

## 9. O que vem depois
O seu app tem peças que vão além desta trilha. Quando terminar o projeto, estes são bons próximos passos:

- **Promises, async e await**: para entender o `ask()`, o `save()` e tudo que "espera".
- **fetch**: buscar dados de um servidor. É a base para o login e a nuvem.
- **Firebase**: o seu app carrega `firebase-config.js` e `assets/cloud.js` para login e sincronização na nuvem. Firebase é um serviço do Google que guarda dados online.
- **PWA**: o `manifest.webmanifest` e os ícones deixam instalar o site como app no celular.
- **Bibliotecas**: o MathJax, que desenha as fórmulas, é código de outras pessoas carregado de um CDN. Usar bibliotecas é parte normal da programação.
- **SVG e canvas**: os ícones e os gráficos do laboratório (o plotter, por exemplo) são desenhados com eles.

/* ---------- 4. Markdown simples para o texto das lições ---------- */
function md(src) {
  const linhas = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  const inicioBloco = /^(```|## |> |- |\d+\. |@ver )/;
  while (i < linhas.length) {
    const l = linhas[i];
    if (l.startsWith('```')) {
      const lang = l.slice(3).trim() || 'html';
      const buf = [];
      i++;
      while (i < linhas.length && !linhas[i].startsWith('```')) buf.push(linhas[i++]);
      i++;
      out += `<pre class="bloco"><code>${hl(buf.join('\n'), lang)}</code></pre>`;
    } else if (!l.trim()) {
      i++;
    } else if (l.startsWith('## ')) {
      out += `<h3>${inline(l.slice(3))}</h3>`; i++;
    } else if (l.startsWith('@ver ')) {
      const ids = l.slice(5).trim().split(/\s+/).filter(id => L[id]);
      out += `<div class="ver">${ids.map(id => `<a href="#/licao/${id}">${L[id].numero} ${esc(L[id].titulo)}</a>`).join('')}</div>`; i++;
    } else if (l.startsWith('> ')) {
      const buf = [];
      while (i < linhas.length && linhas[i].startsWith('>')) buf.push(linhas[i++].replace(/^> ?/, ''));
      out += `<aside class="nota">${md(buf.join('\n'))}</aside>`;
    } else if (/^(- |\d+\. )/.test(l)) {
      const ordenada = /^\d/.test(l), itens = [];
      while (i < linhas.length && /^(- |\d+\. )/.test(linhas[i])) {
        let item = linhas[i++].replace(/^(- |\d+\. )/, '');
        while (i < linhas.length && /^ {2,}\S/.test(linhas[i])) item += ' ' + linhas[i++].trim();
        itens.push(`<li>${inline(item)}</li>`);
      }
      out += ordenada ? `<ol>${itens.join('')}</ol>` : `<ul>${itens.join('')}</ul>`;
    } else {
      const buf = [];
      while (i < linhas.length && linhas[i].trim() && !inicioBloco.test(linhas[i])) buf.push(linhas[i++]);
      out += `<p>${inline(buf.join(' '))}</p>`;

}

  const codigos = [];

  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>')

      }).then(function (r) { res.push({ ok: !!r }); }, function (err) { var msg = err && err.message ? err.message : String(err); res.push({ ok: false, msg: /^[A-Z][a-z]+ /.test(msg) && !/^(Não|Nenhum|Com|Cada|Deixe|Você|A |O )/.test(msg) ? 'O teste parou com um erro: ' + msg : msg }); }).then(proximo);
    };
    proximo();
  });
  window.addEventListener('load', function () { setTimeout(function () { P({ tipo: 'pronto' }); }, 20); });
}
const HARNESS_TXT = HARNESS.toString().replace(/\n\s*/g, ' ');

/* Coloca uma checagem anti-loop-infinito dentro de cada for/while com chaves. */
function protegerLoops(js) {
  return js
    .replace(/\b(for|while)\s*\(((?:[^()]|\((?:[^()]|\([^()]*\))*\))*)\)\s*\{/g, m => m + '__lp();')
    .replace(/\bdo\s*\{/g, m => m + '__lp();');
}
function montarDocumento(codigo, modo, run, semente, checar) {
  const json = JSON.stringify(semente || {}).replace(/</g, '\\u003c');
  const chicote = `<script>(${HARNESS_TXT})(${run},${json},${checar ? 1 : 0});<\/script>`;
  if (modo === 'js') {
    return `<!doctype html><html><head><meta charset="utf-8">${chicote}</head><body><script>${protegerLoops(codigo).replace(/<\/script/gi, '<\\/script')}\n<\/script></body></html>`;
  }
  const html = codigo.replace(/(<script\b[^>]*>)([\s\S]*?)(<\/script>)/gi, (m, a, b, c) => /\bsrc\s*=/.test(a) ? m : a + protegerLoops(b) + c);
  const doctype = html.match(/^\s*<!doctype[^>]*>/i);
  return doctype ? doctype[0] + chicote + html.slice(doctype[0].length) : chicote + html;
}

let seqRun = 0;
const ouvintes = new Map();   // run → função que recebe as mensagens daquele iframe
window.addEventListener('message', e => {
  const m = e.data;
  if (!m || m.__oficina !== 1) return;
  const f = ouvintes.get(m.run);
  if (f) f(m, e.source);
});
function novoIframe(classe) {
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts allow-modals allow-forms');
  f.className = classe || '';
  f.title = 'Resultado do seu código';
  return f;
}

/* Roda o código no iframe visível e manda as mensagens para quem pediu. */
function rodar(iframe, codigo, modo, semente, aoReceber) {
  if (iframe._run) ouvintes.delete(iframe._run);
  const run = ++seqRun;
  iframe._run = run;
  ouvintes.set(run, aoReceber);
  iframe.srcdoc = montarDocumento(codigo, modo, run, semente, false);
  marcarDia();
}

/* Roda o código num iframe escondido e executa as verificações do desafio. */
function verificarCodigo(codigo, modo, semente, checks) {
  return new Promise(resolve => {
    const iframe = novoIframe('iframe-teste');
    const run = ++seqRun;
    let fim = false;
    const terminar = r => {
      if (fim) return;
      fim = true;
      clearTimeout(limite);
      ouvintes.delete(run);
      iframe.remove();
      resolve(r);
    };
    const limite = setTimeout(() => terminar({ tempo: true }), 9000);
    ouvintes.set(run, (m, fonte) => {
      if (m.tipo === 'pronto') fonte.postMessage({ __oficina: 1, tipo: 'checar', checks, codigo }, '*');
      if (m.tipo === 'largura') { iframe.style.width = m.px + 'px'; setTimeout(() => fonte.postMessage({ __oficina: 1, tipo: 'largura-ok' }, '*'), 30); }
      if (m.tipo === 'resultado') terminar(m);
    });
    document.body.appendChild(iframe);
    iframe.srcdoc = montarDocumento(codigo, modo, run, semente, true);
  });
}

/* Tradução das mensagens de erro mais comuns para iniciantes. */
const ERROS = [
  [/(?:^|\s)([\w$]+) is not defined|Can't find variable: ([\w$]+)/, m => `${m[1] || m[2]} não existe. Confira se você criou essa variável ou função e se o nome está escrito igualzinho: maiúsculas e minúsculas fazem diferença.`],
  [/Cannot (?:read|set) propert(?:y|ies) of (null|undefined)(?: \((?:reading|setting) '(.+?)'\))?|can't access property "(.+?)", .+ is (null|undefined)|(null|undefined) is not an object/,
    m => `Você tentou usar ${m[2] || m[3] ? `.${m[2] || m[3]} em ` : ''}algo que é ${m[1] || m[4] || m[5]}. Quase sempre é um querySelector que não encontrou o elemento: confira o seletor e se o elemento existe no HTML.`],
  [/([\w$.]+) is not a function/, m => `${m[1]} não é uma função. Confira o nome (por exemplo addEventListener, querySelector) e se não faltou nada antes do ponto.`],
  [/Unexpected end of input|missing \} |expected expression, got end of script/, () => 'O código terminou antes da hora: provavelmente falta fechar uma chave } ou um parêntese ).'],
  [/Unexpected token|Invalid or unexpected token|Unexpected identifier|Unexpected string|Unexpected number|missing \) |expected expression|unexpected token|SyntaxError/,
    () => 'Erro de digitação no código (de sintaxe). Procure na linha indicada: aspas, parênteses, chaves ou vírgulas sobrando ou faltando.'],
  [/Assignment to constant variable|invalid assignment to const/, () => 'Você tentou mudar uma const. Se o valor precisa mudar, declare com let.'],
  [/has already been declared|redeclaration of/, () => 'Você declarou a mesma variável duas vezes com let ou const. Use outro nome, ou tire o segundo let/const.'],
  [/JSON/, () => 'O JSON.parse recebeu um texto que não é JSON. Confira o que foi salvo; para recomeçar, use Mais → Apagar dados salvos da prévia.'],
];
function explicarErro(msg) {
  for (const [re, f] of ERROS) { const m = msg.match(re); if (m) return f(m); }
  return '';
}

/* Liga o editor, o iframe e o console de uma tela (lição ou bloco livre). */
function montarBancada({ id, modo, codigo, semente, licao }) {
  const ehJS = modo === 'js';
  const ver = $('#ver'), cons = $('#console');
  let contagem = 0, temErro = false;
  const auto = () => !ehJS && !/<script/i.test(editor.valor);
  const avisoAuto = () => { $('#auto').innerHTML = auto() ? 'A prévia atualiza enquanto você digita' : 'Aperte Executar ou <kbd>Ctrl</kbd> + <kbd>Enter</kbd>'; };

  function linhaConsole(nivel, texto, linha) {
    contagem++;
    const div = document.createElement('div');
    div.className = 'cl ' + nivel;
    if (nivel === 'erro') {
      const exp = explicarErro(texto);
      div.innerHTML = `${linha ? `<span class="ln">Linha ${linha}:</span> ` : ''}${esc(texto)}${exp ? `<span class="exp">${esc(exp)}</span>` : ''}`;
    } else div.textContent = texto;
    if (cons.children.length > 400) cons.firstChild.remove();
    cons.appendChild(div);
    cons.scrollTop = cons.scrollHeight;
    const conta = $('#conta');
    conta.textContent = contagem;
    conta.classList.toggle('erro', temErro);
  }
  function executar() {
    cons.innerHTML = '';
    contagem = 0; temErro = false;
    $('#conta').textContent = '0';
    $('#conta').classList.remove('erro');
    $('.aviso-erro')?.remove();
    editor.marcarErro(0);
    const sem = estado.caixas[id] || {};
    rodar(ver, editor.valor, modo, sem, m => {
      if (m.tipo === 'log') linhaConsole(m.nivel, m.texto);
      if (m.tipo === 'limpar') { cons.innerHTML = ''; contagem = 0; }
      if (m.tipo === 'storage') { estado.caixas[id] = m.dados; saveDepois(); }
      if (m.tipo === 'erro') {
        temErro = true;
        linhaConsole('erro', m.texto, m.linha);
        if (m.linha) editor.marcarErro(m.linha);
        if (!ehJS && !$('.aviso-erro') && $('#console').hidden) {
          const av = document.createElement('div');
          av.className = 'aviso-erro';
          av.innerHTML = `<span>O seu código deu erro${m.linha ? ` na linha ${m.linha}` : ''}.</span><button data-acao="saida" data-valor="console">Ver no console</button>`;
          $('.saida-corpo').appendChild(av);
        }
      }
    });
  }
  const editor = criarEditor($('#ed'), {
    valor: codigo, lang: ehJS ? 'js' : 'html',
    aoMudar: v => {
      estado.codigos[id] = v; saveDepois(); avisoAuto();
      if (auto()) { clearTimeout(executar.t); executar.t = setTimeout(executar, 350); }
    },
    aoExecutar: () => { executar(); if (window.innerWidth <= 960) mudarAba('resultado'); },
  });
  telaAtual = { id, modo, editor, executar, licao, semente };
  avisoAuto();
  executar();
}

async function verificar() {
  const { licao: l, editor } = telaAtual;
  const botoes = $$('[data-acao=verificar]');
  botoes.forEach(b => { b.disabled = true; b.lastChild.textContent = 'Verificando...'; });

  const msg = $('#desafio-msg');
  msg.className = 'desafio-msg';
  if (r.tempo) {
    msg.classList.add('erro');
    msg.textContent = 'A verificação demorou demais. Talvez exista um loop infinito, ou o código ficou esperando alguma coisa.';
    return;
  }
  let ok = 0;
  r.res.forEach((x, k) => {
    const li = $('#obj-' + k);
    li.className = x.ok ? 'ok' : 'falhou';
    $('.obj-m', li).textContent = x.ok ? '✓' : '✗';
    $('.obj-msg', li).textContent = x.ok ? '' : (x.msg || '');
    if (x.ok) ok++;
  });
  const total = r.res.length;
  if (ok === total) {
    const primeiraVez = !feita(l.id);
    estado.feitas[l.id] = Date.now();
    save();
    concluir(l, primeiraVez);
  } else {
    msg.classList.add(r.erros.length ? 'erro' : 'x');
    msg.innerHTML = r.erros.length
      ? `${ok} de ${total} objetivos cumpridos. O seu código deu erro: <code>${esc(r.erros[0])}</code>${explicarErro(r.erros[0]) ? '<br>' + esc(explicarErro(r.erros[0])) : ''}`
      : `${ok} de ${total} objetivos cumpridos. Ajuste o que falta e verifique de novo.`;
  }
  // Rola só a coluna da lição até o desafio (scrollIntoView rolaria a página inteira junto).
  const doc = $('.lp-doc');
  doc.scrollTo({
    top: doc.scrollTop + $('#desafio').getBoundingClientRect().top - doc.getBoundingClientRect().top - 16,
    behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
  });
}

function concluir(l, primeiraVez) {
  const i = ORDEM.indexOf(l.id), prox = L[ORDEM[i + 1]];
  const msg = $('#desafio-msg');
  msg.className = 'desafio-msg feito';
  const fim = !prox;
  msg.innerHTML = fim
    ? `<span><strong>Você construiu um Meu Espaço do zero.</strong> Baixe o arquivo (ou copie o código para um arquivo .html) e abra no navegador: é um app de verdade, seu.</span><span class="acoes-fim"><button class="botao" data-acao="baixar">Baixar o meu app</button><button class="botao" data-acao="copiar">Copiar o código</button></span>`
    : `<span><strong>Tudo certo!</strong> ${primeiraVez ? 'Lição concluída.' : 'Continua tudo funcionando.'}</span><a class="botao" href="#/licao/${prox.id}">Próxima: ${esc(prox.titulo)}</a>`;
  $('#situacao').textContent = 'Concluída';
  if (!$('.carimbo .selo')) {
    const selo = document.createElement('strong');
    selo.className = 'selo novo';
    selo.setAttribute('aria-hidden', 'true');
    selo.textContent = 'Aprovado';
    $('.carimbo').appendChild(selo);
  }
}

/* ----- Revisões (quiz) ----- */
function telaQuiz(l) {
  const i = ORDEM.indexOf(l.id);
  const prox = L[ORDEM[i + 1]];
  $('#app').innerHTML = topo('inicio') + `
  <main class="quiz">
    ${carimbo(l)}
    <div class="texto">${md(l.texto)}</div>
    ${l.questoes.map((q, k) => `<section class="pergunta" data-q="${k}">
      <h3><span class="num">${k + 1}.</span>${inline(q.texto)}</h3>
      <div class="opcoes">${q.opcoes.map((o, j) => `<button data-acao="responder" data-valor="${k}:${j}">${inline(o)}</button>`).join('')}</div>
      <div class="porque" aria-live="polite"></div>
    </section>`).join('')}
    <div class="desafio-msg" id="desafio-msg" role="status"></div>
    <nav class="lp-nav">
      <a href="#/">Voltar para a trilha</a>
      ${prox ? `<a href="#/licao/${prox.id}">Próxima: ${prox.numero} ${esc(prox.titulo)}</a>` : ''}
    </nav>
  </main>`;
  telaAtual = { licao: l, certas: new Set() };
}
function responder(valor) {
  const [k, j] = valor.split(':').map(Number);
  const l = telaAtual.licao, q = l.questoes[k];
  const sec = $(`.pergunta[data-q="${k}"]`);
  const b = $$('button', sec)[j];
  if (j === q.certa) {
    b.classList.add('certa');
    $$('button', sec).forEach(x => { x.disabled = x !== b; });
    telaAtual.certas.add(k);
    $('.porque', sec).innerHTML = inline('Isso! ' + q.porque);
  } else {
    b.classList.add('errada');
    b.disabled = true;
    $('.porque', sec).innerHTML = inline('Não é essa. ' + q.porque);
  }
  if (telaAtual.certas.size === l.questoes.length) {
    const primeiraVez = !feita(l.id);
    estado.feitas[l.id] = Date.now();
    marcarDia();
    save();
    const i = ORDEM.indexOf(l.id), prox = L[ORDEM[i + 1]];
    const msg = $('#desafio-msg');
    msg.className = 'desafio-msg feito';
    msg.innerHTML = `<span><strong>Revisão completa!</strong> ${primeiraVez ? 'Módulo fechado.' : ''}</span>${prox ? `<a class="botao" href="#/licao/${prox.id}">Próximo módulo: ${esc(prox.modulo.nome)}</a>` : ''}`;
    $('#situacao').textContent = 'Concluída';
    if (!$('.carimbo .selo')) $('.carimbo').insertAdjacentHTML('beforeend', '<strong class="selo novo" aria-hidden="true">Aprovado</strong>');
  }
}

/* ----- Raio-X ----- */
function telaRaioX() {
  $('#app').innerHTML = topo('raio-x') + `
  <main class="artigo">
    <h1>Raio-X do Meu Espaço</h1>
    <div class="texto">${md($('#raio-x').value)}</div>
  </main>`;
}

/* ----- Bloco livre ----- */
const BLOCO = `<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu teste</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    padding: 20px;
  }
</style>
</head>
<body>
  <h1>Bloco livre</h1>
  <p>Escreva o que quiser aqui.</p>

<script>
  console.log('Olá do bloco livre!');
<\/script>
</body>
</html>
`;
function telaBloco() {
  $('#app').innerHTML = topo('bloco') + `
  <div class="lp bloco" data-aba="codigo">
    <nav class="lp-abas" role="tablist" aria-label="Partes do bloco">
      <button role="tab" data-acao="aba" data-valor="codigo" aria-selected="true">Código</button>
      <button role="tab" data-acao="aba" data-valor="resultado" aria-selected="false">Resultado</button>
    </nav>
    ${bancada(false, false)}
  </div>`;
  // No bloco livre, o editor fica de um lado e o resultado do outro.
  const banc = $('.lp-bancada');
  const lado = document.createElement('div');
  lado.className = 'lp-ed';
  lado.append($('.barra', banc), $('#ed', banc), $('.teclas', banc));
  $('.bloco').insertBefore(lado, banc);
  $('[data-acao=recomecar]').textContent = 'Recomeçar do modelo';
  montarBancada({ id: 'bloco', modo: 'html', codigo: estado.codigos.bloco ?? BLOCO, semente: {}, licao: null });
}

/* ---------- 10. Ações: um ouvinte para todos os cliques (igual ao seu app) ---------- */
const A = {
  tema() {
    const atual = document.documentElement.dataset.theme;
    estado.tema = atual === 'dark' ? 'light' : 'dark';
    save();
    aplicarTema();
    const b = $('.topo [data-acao=tema]');
    const escuro = estado.tema === 'dark';
    b.innerHTML = escuro ? ICONE.sol : ICONE.lua;
    b.setAttribute('aria-label', escuro ? 'Usar tema claro' : 'Usar tema escuro');
  },
  executar() { telaAtual.executar(); if (window.innerWidth <= 960) mudarAba('resultado'); },
  verificar,
  aba: mudarAba,
  saida: mudarSaida,
  dica() {
    const d = $('#dica');
    d.hidden = !d.hidden;
    $('[data-acao=dica]').textContent = d.hidden ? 'Ver dica' : 'Esconder dica';
  },
  solucao() {
    const l = telaAtual.licao;
    janela(`Solução: ${l.titulo}`, `<pre class="bloco"><code>${hl(l.solucao, l.modo === 'js' ? 'js' : 'html')}</code></pre>`,
      `<button data-acao="fechar-janela">Fechar</button><button class="primario" data-acao="usar-solucao">Colocar no editor</button>`);
  },
  'usar-solucao'() {
    $('#janela').close();
    telaAtual.editor.trocar(telaAtual.licao.solucao);
    telaAtual.executar();
    toast('Solução colocada no editor. Ctrl + Z desfaz.');
  },
  'fechar-janela'() { $('#janela').close(); },
  async recomecar() {
    fecharMais();
    if (!await perguntar('O seu código desta tela vai voltar ao começo.', 'Recomeçar')) return;
    const original = telaAtual.licao ? telaAtual.licao.inicio : BLOCO;
    telaAtual.editor.trocar(original);
    telaAtual.executar();
  },
  async trazer() {
    const l = telaAtual.licao;
    telaAtual.editor.trocar(estado.codigos[l.anterior]);
    telaAtual.executar();
    $('.trazer')?.remove();
    toast('Código da etapa anterior trazido. Ctrl + Z desfaz.');
  },
  baixar() {
    fecharMais();
    const nome = telaAtual.id === 'p-telas' ? 'meu-espaco.html' : `oficina-${telaAtual.id}.html`;
    const codigo = telaAtual.modo === 'js' ? `<!doctype html>\n<html lang="pt-BR">\n<head><meta charset="utf-8"><title>${telaAtual.id}</title></head>\n<body>\n<p>Abra o console (F12) para ver o resultado.</p>\n<script>\n${telaAtual.editor.valor}<\/script>\n</body>\n</html>\n` : telaAtual.editor.valor;
    baixar(nome, codigo);
  },
  async copiar() {
    fecharMais();
    try {
      await navigator.clipboard.writeText(telaAtual.editor.valor);
      toast('Código copiado. Cole num arquivo .html e abra no navegador.');
    } catch (e) {
      toast('Não consegui copiar. Selecione o código no editor e use Ctrl + C.');
    }
  },
  'limpar-dados'() {
    fecharMais();
    delete estado.caixas[telaAtual.id];
    save();
    telaAtual.executar();
    toast('Dados salvos da prévia apagados.');
  },
  responder,
};
function fecharMais() { const d = $('details.mais'); if (d) d.open = false; }

document.addEventListener('click', e => {
  const tecla = e.target.closest('[data-tecla]');
  if (tecla && telaAtual?.editor) { telaAtual.editor.inserir(tecla.dataset.tecla); return; }
  if (!e.target.closest('details.mais')) fecharMais();
  const b = e.target.closest('[data-acao]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.acao];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(b.dataset.valor, b)).catch(err => toast(err.message));
});
// As teclas rápidas não podem tirar o foco do editor (senão o teclado do celular fecha).
document.addEventListener('pointerdown', e => { if (e.target.closest('[data-tecla]')) e.preventDefault(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!estado.tema) aplicarTema(); });

/* ---------- 11. Começo ---------- */
aplicarTema();
render();
</script>
</body>
</html>
