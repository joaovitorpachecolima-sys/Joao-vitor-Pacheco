<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EEF4EE">
<title>Oficina de Código</title>
<!--
  Oficina de Código: aprenda a programar construindo o seu próprio "Meu Espaço".
  Um arquivo só, sem compilação, igual ao seu app. O progresso fica no localStorage do navegador.
  Pode abrir e ler este código: ele usa as mesmas técnicas que a trilha ensina.
  Fontes opcionais: Archivo e JetBrains Mono (Google Fonts). Sem internet, usa as fontes do sistema.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
  // Aplica o tema antes de desenhar a página (evita "piscar" claro → escuro).
  try { var s = JSON.parse(localStorage.getItem('oficina-de-codigo') || '{}'); } catch (e) { s = {}; }
  document.documentElement.dataset.theme = s.tema || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
/* ============================================================
   1. Variáveis (cores, fontes, medidas)
   Papel de cálculo de engenharia, caneta azul, marca-texto e lousa.
   ============================================================ */
:root {
  --papel: #EEF4EE;
  --folha: #FAFCF9;
  --grade: #DBE8DC;
  --grade-forte: #C5DAC7;
  --grafite: #1F2925;
  --grafite-2: #56655C;
  --linha: #A9BEAF;
  --caneta: #1F4FD1;
  --caneta-2: #E2E9FB;
  --sobre-caneta: #FFFFFF;
  --marca: #FFE45C;
  --vermelho: #C2352B;
  --vermelho-2: #FBE6E3;
  --verde: #1C7547;
  --lousa: #1D2A25;
  --lousa-2: #25342E;
  --giz: #E6EEE8;
  --giz-2: #8DA397;
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --topo: 58px;
  --ed-fs: 14px;
  --ed-lh: 22px;
  color-scheme: light;
}
:root[data-theme=dark] {
  --papel: #111916;
  --folha: #16201C;
  --grade: #18231F;
  --grade-forte: #1F2D28;
  --grafite: #E1EAE4;
  --grafite-2: #9AAEA2;
  --linha: #34463E;
  --caneta: #8EADFF;
  --caneta-2: #1C2844;
  --sobre-caneta: #0D1411;
  --marca: #E8CD45;
  --vermelho: #FF8073;
  --vermelho-2: #3A1E1B;
  --verde: #63D39C;
  --lousa: #0C1310;
  --lousa-2: #15201B;
  color-scheme: dark;
}
@media (pointer: coarse) { :root { --ed-fs: 16px; --ed-lh: 24px; } }

/* ============================================================
   2. Base
   ============================================================ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--grafite);
  font: 16px/1.6 var(--sans);
  background-color: var(--papel);
  background-image:
    linear-gradient(var(--grade-forte) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade-forte) 1px, transparent 1px),
    linear-gradient(var(--grade) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  background-position: -1px -1px;
}
a { color: var(--caneta); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; line-height: 1.15; font-weight: 750; }
p { margin: 0 0 14px; }
code, pre, kbd { font-family: var(--mono); font-variant-ligatures: none; }
:focus-visible { outline: 2.5px solid var(--caneta); outline-offset: 2px; }
mark { background: linear-gradient(transparent 12%, var(--marca) 12%, var(--marca) 88%, transparent 88%); color: #1A1F1C; padding: 0 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

button, .botao {
  font: 600 15px/1.2 var(--sans);
  color: var(--grafite);
  background: var(--folha);
  border: 1.5px solid var(--grafite);
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  transition: background .12s, transform .08s;
  white-space: nowrap;
}
button:hover, .botao:hover { background: var(--caneta-2); }
button:active, .botao:active { transform: translateY(1px); }
button.primario, .botao.primario { background: var(--caneta); border-color: var(--caneta); color: var(--sobre-caneta); }
button.primario:hover, .botao.primario:hover { filter: brightness(1.08); }
button.leve { border-color: transparent; background: transparent; color: var(--grafite-2); }
button.leve:hover { background: var(--caneta-2); color: var(--grafite); }
button:disabled { opacity: .5; cursor: not-allowed; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ============================================================
   3. Barra do topo
   ============================================================ */
.topo {
  position: sticky; top: 0; z-index: 20;
  height: var(--topo);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 20px;
  background: var(--folha);
  border-bottom: 2px solid var(--grafite);
}
.marca {
  display: flex; align-items: center; gap: 10px;
  color: var(--grafite); text-decoration: none;
  font-weight: 800; font-stretch: 125%; font-size: 17px; letter-spacing: -.01em;
}
.marca-selo {
  display: grid; place-items: center;
  width: 30px; height: 30px;
  border: 2px solid var(--grafite); border-radius: 4px;
  font: 700 13px/1 var(--mono);
}
.topo nav { display: flex; align-items: center; gap: 4px; }
.topo nav a {
  color: var(--grafite-2); text-decoration: none; font-weight: 600; font-size: 15px;
  padding: 8px 10px; border-radius: 6px;
}
.topo nav a:hover { color: var(--grafite); background: var(--caneta-2); }
.topo nav a[aria-current=page] { color: var(--grafite); box-shadow: inset 0 -3px 0 var(--caneta); border-radius: 6px 6px 0 0; }
.topo .icone { padding: 8px; border-color: transparent; background: transparent; }
.topo .icone:hover { background: var(--caneta-2); }
@media (max-width: 720px) {
  .topo { padding: 0 10px; }
  .marca-nome .longo, .topo nav .longo { display: none; }
  .topo nav a { padding: 8px 7px; font-size: 14px; }
}

/* ============================================================
   4. Início
   ============================================================ */
.inicio { max-width: 1180px; margin: 0 auto; padding: 48px 24px 96px; }
.abertura { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.abertura h1 {
  font-size: clamp(36px, 5.4vw, 66px);
  font-weight: 800; font-stretch: 112%;
  letter-spacing: -.025em; line-height: 1.02;
  max-width: 13ch;
  margin-bottom: 22px;
}
.abertura .lead { font-size: 18px; color: var(--grafite-2); max-width: 46ch; margin-bottom: 26px; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
.acoes .botao { padding: 12px 18px; font-size: 16px; }

.medidor { display: grid; gap: 8px; max-width: 460px; }
.medidor-info { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--grafite-2); }
.medidor-info b { color: var(--grafite); font-weight: 700; }
/* Escala gráfica: a barra de progresso desenhada como a escala de uma prancha. */
.escala { display: flex; height: 12px; border: 1.5px solid var(--grafite); background: var(--folha); }
.escala i { flex: 1; border-right: 1px solid var(--grafite); }
.escala i:last-child { border-right: 0; }
.escala i.ok { background: var(--grafite); }
.escala i.ok:nth-child(even) { background: var(--caneta); }

.demo { border: 2px solid var(--grafite); background: var(--folha); }
.demo-cab { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1.5px solid var(--grafite); font-size: 13px; color: var(--grafite-2); }
.demo-cab b { color: var(--grafite); font-weight: 700; }
.demo-corpo { display: grid; grid-template-columns: 1fr 1fr; min-height: 250px; }
.demo-corpo .editor { border-right: 1.5px solid var(--grafite); min-height: 250px; }
.demo-corpo iframe { width: 100%; height: 100%; min-height: 250px; border: 0; background: #fff; display: block; }

.trilha { margin-top: 88px; }
.trilha > h2 { font-size: 30px; font-stretch: 112%; letter-spacing: -.015em; margin-bottom: 6px; }
.trilha > p { color: var(--grafite-2); margin-bottom: 28px; max-width: 60ch; }
.modulo {
  display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0;
  border: 2px solid var(--grafite); background: var(--folha);
  margin-bottom: -2px;
}
.modulo-num {
  border-right: 1.5px solid var(--grafite);
  display: flex; flex-direction: column; align-items: center; padding-top: 18px; gap: 6px;
  font-size: 50px; font-weight: 800; font-stretch: 125%; line-height: 1;
}
.modulo-num small { font-size: 12px; font-weight: 600; font-stretch: 100%; color: var(--grafite-2); }
.modulo-corpo { padding: 18px 22px 16px; }
.modulo-corpo h3 { font-size: 21px; font-stretch: 108%; margin-bottom: 4px; }
.modulo-corpo > p { color: var(--grafite-2); font-size: 15px; margin-bottom: 12px; }
.aulas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 18px; }
.aula {
  display: grid; grid-template-columns: 22px 34px 1fr; align-items: center; gap: 6px;
  padding: 7px 4px; color: var(--grafite); text-decoration: none; border-bottom: 1px dashed var(--linha); font-size: 15px;
}
.aula:hover .aula-t { text-decoration: underline; text-decoration-color: var(--caneta); text-underline-offset: 3px; }
.aula-n { font: 600 12px/1 var(--mono); color: var(--grafite-2); }
.aula-s { width: 16px; height: 16px; border: 1.5px solid var(--linha); border-radius: 50%; }
.aula.feita .aula-s { border-color: var(--grafite); background: var(--marca); border-radius: 3px; }
.aula.feita .aula-s::after { content: ""; display: block; width: 5px; height: 9px; margin: 0 0 0 4px; border: solid #1A1F1C; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.aula.atual .aula-s { border: 4px solid var(--caneta); }
.aula.atual .aula-t { font-weight: 700; }
.aula-t small { color: var(--grafite-2); font-weight: 500; }

.extras { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 56px; }
.extra { border: 2px solid var(--grafite); background: var(--folha); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.extra h3 { font-size: 21px; font-stretch: 108%; }
.extra p { color: var(--grafite-2); margin: 0 0 6px; }
.extra .botao { align-self: flex-start; }

@media (max-width: 900px) {
  .inicio { padding: 28px 16px 72px; }
  .abertura { grid-template-columns: 1fr; gap: 32px; }
  .demo-corpo { grid-template-columns: 1fr; }
  .demo-corpo .editor { border-right: 0; border-bottom: 1.5px solid var(--grafite); min-height: 170px; }
  .demo-corpo iframe { min-height: 150px; }
  .modulo { grid-template-columns: 58px minmax(0, 1fr); }
  .modulo-num { font-size: 34px; }
  .modulo-corpo { padding: 14px 14px 12px; }
  .extras { grid-template-columns: 1fr; }
  .trilha { margin-top: 56px; }
}

/* ============================================================
   5. Texto das lições (markdown simples)
   ============================================================ */
.texto { max-width: 66ch; }
.texto p, .texto li { font-size: 16px; }
.texto h3 { font-size: 20px; font-stretch: 108%; margin: 30px 0 10px; }
.texto ul, .texto ol { padding-left: 22px; margin: 0 0 16px; }
.texto li { margin-bottom: 4px; }
.texto li::marker { color: var(--grafite-2); }
.texto :not(pre) > code {
  font-size: .88em; padding: 1px 5px; border-radius: 4px;
  background: var(--folha); border: 1px solid var(--linha); white-space: nowrap;
}
.texto strong { font-weight: 700; }
.nota {
  margin: 18px 0; padding: 12px 16px;
  border-left: 4px solid var(--caneta); background: var(--folha);
  font-size: 15px;
}
.nota p:last-child { margin-bottom: 0; }
pre.bloco {
  margin: 0 0 18px; padding: 14px 16px;
  background: var(--lousa); color: var(--giz);
  border-radius: 6px; overflow-x: auto;
  font-size: 13.5px; line-height: 1.6; tab-size: 2;
}

/* Cores do código (giz na lousa) */
.k { color: #D2B0F7; } .s { color: #F4AABA; } .c { color: var(--giz-2); }
.n { color: #B9E39F; } .f { color: #8FD0F7; } .t { color: #F5D66F; }
.a { color: #8FD0F7; } .p { color: #8FD0F7; } .v { color: #F7C08A; } .l { color: #F7C08A; } .x { color: var(--giz-2); }

/* ============================================================
   6. Tela da lição
   ============================================================ */
.lp { display: grid; grid-template-columns: minmax(380px, 46%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: calc(100dvh - var(--topo)); }
.lp > * { min-height: 0; }
.lp-abas { display: none; }
.lp-doc { overflow-y: auto; padding: 26px 32px 80px; border-right: 2px solid var(--grafite); }
.lp-bancada { display: grid; grid-template-rows: auto minmax(0, 1.25fr) auto minmax(0, 1fr); min-width: 0; background: var(--folha); }
.lp.js .lp-bancada { grid-template-rows: auto minmax(0, 1.6fr) auto minmax(0, 1fr); }

/* Carimbo: o selo de uma prancha de desenho técnico */
.carimbo { position: relative; border: 2px solid var(--grafite); background: var(--folha); display: grid; grid-template-columns: 1fr auto; margin-bottom: 26px; }
.carimbo > div { padding: 8px 12px; border-right: 1px solid var(--grafite); border-bottom: 1px solid var(--grafite); }
.carimbo > div:nth-child(2n) { border-right: 0; }
.carimbo > div:nth-last-child(-n+2) { border-bottom: 0; }
.carimbo .rot { display: block; font-size: 12px; color: var(--grafite-2); line-height: 1.3; }
.carimbo .val { display: block; font-weight: 650; font-size: 15px; }
.carimbo h1 { font-size: clamp(24px, 2.6vw, 32px); font-stretch: 110%; letter-spacing: -.015em; margin-top: 2px; }
.carimbo .titulo { padding: 12px 14px; }
.carimbo .lado { min-width: 150px; }
.selo {
  position: absolute; left: 150px; bottom: 8px;
  transform: rotate(-7deg);
  border: 3px double var(--caneta); color: var(--caneta);
  padding: 4px 14px; border-radius: 6px;
  font-weight: 800; font-stretch: 125%; font-size: 22px; letter-spacing: .02em;
  background: color-mix(in srgb, var(--folha) 70%, transparent);
  pointer-events: none;
}
.selo.novo { animation: carimbar .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes carimbar { from { opacity: 0; transform: rotate(-7deg) scale(1.9); } to { opacity: 1; transform: rotate(-7deg) scale(1); } }

.desafio { margin-top: 34px; border: 2px solid var(--grafite); background: var(--folha); padding: 18px 20px 20px; scroll-margin-top: 16px; }
.desafio h2 { font-size: 22px; font-stretch: 110%; margin-bottom: 4px; }
.desafio > p { color: var(--grafite-2); font-size: 15px; }
.objetivos { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 2px; }
.objetivos li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--linha); font-size: 15.5px; }
.objetivos li:last-child { border-bottom: 0; }
.obj-m { width: 20px; height: 20px; margin-top: 2px; border: 1.5px solid var(--linha); border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.objetivos li.ok .obj-m { background: var(--marca); border-color: var(--grafite); border-radius: 3px; color: #1A1F1C; }
.objetivos li.falhou .obj-m { border-color: var(--vermelho); color: var(--vermelho); }
.obj-msg { display: block; color: var(--vermelho); font-size: 14px; margin-top: 2px; }
.objetivos code { font-size: .86em; padding: 0 4px; border-radius: 3px; background: var(--papel); border: 1px solid var(--linha); }
.desafio-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.desafio-msg { margin-top: 14px; font-size: 15px; }
.desafio-msg:empty { display: none; }
.desafio-msg.erro { color: var(--vermelho); }
.desafio-msg.feito { padding: 12px 14px; border: 1.5px solid var(--grafite); background: var(--marca); color: #1A1F1C; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.desafio-msg.feito .botao { background: #fff; color: #1A1F1C; border-color: #1A1F1C; }
.acoes-fim { display: flex; flex-wrap: wrap; gap: 8px; }
.dica { margin-top: 14px; padding: 12px 16px; border-left: 4px solid var(--marca); background: var(--papel); font-size: 15px; }
.dica p:last-child { margin-bottom: 0; }
.trazer { margin: 0 0 20px; padding: 12px 14px; border: 1.5px dashed var(--caneta); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-size: 15px; }
.lp-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; }
.lp-nav a { font-weight: 600; text-decoration: none; padding: 8px 0; }

/* Bancada: barra, editor e saída */
.barra { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 2px solid var(--grafite); flex-wrap: wrap; }
.barra .auto { font-size: 13px; color: var(--grafite-2); margin-right: auto; padding-left: 4px; }
.barra .verif-barra { display: none; }
@media (max-width: 960px) { .barra .verif-barra { display: inline-flex; } }
.barra kbd { font-size: 11.5px; border: 1px solid var(--linha); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.mais { position: relative; }
.mais > summary { list-style: none; }
.mais > summary::-webkit-details-marker { display: none; }
.mais-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; background: var(--folha); border: 2px solid var(--grafite); min-width: 240px; padding: 6px; display: grid; gap: 2px; }
.mais-menu button { justify-content: flex-start; border: 0; width: 100%; font-weight: 550; }

.editor { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--lousa); color: var(--giz); overflow: hidden; min-height: 0; font: var(--ed-fs)/var(--ed-lh) var(--mono); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.ed-gutter { padding: 12px 10px 12px 12px; text-align: right; color: #5E7368; user-select: none; overflow: hidden; background: var(--lousa-2); min-width: 44px; }
.ed-gutter span { display: block; }
.ed-num { will-change: transform; }
.ed-gutter span.erro { color: #FF8B7E; font-weight: 600; }
.ed-area { position: relative; min-width: 0; }
.ed-hl, .ed-ta {
  position: absolute; inset: 0; margin: 0; border: 0;
  padding: 12px 14px; font: inherit; line-height: inherit; letter-spacing: 0;
  white-space: pre; overflow: auto; tab-size: 2; -moz-tab-size: 2;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
}
.ed-hl { pointer-events: none; overflow: hidden; color: var(--giz); }
.ed-hl code { display: block; font: inherit; padding: 0 60px 60px 0; min-height: 100%; }
.ed-ta { resize: none; color: transparent; background: transparent; caret-color: #FFE45C; outline: none; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: rgba(143, 208, 247, .3); -webkit-text-fill-color: transparent; }
.ed-erro { position: absolute; left: 0; right: -2000px; height: var(--ed-lh); top: calc(12px + (var(--l) - 1) * var(--ed-lh)); background: rgba(255, 110, 95, .18); border-left: 3px solid #FF8B7E; }
.editor:focus-within { box-shadow: inset 0 0 0 2px var(--caneta); }

.teclas { display: none; gap: 4px; padding: 6px 8px; overflow-x: auto; background: var(--lousa-2); border-top: 1px solid #000; }
.teclas button { font: 600 15px/1 var(--mono); padding: 8px 11px; background: var(--lousa); color: var(--giz); border: 1px solid #3B4F46; border-radius: 5px; }
@media (pointer: coarse) { .teclas { display: flex; } }

.saida { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-top: 2px solid var(--grafite); }
.saida-abas { display: flex; align-items: stretch; border-bottom: 1.5px solid var(--grafite); }
.saida-abas button { border: 0; border-radius: 0; background: transparent; padding: 8px 14px; font-size: 14px; color: var(--grafite-2); border-right: 1px solid var(--linha); }
.saida-abas button[aria-selected=true] { color: var(--grafite); box-shadow: inset 0 -3px 0 var(--caneta); }
.saida-abas .conta { font: 600 11px/1 var(--mono); padding: 3px 6px; border-radius: 10px; background: var(--papel); border: 1px solid var(--linha); color: var(--grafite); }

<textarea class="licao">
id: ola
titulo: Sua primeira página
modo: html
=== texto
Todo site que você já abriu, inclusive o seu **Meu Espaço**, é feito de três linguagens trabalhando juntas:

- **HTML** diz *o que* existe na página: títulos, textos, botões.
- **CSS** diz *como* cada coisa aparece: cores, tamanhos, posição.
- **JavaScript** diz *o que acontece*: cliques, contas, salvar dados.

Vamos começar pelo HTML. Ele é feito de **tags**, palavras entre `<` e `>`. A maioria abre e fecha, envolvendo um conteúdo:

```html
<h1>Isto é um título</h1>
<p>Isto é um parágrafo.</p>
```

`<h1>` abre, `</h1>` fecha (repare na barra). Tudo entre as duas é o conteúdo do **elemento**. O `h1` vem de *heading 1*, o título principal; o `p` vem de *paragraph*.

> Ao lado tem um editor de verdade. O que você digitar aparece em **Resultado** na hora. Errou? Não tem problema, nada quebra. Se quiser voltar ao começo, use **Mais → Recomeçar esta lição**.
=== desafio
- Troque o texto do `<h1>` por qualquer outra coisa (seu nome, por exemplo)
  const h = t.$('h1');
  if (!h) t.falha('Não achei nenhum <h1>. Ele precisa abrir com <h1> e fechar com </h1>.');
  return h.textContent.trim() !== '' && h.textContent.trim() !== 'Olá, mundo!';
- Adicione um segundo parágrafo `<p>` embaixo do primeiro
  t.$$('p').length >= 2
=== inicio
<h1>Olá, mundo!</h1>
<p>Esta é a minha primeira página.</p>
=== solucao
<h1>Olá, eu sou o Pachecuff!</h1>
<p>Esta é a minha primeira página.</p>
<p>Estou aprendendo a programar.</p>
=== dica
Mude só o texto que está entre `<h1>` e `</h1>`. Para o segundo parágrafo, copie a linha do `<p>` inteira, da abertura até o fechamento, e cole embaixo com outro texto.
</textarea>

<textarea class="licao">
id: tags
titulo: Títulos, destaques e listas
modo: html
=== texto
Existem seis níveis de título: de `<h1>` (o maior, normalmente um por página) até `<h6>`. Use `<h2>` para as seções e `<h3>` para subseções.

Para destacar algo dentro de um texto:

- `<strong>` deixa em **negrito** (algo importante)
- `<em>` deixa em *itálico* (uma ênfase)

Listas são duas tags trabalhando juntas: `<ul>` (lista com marcadores) ou `<ol>` (lista numerada) por fora, e um `<li>` para cada item:

```html
<ul>
  <li>Cálculo I-A</li>
  <li>Física I</li>
</ul>
```

Repare no **recuo**, os espaços antes de `<li>`. O navegador ignora esses espaços, mas eles mostram para você quem está dentro de quem. O seu app inteiro é organizado assim: caixas dentro de caixas.

> Dica de editor: a tecla `Tab` coloca dois espaços, e `Enter` mantém o recuo da linha de cima.
=== desafio
- Crie um `<h2>` com o texto "Minhas matérias"
  t.$$('h2').some(h => /minhas mat[eé]rias/i.test(h.textContent))
- Faça uma lista `<ul>` com pelo menos 3 matérias
  t.$$('ul').some(u => u.querySelectorAll('li').length >= 3)
- Use `<strong>` em alguma palavra importante
  !!t.$('strong')
=== inicio
<h1>Meu semestre</h1>
<p>Este semestre eu vou estudar muito.</p>

<!-- Isto é um comentário: o navegador ignora. Escreva aqui embaixo. -->

=== solucao
<h1>Meu semestre</h1>
<p>Este semestre eu vou estudar <strong>muito</strong>.</p>

<h2>Minhas matérias</h2>
<ul>
  <li>Cálculo I-A</li>
  <li>Geometria Analítica</li>
  <li>Programação de Computadores</li>
</ul>
=== dica
A estrutura da lista é: abre `<ul>`, depois uma linha `<li>...</li>` para cada matéria, e fecha `</ul>`. Para o destaque, envolva uma palavra que já existe: `<strong>muito</strong>`.
</textarea>

<textarea class="licao">
id: atributos
titulo: Atributos: links, id e class
modo: html
=== texto
Tags podem ter **atributos**: informações extras escritas dentro da abertura, no formato `nome="valor"`.

```html
<a href="https://www.uff.br">Site da UFF</a>
```

O `<a>` cria um link, e o atributo `href` diz para onde ele leva. O texto entre as tags é o que aparece para clicar.

Dois atributos aparecem em todo lugar no seu app:

- `id="algo"`: um nome **único** para um elemento. Serve para o JavaScript encontrar esse elemento depois.
- `class="algo"`: um **grupo**. Vários elementos podem ter a mesma classe e receber o mesmo estilo.

```html
<p id="aviso">Prova na sexta!</p>
<p class="materia">Cálculo I-A</p>
<p class="materia">Física I</p>
```

> No Meu Espaço existe uma `<div id="app"></div>` vazia no HTML. O JavaScript encontra essa div pelo `id` e desenha o app inteiro lá dentro. Você vai fazer igualzinho no projeto final.
=== desafio
- Crie um link `<a>` com `href` começando com `https://`
  t.$$('a').some(a => /^https?:\/\//.test(a.getAttribute('href') || ''))
- O link precisa ter um texto visível para clicar
  t.$$('a[href]').some(a => a.textContent.trim().length > 0)
- Dê ao parágrafo do curso o `id="perfil"`
  !!t.$('p#perfil')
- Coloque `class="materia"` nos dois parágrafos de matérias
  t.$$('.materia').length >= 2
=== inicio
<h1>Meu perfil</h1>
<p>Estudante de Engenharia Civil.</p>

<h2>Matérias</h2>
<p>Cálculo I-A</p>
<p>Física I</p>
=== solucao
<h1>Meu perfil</h1>
<p id="perfil">Estudante de Engenharia Civil.</p>
<p>Minha universidade: <a href="https://www.uff.br">UFF</a></p>

<h2>Matérias</h2>
<p class="materia">Cálculo I-A</p>
<p class="materia">Física I</p>
=== dica
O atributo vai dentro da tag de abertura, depois do nome: `<p id="perfil">`. Para o link: `<a href="https://www.uff.br">UFF</a>`. Na prévia, clicar no link não sai da página, mas num site de verdade abriria.
</textarea>

<textarea class="licao">
id: formularios
titulo: Campos e botões
modo: html
=== texto
Para a pessoa **digitar** algo, usamos `<input>`. É uma tag que não fecha (não existe `</input>`), e o atributo `type` muda o tipo de campo:

```html
<input type="text" placeholder="Nome da matéria">
<input type="number" min="0" max="10" step="0.1">
<input type="date">
```

O `placeholder` é o texto cinza de exemplo que some quando você digita.

O `<label>` é o texto que explica o campo. Ligue os dois com `for` (no label) e `id` (no input). Assim, clicar no texto também seleciona o campo, e quem usa leitor de tela sabe o que é cada campo:

```html
<label for="nota">Nota da P1</label>
<input id="nota" type="number">
```

E o botão: `<button>Salvar</button>`. Por enquanto ele não faz nada. Quem dá vida aos botões é o JavaScript, lá no módulo 4.
=== desafio
- Um `<input>` de texto com `id="materia"`
  const i = t.$('input#materia'); return !!i && i.type === 'text'
- Um `<input type="number">` com `id="nota"`
  const i = t.$('input#nota'); return !!i && i.type === 'number'
- Cada campo com o seu `<label for="...">` apontando para o id certo
  !!t.$('label[for="materia"]') && !!t.$('label[for="nota"]')
- Um `<button>` com o texto "Adicionar"
  t.$$('button').some(b => /adicionar/i.test(b.textContent))
=== inicio
<h1>Nova nota</h1>

<!-- Crie os campos e o botão aqui -->

=== solucao
<h1>Nova nota</h1>

<label for="materia">Matéria</label>
<input id="materia" type="text" placeholder="Ex.: Cálculo I-A">

<label for="nota">Nota</label>
<input id="nota" type="number" min="0" max="10" step="0.1">

<button>Adicionar</button>
=== dica
O `for` do label precisa ter exatamente o mesmo texto do `id` do input: `<label for="nota">` combina com `<input id="nota">`.
</textarea>

<textarea class="licao">
id: estrutura
titulo: Organizando a página
modo: html
=== texto
Uma página de verdade tem regiões, e o HTML tem tags com nomes que descrevem cada uma:

- `<header>`: o topo (nome do site, menu)
- `<main>`: o conteúdo principal, só um por página
- `<section>`: um bloco de assunto, normalmente com o seu próprio título
- `<footer>`: o rodapé
- `<div>`: uma caixa genérica, sem significado especial, para agrupar e estilizar

```html
<header>
  <h1>Meu Espaço</h1>
</header>
<main>
  <section>
    <h2>Próximas provas</h2>
  </section>
</main>
```

Visualmente nada muda, ainda. Mas agora o CSS e o JavaScript conseguem mirar em cada parte. O seu app usa `<header class="top">` no topo.

## O arquivo completo
Até aqui escrevemos só pedaços. Um arquivo HTML completo tem este esqueleto, e é assim que começa o arquivo do seu app:

```html
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Meu Espaço</title>
  </head>
  <body>
    <!-- tudo que aparece na tela -->
  </body>
</html>
```

O `<head>` guarda informações *sobre* a página: o título da aba, e o `charset` que faz os acentos funcionarem. O `<body>` guarda o que aparece na tela.
=== desafio
- Um `<header>` com o `<h1>` dentro
  !!t.$('header h1')
- Um `<main>` com pelo menos duas `<section>`
  t.$$('main section').length >= 2
- Cada `<section>` começa com um `<h2>`
  const s = t.$$('main section'); return s.length >= 2 && s.every(x => x.firstElementChild && x.firstElementChild.tagName === 'H2')
- Um `<footer>` no final
  !!t.$('footer')
=== inicio
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Meu Espaço</title>
</head>
<body>

  <h1>Meu Espaço</h1>

  <h2>Matérias</h2>
  <p>Cálculo I-A, Física I, Geometria Analítica.</p>

  <h2>Próximas provas</h2>
  <p>P1 de Cálculo: 12/05</p>

  <p>Feito por mim.</p>

</body>
</html>
=== solucao
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Meu Espaço</title>
</head>
<body>

  <header>
    <h1>Meu Espaço</h1>
  </header>

  <main>
    <section>
      <h2>Matérias</h2>
      <p>Cálculo I-A, Física I, Geometria Analítica.</p>
    </section>

    <section>
      <h2>Próximas provas</h2>
      <p>P1 de Cálculo: 12/05</p>
    </section>
  </main>

  <footer>
    <p>Feito por mim.</p>
  </footer>

</body>
</html>
=== dica
Envolva o que já existe. Coloque `<header>` antes do `<h1>` e `</header>` depois. Faça o mesmo com cada par título + parágrafo usando `<section>`, e envolva as duas sections com `<main>`.
</textarea>

<textarea class="licao">
id: quiz-html
titulo: Revisão: HTML
tipo: quiz
=== texto
Quatro perguntas rápidas para fixar o módulo. Errou? Leia a explicação e tente de novo.
=== perguntas
? Qual tag cria o título principal que aparece na página?
- `<title>`
+ `<h1>`
- `<head>`
= O `<title>` é o nome que aparece na aba do navegador e fica dentro do `<head>`. O título visível na página é o `<h1>`.

? Qual é a diferença entre `id` e `class`?
+ `id` é único na página; `class` pode se repetir em vários elementos
- São a mesma coisa, só muda o nome
- `class` é único; `id` pode se repetir
= Use `id` para achar *um* elemento específico (o JavaScript adora isso) e `class` para dar o mesmo estilo a um grupo.

? Para ligar um `<label>` a um `<input>`, você usa...
- o mesmo texto dentro dos dois
+ `for` no label com o mesmo valor do `id` do input
- a mesma `class` nos dois
= `<label for="nota">` se liga a `<input id="nota">`. Clicar no texto passa a selecionar o campo.

? Onde fica o conteúdo que aparece na tela?
- no `<head>`
+ no `<body>`
- em qualquer lugar, tanto faz
= O `<head>` guarda informações sobre a página (título da aba, acentos, estilos). O que aparece vai no `<body>`.
</textarea>

<textarea class="licao">
id: css-cores
titulo: Dando cor com CSS
modo: html
=== texto
O CSS pode ser escrito dentro de uma tag `<style>`. Cada **regra** tem um **seletor** (quem vai mudar) e **declarações** entre chaves (o que muda):

```css
h1 {
  color: navy;
  font-size: 40px;
}
```

Leia assim: "todo `h1` fica com a cor `navy` e tamanho de 40 pixels". Cada declaração é `propriedade: valor;`. Não esqueça os dois-pontos nem o ponto e vírgula.

Algumas propriedades para começar:

- `color`: a cor do texto
- `background`: a cor de fundo
- `font-size`: o tamanho da letra (`16px`, `2rem`...)
- `font-family`: a fonte (`system-ui, sans-serif` usa a fonte do sistema)

Cores podem ser nomes em inglês (`tomato`, `navy`, `white`) ou códigos **hexadecimais**, como `#2563EB`, o azul do seu app. O fundo cinza-claro dele é `#F5F6F8`.

> Para escolher uma cor, pesquise "color picker" no Google. Ele mostra o código hexadecimal de qualquer cor que você escolher.
=== desafio
- O fundo da página (`body`) não é mais branco
  const bg = t.css('body', 'background-color'); return bg !== 'rgba(0, 0, 0, 0)' && bg !== 'rgb(255, 255, 255)'
- O `h1` tem uma cor diferente de preto
  t.css('h1', 'color') !== 'rgb(0, 0, 0)'
- O `h1` tem pelo menos `36px`
  parseFloat(t.css('h1', 'font-size')) >= 36
=== inicio
<style>
  body {
    font-family: system-ui, sans-serif;
  }
</style>

<h1>Meu Espaço</h1>
<p>Um lugar para organizar a faculdade.</p>
=== solucao
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #F5F6F8;
  }
  h1 {
    color: #2563EB;
    font-size: 40px;
  }
  p {
    color: #64748B;
  }
</style>

<h1>Meu Espaço</h1>
<p>Um lugar para organizar a faculdade.</p>
=== dica
Adicione `background: #F5F6F8;` dentro da regra do `body`. Depois crie uma regra nova para o título: `h1 { color: ...; font-size: ...; }`.

<textarea class="licao">
id: css-classes
titulo: Classes e cartões
modo: html
=== texto
Um seletor de tag (`p { }`) muda **todos** os parágrafos. Para mirar só em alguns, use uma **classe**: no HTML `class="card"`, e no CSS um ponto antes do nome:

```css
.card {
  background: white;
  padding: 16px;
  border: 1px solid #E2E8F0;
  border-radius: 12px;
}
```

- `padding`: espaço **por dentro** da caixa, entre a borda e o conteúdo
- `border`: a borda, no formato espessura, estilo e cor
- `border-radius`: arredonda os cantos

Um elemento pode ter várias classes separadas por espaço: `class="card destaque"`. É assim que o seu app combina estilos, como em `class="primary small"` num botão.

Quando duas regras mudam a mesma propriedade e têm o mesmo peso, **ganha a que vem depois** no código. Então `.destaque { border-color: ... }` escrito depois de `.card` consegue trocar só a cor da borda.
=== desafio
- As duas matérias têm `class="card"`
  t.$$('.card').length >= 2
- O `.card` tem `padding` de pelo menos 12px
  const c = t.$('.card'); return !!c && parseFloat(t.css(c, 'padding-top')) >= 12
- O `.card` tem cantos arredondados e uma borda
  const c = t.$('.card'); return !!c && parseFloat(t.css(c, 'border-top-left-radius')) > 0 && parseFloat(t.css(c, 'border-top-width')) > 0
- Um dos cards também tem a classe `destaque`, que muda a cor da borda
  const d = t.$('.card.destaque');
  if (!d) return false;
  const n = t.$$('.card').find(x => !x.classList.contains('destaque'));
  if (!n) t.falha('Deixe pelo menos um card sem a classe destaque, para dar para comparar.');
  return t.css(d, 'border-top-color') !== t.css(n, 'border-top-color');
=== inicio
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #F5F6F8;
  }
</style>

<h1>Minhas matérias</h1>

<div>
  <h2>Cálculo I-A</h2>
  <p>Prova dia 12/05</p>
</div>

<div>
  <h2>Física I</h2>
  <p>Lista 3 para entregar</p>
</div>
=== solucao
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #F5F6F8;
  }
  .card {
    background: white;
    padding: 16px;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
  }
  .destaque {
    border-color: #2563EB;
  }
</style>

<h1>Minhas matérias</h1>

<div class="card destaque">
  <h2>Cálculo I-A</h2>
  <p>Prova dia 12/05</p>
</div>

<div class="card">
  <h2>Física I</h2>
  <p>Lista 3 para entregar</p>
</div>
=== dica
Coloque `class="card"` nas duas `<div>`. Na primeira, use `class="card destaque"`. No CSS, crie `.card { ... }` e, depois dela, `.destaque { border-color: #2563EB; }`.
</textarea>

<textarea class="licao">
id: caixa
titulo: Espaços: margin, padding e largura
modo: html
=== texto
Para o navegador, **todo elemento é uma caixa**. De dentro para fora, cada caixa tem:

1. o **conteúdo**
2. o `padding` (enchimento por dentro)
3. a `border` (a borda)
4. a `margin` (espaço por fora, que afasta as caixas vizinhas)

Abra o seu app no computador, aperte `F12` e passe o mouse sobre os elementos: o navegador pinta essas camadas com cores diferentes.

Duas propriedades fazem muita diferença no layout:

```css
.pagina {
  max-width: 720px;   /* nunca fica mais largo que isso */
  margin: 0 auto;     /* 0 em cima e embaixo, automático dos lados: centraliza */
  padding: 24px;
}
```

E uma linha que quase todo site usa (o seu app também, logo no começo do CSS):

```css
* { box-sizing: border-box; }
```

O `*` seleciona **tudo**. E o `border-box` faz o `padding` e a borda ficarem **dentro** da largura que você definiu, em vez de somarem a ela. Fica muito mais fácil de calcular.

> O que está entre `/*` e `*/` é um comentário de CSS. O navegador ignora.
=== desafio
- `.pagina` tem `max-width` de no máximo 800px
  const p = t.$('.pagina');
  if (!p) t.falha('Não achei o elemento com class="pagina".');
  const m = parseFloat(t.css(p, 'max-width'));
  return m > 0 && m <= 800;
- `.pagina` fica centralizada com `margin` automática dos lados
  const p = t.$('.pagina'); if (!p) return false; const l = parseFloat(t.css(p, 'margin-left')), r = parseFloat(t.css(p, 'margin-right')); return l > 0 && Math.abs(l - r) < 2
- Os cards têm espaço entre eles (`margin-bottom` de pelo menos 8px)
  const c = t.$('.card'); return !!c && parseFloat(t.css(c, 'margin-bottom')) >= 8
- O código usa `box-sizing: border-box`
  t.tem(/box-sizing\s*:\s*border-box/)
=== inicio
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #F5F6F8;
  }
  .card {
    background: white;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 16px;
  }
</style>

<div class="pagina">
  <h1>Minhas matérias</h1>
  <div class="card">Cálculo I-A</div>
  <div class="card">Física I</div>
  <div class="card">Geometria Analítica</div>
</div>
=== solucao
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: system-ui, sans-serif;
    background: #F5F6F8;
  }
  .pagina {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
  }
  .card {
    background: white;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
</style>

<div class="pagina">
  <h1>Minhas matérias</h1>
  <div class="card">Cálculo I-A</div>
  <div class="card">Física I</div>
  <div class="card">Geometria Analítica</div>
</div>
=== dica
Crie a regra `.pagina { max-width: 720px; margin: 0 auto; }`. No `.card`, adicione `margin-bottom: 12px;`. E no topo do `<style>`, coloque `* { box-sizing: border-box; }`.
</textarea>

<textarea class="licao">
id: flex
titulo: Flexbox: um do lado do outro
modo: html
=== texto
Por padrão, caixas como `<div>` ficam **uma embaixo da outra**. Para colocar lado a lado, o **pai** ganha `display: flex`:

```css
.linha {
  display: flex;
  gap: 12px;                       /* espaço entre os filhos */
  align-items: center;             /* alinha na vertical */
  justify-content: space-between;  /* distribui na horizontal */
}
```

O `display: flex` vai **no pai**, e quem se organiza são os **filhos diretos** dele. Algumas opções de `justify-content`:

- `flex-start`: tudo no começo (é o padrão)
- `center`: tudo no meio
- `space-between`: o primeiro numa ponta, o último na outra
- `flex-end`: tudo no final

Se os filhos não couberem, `flex-wrap: wrap` deixa eles quebrarem para a linha de baixo. Isso é essencial no celular.

> A barra do topo do seu app é um flex: nome de um lado, botões do outro. E a classe `.row` do código dele é exatamente `display: flex` com `gap`.
=== desafio
- O `header` usa `display: flex`
  t.css('header', 'display') === 'flex'
- O `header` deixa o título e o botão nas pontas (`space-between`)
  t.css('header', 'justify-content') === 'space-between'
- `.resumo` é flex, com `gap` maior que zero
  const r = t.$('.resumo');
  if (!r) t.falha('Não achei o elemento com class="resumo".');
  return t.css(r, 'display') === 'flex' && parseFloat(t.css(r, 'column-gap')) > 0;
- Os três cards do resumo ficam lado a lado
  const cs = t.$$('.resumo .card'); if (cs.length < 3) return false; const y = cs.map(c => Math.round(c.getBoundingClientRect().top)); return y.every(v => Math.abs(v - y[0]) < 3)
=== inicio
<style>
  body { font-family: system-ui, sans-serif; background: #F5F6F8; margin: 0; }
  header { background: white; padding: 12px 20px; border-bottom: 1px solid #E2E8F0; }
  header h1 { margin: 0; font-size: 20px; }
  main { padding: 20px; }
  .card { background: white; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; }
  .card b { display: block; font-size: 28px; }
</style>

<header>
  <h1>Meu Espaço</h1>
  <button>Tema</button>
</header>

<main>
  <div class="resumo">
    <div class="card"><b>7</b> matérias</div>
    <div class="card"><b>2</b> provas na semana</div>
    <div class="card"><b>7,8</b> média geral</div>
  </div>
</main>
=== solucao
<style>
  body { font-family: system-ui, sans-serif; background: #F5F6F8; margin: 0; }
  header {
    background: white;
    padding: 12px 20px;
    border-bottom: 1px solid #E2E8F0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 20px; }
  main { padding: 20px; }
  .resumo {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card { background: white; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; flex: 1; }
  .card b { display: block; font-size: 28px; }
</style>

<header>
  <h1>Meu Espaço</h1>
  <button>Tema</button>
</header>

<main>
  <div class="resumo">
    <div class="card"><b>7</b> matérias</div>
    <div class="card"><b>2</b> provas na semana</div>
    <div class="card"><b>7,8</b> média geral</div>
  </div>
</main>
=== dica
São dois pais: o `header` (filhos: o `h1` e o botão) e a `.resumo` (filhos: os três cards). Os dois precisam de `display: flex`. Bônus: `flex: 1` no `.card` faz os três dividirem o espaço igualmente.
</textarea>

<textarea class="licao">
id: grid
titulo: Grid e telas de celular
modo: html
=== texto
O flexbox organiza numa **linha**. Para uma **grade**, com linhas e colunas, existe o `display: grid`:

```css
.grade {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;  /* 3 colunas iguais */
  gap: 16px;
}
```

`1fr` quer dizer "uma fração do espaço que sobra". Com `1fr 2fr`, a segunda coluna teria o dobro da largura da primeira.

## E no celular?
Três colunas numa tela de celular ficam espremidas. A solução é a **media query**: regras que só valem quando a tela é estreita.

```css
@media (max-width: 600px) {
  .grade {
    grid-template-columns: 1fr;
  }
}
```

Leia como "se a tela tiver no máximo 600px de largura, a grade vira uma coluna só". O seu app tem exatamente isto:

```css
@media (max-width: 820px) {
  .grid2, .grid3 { grid-template-columns: 1fr }
}
```

> A verificação testa a sua página com dois tamanhos de tela: 900px (computador) e 400px (celular).
=== desafio
- `.grade` usa `display: grid`
  t.css('.grade', 'display') === 'grid'
- Numa tela larga (900px), a grade tem 3 colunas
  await t.largura(900); return t.css('.grade', 'grid-template-columns').split(' ').length === 3
- Numa tela de celular (400px), a grade vira 1 coluna
  await t.largura(400); return t.css('.grade', 'display') === 'grid' && t.css('.grade', 'grid-template-columns').split(' ').length === 1
- Tem espaço entre os cards (`gap`)
  parseFloat(t.css('.grade', 'row-gap')) > 0
=== inicio
<style>
  body { font-family: system-ui, sans-serif; background: #F5F6F8; padding: 16px; }
  .card { background: white; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; }
</style>

<h1>Minhas matérias</h1>
<div class="grade">
  <div class="card">Cálculo I-A</div>
  <div class="card">Física I</div>
  <div class="card">Geometria Analítica</div>
  <div class="card">Geometria Descritiva</div>
  <div class="card">Química Geral</div>
  <div class="card">Programação</div>
</div>
=== solucao
<style>
  body { font-family: system-ui, sans-serif; background: #F5F6F8; padding: 16px; }
  .card { background: white; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; }
  .grade {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 600px) {
    .grade {
      grid-template-columns: 1fr;
    }
  }
</style>

<h1>Minhas matérias</h1>
<div class="grade">
  <div class="card">Cálculo I-A</div>
  <div class="card">Física I</div>
  <div class="card">Geometria Analítica</div>
  <div class="card">Geometria Descritiva</div>
  <div class="card">Química Geral</div>
  <div class="card">Programação</div>
</div>
=== dica
Crie a regra `.grade` com `display: grid`, `grid-template-columns: 1fr 1fr 1fr` e `gap`. Depois, no final do `<style>`, adicione o bloco `@media (max-width: 600px) { ... }` com uma regra `.grade` que tem só uma coluna (`1fr`).
</textarea>

<textarea class="licao">
id: variaveis-css
titulo: Variáveis CSS e o tema escuro
modo: html
=== texto
Imagine trocar a cor azul do app inteiro. Com a mesma cor espalhada em 40 lugares, seria um sofrimento. A solução são as **variáveis CSS**:

```css
:root {
  --fundo: #F5F6F8;
  --texto: #172B4D;
  --azul: #2563EB;
}
body {
  background: var(--fundo);
  color: var(--texto);
}
```

`:root` é o elemento raiz da página, a tag `<html>`. As variáveis começam com `--` e são usadas com `var(--nome)`.

## O truque do tema escuro
Agora basta redefinir as variáveis quando o `<html>` tiver o atributo `data-theme="dark"`:

```css
:root[data-theme=dark] {
  --fundo: #0E131B;
  --texto: #E6EBF3;
}
```

Nenhuma outra regra precisa mudar. Como tudo usa `var()`, o app inteiro troca de cor. **É exatamente assim que o seu Meu Espaço faz o tema escuro**, até com estas mesmas cores. Lá as variáveis se chamam `--bg`, `--ink` e `--blue`.

> Para ver funcionando, escreva `<html data-theme="dark">` na segunda linha do código ao lado. No módulo 4, um botão vai fazer isso sozinho.
=== desafio
- `:root` define as variáveis `--fundo`, `--texto` e `--card`
  const s = getComputedStyle(t.doc.documentElement); return ['--fundo', '--texto', '--card'].every(v => s.getPropertyValue(v).trim() !== '')
- O `body` usa `var(--fundo)` no fundo e `var(--texto)` na cor do texto
  t.tem(/background(-color)?\s*:\s*var\(--fundo\)/) && t.tem(/[^-]color\s*:\s*var\(--texto\)/)
- Com `data-theme="dark"` no `<html>`, o fundo da página muda
  const h = t.doc.documentElement; h.removeAttribute('data-theme'); const a = t.css('body', 'background-color'); h.setAttribute('data-theme', 'dark'); const b = t.css('body', 'background-color'); return a !== b
- O `.card` também usa `var(--card)` e muda no tema escuro
  const h = t.doc.documentElement; h.removeAttribute('data-theme'); const a = t.css('.card', 'background-color'); h.setAttribute('data-theme', 'dark'); const b = t.css('.card', 'background-color'); return a !== b
=== inicio
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #F5F6F8;
    color: #172B4D;
    padding: 24px;
  }
  .card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 16px;
  }
</style>
</head>
<body>
  <h1>Meu Espaço</h1>
  <div class="card">
    <h2>Cálculo I-A</h2>
    <p>Média atual: 7,5</p>
  </div>
</body>
</html>
=== solucao
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root {
    --fundo: #F5F6F8;
    --texto: #172B4D;
    --card: #FFFFFF;
    --linha: #E2E8F0;
  }
  :root[data-theme=dark] {
    --fundo: #0E131B;
    --texto: #E6EBF3;
    --card: #161D29;
    --linha: #2A3444;
  }
  body {
    font-family: system-ui, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--linha);
    border-radius: 12px;
    padding: 16px;
  }
</style>
</head>
<body>
  <h1>Meu Espaço</h1>
  <div class="card">
    <h2>Cálculo I-A</h2>
    <p>Média atual: 7,5</p>
  </div>
</body>
</html>
=== dica
Três passos: 1) crie `:root { --fundo: ...; --texto: ...; --card: ...; }` com as cores que já estão no código; 2) troque as cores fixas por `var(--fundo)`, `var(--texto)` e `var(--card)`; 3) crie `:root[data-theme=dark] { ... }` com as versões escuras (por exemplo `#0E131B`, `#E6EBF3` e `#161D29`).
</textarea>

<textarea class="licao">
id: quiz-css
titulo: Revisão: CSS
tipo: quiz
=== texto
Mais quatro perguntas, agora sobre o visual.
=== perguntas
? Em `h1 { color: red; }`, o que é o `h1`?
+ o seletor (quem vai mudar)
- a propriedade
- o valor
= O seletor escolhe os elementos. `color` é a propriedade, e `red` é o valor.

? Qual é a diferença entre `padding` e `margin`?
+ `padding` é o espaço por dentro da borda; `margin`, por fora
- são a mesma coisa
- `margin` é por dentro; `padding` é por fora
= O `padding` afasta o conteúdo da borda. A `margin` afasta a caixa das vizinhas.

? Para colocar vários filhos lado a lado com espaço entre eles...
+ `display: flex` e `gap` no pai
- `display: flex` em cada filho
- `margin: auto` no pai
= O flex vai sempre no pai, e organiza os filhos diretos dele.

? Por que o tema escuro do seu app troca tudo de cor mudando só um atributo no `<html>`?
+ Porque as cores são variáveis CSS, redefinidas em `:root[data-theme=dark]`
- Porque o navegador inverte as cores sozinho
- Porque existe um segundo arquivo inteiro só para o tema escuro
= Todas as regras usam `var(--bg)`, `var(--ink)` e assim por diante. Quando o atributo muda, as variáveis mudam e todo o resto acompanha.
</textarea>

<textarea class="licao">
id: console
titulo: Primeiras linhas de JavaScript
modo: js
=== texto
Agora a lógica. O JavaScript roda **uma instrução de cada vez, de cima para baixo**. A primeira que todo mundo aprende é o `console.log`, que mostra algo no **Console**:

```js
console.log('Olá!');
console.log(2 + 3);
```

- Texto (o nome técnico é **string**) vai entre aspas: `'assim'` ou `"assim"`.
- Números vão sem aspas, e dá para fazer contas: `+`, `-`, `*` (vezes) e `/` (dividido).
- Parênteses mudam a ordem das contas, como na matemática: `(2 + 3) * 4` dá `20`.
- `//` começa um **comentário**: o computador ignora, ele serve só para humanos.

Duas pegadinhas para quem é do Brasil:

1. O decimal é com **ponto**: `6.5`, nunca `6,5`.
2. `'2' + '3'` dá `'23'` (juntou dois textos), mas `2 + 3` dá `5`.

> Neste módulo o resultado aparece no **Console**, embaixo do editor. Aperte **Executar** (ou `Ctrl + Enter`) para rodar.
=== desafio
- Mostre no console a frase `Vou aprender JavaScript`
  t.logs.some(l => /vou aprender javascript/i.test(l))
- Mostre o resultado da conta `7 * 6` (deixe o computador calcular, não escreva 42)
  t.logs.includes('42') && t.tem(/7\s*\*\s*6/)
- Mostre a média de 8 e 6.5: `(8 + 6.5) / 2`
  t.logs.includes('7.25')
=== inicio
// Aperte Executar (Ctrl + Enter) para rodar este código
console.log('Olá, mundo!');

// Escreva o seu código aqui embaixo

=== solucao
console.log('Olá, mundo!');

console.log('Vou aprender JavaScript');
console.log(7 * 6);
console.log((8 + 6.5) / 2);
=== dica
Cada `console.log(...)` mostra uma linha. Texto vai entre aspas: `console.log('Vou aprender JavaScript');`. Conta vai sem aspas: `console.log(7 * 6);`.
</textarea>

<textarea class="licao">
id: variaveis-js
titulo: Variáveis: caixas com nome
modo: js
=== texto
Uma **variável** guarda um valor com um nome, para você usar depois:

```js
const materia = 'Cálculo I-A';
let nota = 7;
nota = nota + 0.5;   // let pode mudar
console.log(nota);   // 7.5
```

- `const`: o valor **não muda** depois de criado. Use por padrão.
- `let`: o valor **pode mudar**.
- Você vai ver `var` em códigos antigos. Prefira `let` e `const`.

Os nomes não podem ter espaço nem começar com número. O costume em JavaScript é juntar as palavras com maiúscula: `notaFinal`, `mediaGeral`.

## Juntando texto e valores
Com **crases** você cria uma *template string* e encaixa variáveis dentro dela com `${}`:

```js
console.log(`Minha nota em ${materia} é ${nota}`);
```

No teclado brasileiro, a crase sai com `Shift` + a tecla do acento agudo, seguido de espaço.

Isso é o coração do seu app: quase todo o HTML dele é montado com template strings assim.
=== desafio
- Crie uma `const` chamada `materia` com o nome de uma matéria
  const v = t.valor('materia'); return typeof v === 'string' && v.length > 0 && t.tem(/const\s+materia\b/)
- Crie um `let` chamado `nota` com um número
  typeof t.valor('nota') === 'number' && t.tem(/let\s+nota\b/)
- Some 1 ponto à nota depois de criá-la (`nota = nota + 1`)
  t.tem(/nota\s*(=\s*nota\s*\+|\+=)/)
- Mostre com template string: `Minha nota em ... é ...`
  t.logs.some(l => /^Minha nota em .+ é \d/.test(l)) && t.tem(/`[^`]*\$\{\s*materia\s*\}/)
=== inicio
// 1. Crie a const materia
// 2. Crie o let nota
// 3. Some 1 ponto à nota
// 4. Mostre a frase com template string (crases)

=== solucao
const materia = 'Física I';
let nota = 6.5;
nota = nota + 1;

console.log(`Minha nota em ${materia} é ${nota}`);
=== dica
A frase final fica assim: `console.log(` + crase + `Minha nota em ${materia} é ${nota}` + crase + `);`. Use crases, não aspas, senão o `${}` aparece como texto.
</textarea>

<textarea class="licao">
id: funcoes
titulo: Funções: receitas reutilizáveis
modo: js
=== texto
Uma **função** é um bloco de código com nome, que você roda quando quiser. Ela pode **receber** valores (os parâmetros) e **devolver** um resultado com `return`:

```js
function media(p1, p2) {
  return (p1 + p2) / 2;
}

console.log(media(7, 8));   // 7.5
console.log(media(5, 6));   // 5.5
```

`p1` e `p2` são como variáveis que só existem dentro da função. Elas recebem os valores que você passa entre parênteses na hora de **chamar** a função.

Atenção à diferença: `console.log` só **mostra** algo na tela. O `return` **devolve** o valor para quem chamou, que pode guardar numa variável, usar numa conta, e assim por diante.

## Arrow functions
Existe também uma forma curta, a **arrow function** (função flecha), muito usada no seu app:

```js
const dobro = n => n * 2;
const soma = (a, b) => a + b;
```

Sem chaves, o resultado da conta é devolvido automaticamente.
=== desafio
- Crie a função `media(p1, p2)`, que **retorna** a média das duas notas
  const f = t.valor('media');
  if (typeof f !== 'function') t.falha('Não achei uma função chamada media.');
  const r = f(6, 8);
  if (r === undefined) t.falha('media(6, 8) não devolveu nada. Faltou o return?');
  return r === 7 && f(5, 6) === 5.5;
- Crie `mediaPonderada(p1, p2)`, em que a P2 vale o dobro: `(p1 + 2 * p2) / 3`
  const f = t.valor('mediaPonderada'); if (typeof f !== 'function') return false; return Math.abs(f(6, 9) - 8) < 1e-9 && Math.abs(f(3, 6) - 5) < 1e-9
- Mostre no console o resultado de `media(7, 10)`
  t.logs.includes('8.5')
=== inicio
function media(p1, p2) {
  // devolva a média aqui
}

// Crie a função mediaPonderada aqui embaixo

=== solucao
function media(p1, p2) {
  return (p1 + p2) / 2;
}

function mediaPonderada(p1, p2) {
  return (p1 + 2 * p2) / 3;
}

console.log(media(7, 10));
=== dica
Dentro da função, escreva `return (p1 + p2) / 2;`. Os parênteses são importantes: sem eles, o computador faz `p2 / 2` primeiro e depois soma `p1`.
</textarea>

<textarea class="licao">
id: if
titulo: Decisões: if e else
modo: js
=== texto
Programas tomam decisões. A estrutura é:

```js
if (condicao) {
  // roda se a condição for verdadeira
} else {
  // roda se for falsa
}
```

Comparações que dão verdadeiro (`true`) ou falso (`false`):

- `===` igual e `!==` diferente
- `>`, `<`, `>=` (maior ou igual) e `<=` (menor ou igual)
- `&&` quer dizer E: as duas condições precisam ser verdade
- `||` quer dizer OU: basta uma ser verdade

Dá para encadear várias opções com `else if`:

```js
const diasParaProva = 3;

if (diasParaProva <= 2) {
  console.log('Hora de revisar!');
} else if (diasParaProva <= 7) {
  console.log('Comece a fazer exercícios.');
} else {
  console.log('Ainda dá tempo, mas não enrola.');
}
```

O computador testa de cima para baixo e para no **primeiro** que for verdadeiro.

> Use `===` para comparar. Um `=` só serve para **guardar** um valor numa variável, e é um erro muito comum trocar os dois.
=== desafio
- `situacao(7)` e `situacao(6)` retornam `'Aprovado'`
  const f = t.valor('situacao');
  if (typeof f !== 'function') t.falha('Não achei a função situacao.');
  return f(7) === 'Aprovado' && f(6) === 'Aprovado';
- `situacao(5)` e `situacao(4)` retornam `'VS'`
  const f = t.valor('situacao'); return typeof f === 'function' && f(5) === 'VS' && f(4) === 'VS'
- `situacao(3.9)` e `situacao(0)` retornam `'Reprovado'`
  const f = t.valor('situacao'); return typeof f === 'function' && f(3.9) === 'Reprovado' && f(0) === 'Reprovado'
- `passou(media, frequencia)` só dá `true` com média de pelo menos 6 **e** frequência de pelo menos 75
  const f = t.valor('passou'); if (typeof f !== 'function') return false; return f(7, 80) === true && f(7, 70) === false && f(5, 90) === false && f(6, 75) === true
=== inicio
// A regra (parecida com a da UFF):
// média 6 ou mais: 'Aprovado'
// de 4 até 6: 'VS' (verificação suplementar)
// abaixo de 4: 'Reprovado'
function situacao(media) {
  // escreva aqui
}

console.log(situacao(7));
console.log(situacao(5));
console.log(situacao(2));

// Crie a função passou(media, frequencia) aqui embaixo

=== solucao
function situacao(media) {
  if (media >= 6) {
    return 'Aprovado';
  } else if (media >= 4) {
    return 'VS';
  } else {
    return 'Reprovado';
  }
}

console.log(situacao(7));
console.log(situacao(5));
console.log(situacao(2));

function passou(media, frequencia) {
  return media >= 6 && frequencia >= 75;
}
=== dica
Comece pelo caso mais alto: `if (media >= 6) { return 'Aprovado'; }`. Depois `else if (media >= 4)`, e por último o `else`. No `passou`, a própria comparação já é `true` ou `false`: `return media >= 6 && frequencia >= 75;`.
</textarea>

<textarea class="licao">
id: arrays
titulo: Listas e repetição
modo: js
=== texto
Um **array** é uma lista de valores entre colchetes:

```js
const notas = [7, 5.5, 9, 8];
console.log(notas[0]);      // 7  (a contagem começa no 0!)
console.log(notas.length);  // 4  (quantos itens tem)
notas.push(10);             // coloca um item no final
```

Para fazer algo **com cada item**, use o `for...of`:

```js
let total = 0;
for (const nota of notas) {
  total = total + nota;
}
console.log(total);
```

Leia assim: "para cada `nota` dentro de `notas`, faça o que está entre as chaves". O código de dentro roda uma vez para cada item.

> Cuidado com repetições que nunca acabam (o famoso *loop infinito*). Se acontecer, a Oficina interrompe o código depois de alguns segundos e avisa no console.
=== desafio
- `soma(lista)` retorna a soma de todos os números
  const f = t.valor('soma');
  if (typeof f !== 'function') t.falha('Não achei a função soma.');
  return f([1, 2, 3]) === 6 && f([7.5]) === 7.5 && f([]) === 0;
- `mediaDaLista(lista)` retorna a média dos números
  const f = t.valor('mediaDaLista'); return typeof f === 'function' && f([6, 8, 10]) === 8 && f([5]) === 5
- `maior(lista)` retorna o maior número da lista
  const f = t.valor('maior');
  if (typeof f !== 'function') return false;
  if (f([-5, -2]) === 0) t.falha('Com [-5, -2] deu 0. Comece com o primeiro item (lista[0]) em vez de 0.');
  return f([3, 9, 2]) === 9 && f([-5, -2]) === -2 && f([4]) === 4;
=== inicio
function soma(lista) {
  let total = 0;
  // percorra a lista com for...of
  return total;
}

function mediaDaLista(lista) {
  // dica: use soma(lista) e lista.length
}

function maior(lista) {
  // guarde o maior até agora e compare com cada item
}

console.log(soma([7, 5.5, 9, 8]));
=== solucao
function soma(lista) {
  let total = 0;
  for (const n of lista) {
    total = total + n;
  }
  return total;
}

function mediaDaLista(lista) {
  return soma(lista) / lista.length;
}

function maior(lista) {
  let m = lista[0];
  for (const n of lista) {
    if (n > m) {
      m = n;
    }
  }
  return m;
}

console.log(soma([7, 5.5, 9, 8]));
console.log(maior([7, 5.5, 9, 8]));
=== dica
No `maior`, comece com `let m = lista[0];`. Depois, para cada número, se ele for maior que `m`, guarde ele em `m`. No fim, `return m;`.
</textarea>

<textarea class="licao">
id: objetos
titulo: Objetos: várias informações juntas
modo: js
=== texto
Uma matéria tem nome, notas, professor... Para agrupar tudo numa coisa só, usamos um **objeto**: pares de `chave: valor` entre chaves.

```js
const materia = {
  nome: 'Física I',
  p1: 6,
  p2: 8,
};

console.log(materia.nome);   // 'Física I'
materia.p2 = 9;              // dá para mudar um valor
```

O ponto lê um valor de dentro do objeto: `materia.nome`, `materia.p1`.

E o mais comum de todos: uma **lista de objetos**. É assim que o seu app guarda as matérias:

```js
const materias = [
  { nome: 'Cálculo I-A', p1: 7, p2: 8 },
  { nome: 'Física I', p1: 4, p2: 5 },
];

for (const m of materias) {
  console.log(m.nome);
}
```
=== desafio
- `mediaDa(materia)` retorna a média entre `p1` e `p2` do objeto
  const f = t.valor('mediaDa');
  if (typeof f !== 'function') t.falha('Não achei a função mediaDa.');
  return f({ nome: 'X', p1: 6, p2: 8 }) === 7;
- `contarAprovadas(lista)` conta quantas matérias têm média de pelo menos 6
  const f = t.valor('contarAprovadas'); if (typeof f !== 'function') return false; return f([{ p1: 7, p2: 8 }, { p1: 4, p2: 5 }, { p1: 6, p2: 6 }]) === 2 && f([]) === 0
- Coloque uma terceira matéria no array `materias` usando `push`
  const m = t.valor('materias'); return Array.isArray(m) && m.length >= 3 && t.tem(/materias\.push\(/)
=== inicio
const materias = [
  { nome: 'Cálculo I-A', p1: 7, p2: 8 },
  { nome: 'Física I', p1: 4, p2: 5 },
];

function mediaDa(materia) {
  // use materia.p1 e materia.p2
}

function contarAprovadas(lista) {
  let quantas = 0;
  // percorra a lista e conte as que têm média >= 6
  return quantas;
}

// Coloque mais uma matéria em materias com push

console.log(contarAprovadas(materias));
=== solucao
const materias = [
  { nome: 'Cálculo I-A', p1: 7, p2: 8 },
  { nome: 'Física I', p1: 4, p2: 5 },
];

function mediaDa(materia) {
  return (materia.p1 + materia.p2) / 2;
}

function contarAprovadas(lista) {
  let quantas = 0;
  for (const m of lista) {
    if (mediaDa(m) >= 6) {
      quantas = quantas + 1;
    }
  }
  return quantas;
}

materias.push({ nome: 'Geometria Analítica', p1: 9, p2: 7 });

console.log(contarAprovadas(materias));
=== dica
Para colocar um objeto na lista: `materias.push({ nome: '...', p1: 9, p2: 7 });`. No `contarAprovadas`, use a função `mediaDa` que você acabou de criar dentro do `if`.
</textarea>

<textarea class="licao">
id: map-filter
titulo: map, filter e reduce
modo: js
=== texto
Três métodos de array aparecem o tempo todo. No código do seu app, são dezenas de vezes.

**`map`** transforma cada item e devolve uma lista nova, do mesmo tamanho:

```js
const nomes = materias.map(m => m.nome);
// ['Cálculo I-A', 'Física I', ...]
```

**`filter`** devolve só os itens que passam num teste:

```js
const boas = materias.filter(m => m.p1 >= 7);
```

**`reduce`** junta todos os itens num valor só, por exemplo uma soma:

```js
const total = [1, 2, 3].reduce((acc, n) => acc + n, 0);   // 6
```

O `acc` (acumulador) começa com o `0` do final e vai recebendo a soma, item por item.

O que vai entre os parênteses (`m => m.nome`) é uma arrow function. O método chama essa função **para cada item** da lista.

> No topo do seu app existe `nav.map(([r, ic, l]) => ...).join('')`. Ele transforma uma lista de telas numa lista de botões. Você vai fazer algo assim no próximo módulo.
=== desafio
- `nomes(lista)` usa `map` para devolver só os nomes
  const f = t.valor('nomes'); if (typeof f !== 'function') return false; const ms = t.valor('materias'); return t.igual(f(ms), ms.map(m => m.nome)) && t.tem(/\.map\(/)
- `aprovadas(lista)` usa `filter` para devolver as matérias com média de pelo menos 6
  const f = t.valor('aprovadas'); if (typeof f !== 'function') return false; const r = f([{ nome: 'A', p1: 7, p2: 7 }, { nome: 'B', p1: 2, p2: 3 }]); return Array.isArray(r) && r.length === 1 && r[0].nome === 'A' && t.tem(/\.filter\(/)
- `mediaGeral(lista)` usa `reduce` para calcular a média de todas as médias
  const f = t.valor('mediaGeral'); if (typeof f !== 'function') return false; const r = f([{ p1: 6, p2: 8 }, { p1: 8, p2: 10 }]); return Math.abs(r - 8) < 1e-9 && t.tem(/\.reduce\(/)
=== inicio
const materias = [
  { nome: 'Cálculo I-A', p1: 7, p2: 8.5 },
  { nome: 'Física I', p1: 5, p2: 6 },
  { nome: 'Geometria Analítica', p1: 3, p2: 4.5 },
];

const mediaDa = m => (m.p1 + m.p2) / 2;

function nomes(lista) {
  // use lista.map(...)
}

function aprovadas(lista) {
  // use lista.filter(...)
}

function mediaGeral(lista) {
  // some as médias com reduce e divida pela quantidade
}

console.log(nomes(materias));
console.log(aprovadas(materias));
console.log(mediaGeral(materias));
=== solucao
const materias = [
  { nome: 'Cálculo I-A', p1: 7, p2: 8.5 },
  { nome: 'Física I', p1: 5, p2: 6 },
  { nome: 'Geometria Analítica', p1: 3, p2: 4.5 },
];

const mediaDa = m => (m.p1 + m.p2) / 2;

function nomes(lista) {
  return lista.map(m => m.nome);
}

function aprovadas(lista) {
  return lista.filter(m => mediaDa(m) >= 6);
}

function mediaGeral(lista) {
  const total = lista.reduce((acc, m) => acc + mediaDa(m), 0);
  return total / lista.length;
}

console.log(nomes(materias));
console.log(aprovadas(materias));
console.log(mediaGeral(materias));
=== dica
Não esqueça o `return` antes de `lista.map(...)` e `lista.filter(...)`. No `mediaGeral`: `lista.reduce((acc, m) => acc + mediaDa(m), 0)` dá a soma das médias. Depois é só dividir por `lista.length`.
</textarea>

<textarea class="licao">
id: quiz-js
titulo: Revisão: JavaScript
tipo: quiz
=== texto
Quatro perguntas sobre a lógica. Se travar, volte na lição e rode o exemplo de novo.
=== perguntas
? Qual é o resultado de `'2' + '3'`?
+ `'23'`
- `5`
- dá erro
= Com aspas são textos, e `+` entre textos **junta**. Para somar, os dois lados precisam ser números.

? Quando usar `let` em vez de `const`?
+ Quando o valor da variável vai mudar depois
- Sempre, `const` é coisa antiga
- Só para números
= Use `const` por padrão. Se você precisar mudar o valor depois (como um contador), use `let`.

? O que `[10, 20, 30][1]` devolve?
- `10`
+ `20`
- `30`
= A contagem das posições começa no 0. A posição 1 é o segundo item.

? O que `[1, 2, 3, 4].filter(n => n > 2)` devolve?
+ `[3, 4]`
- `[false, false, true, true]`
- `2`
= O `filter` devolve os itens que passaram no teste. `[false, false, true, true]` seria o resultado de um `map` com o mesmo teste.
</textarea>

<textarea class="licao">
id: dom
titulo: JavaScript mexendo na página
modo: html
=== texto
Até agora o JavaScript só falava com o console. Agora ele vai mexer na página. O navegador transforma o HTML numa árvore de objetos, chamada **DOM**, e o `document` é a porta de entrada:

```js
const titulo = document.querySelector('h1');
titulo.textContent = 'Novo título!';
titulo.style.color = 'tomato';
```

O `querySelector` recebe um **seletor CSS**, igual aos do módulo 2: `'h1'`, `'#perfil'`, `'.card'`. Ele devolve o **primeiro** elemento que encontrar, ou `null` se não achar nada. Para pegar **todos**, use `querySelectorAll`, e percorra com `for...of`.

O JavaScript entra na página pela tag `<script>`, normalmente no final do `<body>`. Assim, quando o código roda, o HTML de cima já existe.

## Um atalho do seu app
Escrever `document.querySelector` toda hora cansa. O seu app cria um atalho logo na primeira linha do JavaScript dele:

```js
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
```

Depois disso, `$('#toast')` já encontra o elemento. Pode usar esse atalho daqui para frente!
=== desafio
- O `<h1>` não mostra mais "Carregando..." (mude pelo JavaScript, deixe o HTML como está)
  const h = t.$('h1'); return !!h && !/carregando/i.test(h.textContent) && /<h1[^>]*>\s*Carregando/i.test(t.codigo)
- O `#aviso` mostra o texto "Pronto!"
  /pronto/i.test(t.texto('#aviso'))
- O `#aviso` fica verde (`style.color`)
  const s = t.$('#aviso'); if (!s) return false; const [r, g, b] = t.css(s, 'color').match(/\d+/g).map(Number); return g > r && g > b
- Todos os `.card` ganham uma borda pelo JavaScript, usando `querySelectorAll` e `for...of`
  const cs = t.$$('.card'); return cs.length >= 2 && cs.every(c => parseFloat(t.css(c, 'border-top-width')) > 0) && t.tem(/querySelectorAll|\$\$\(/)
=== inicio
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; }
  .card { padding: 12px; margin-bottom: 8px; border-radius: 10px; background: #F5F6F8; }
</style>

<h1>Carregando...</h1>
<p id="aviso">Aguarde</p>

<div class="card">Cálculo I-A</div>
<div class="card">Física I</div>
<div class="card">Geometria Analítica</div>

<script>
  // Seu código aqui. Por exemplo:
  // const titulo = document.querySelector('h1');

</script>
=== solucao
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; }
  .card { padding: 12px; margin-bottom: 8px; border-radius: 10px; background: #F5F6F8; }
</style>

<h1>Carregando...</h1>
<p id="aviso">Aguarde</p>

<div class="card">Cálculo I-A</div>
<div class="card">Física I</div>
<div class="card">Geometria Analítica</div>

<script>
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  $('h1').textContent = 'Meu Espaço';

  const aviso = $('#aviso');
  aviso.textContent = 'Pronto!';
  aviso.style.color = 'green';

  for (const card of $$('.card')) {
    card.style.border = '2px solid #2563EB';
  }
</script>
=== dica
Para a borda: `for (const card of document.querySelectorAll('.card')) { card.style.border = '2px solid #2563EB'; }`. No JavaScript, propriedades de CSS com hífen viram maiúscula: `background-color` vira `style.backgroundColor`.
</textarea>

<textarea class="licao">
id: eventos
titulo: Cliques e eventos
modo: html
=== texto
Um **evento** é algo que acontece na página: um clique, uma tecla, o mouse passando por cima. Você "escuta" um evento com `addEventListener` e passa uma função que vai rodar **quando ele acontecer**:

```js
const botao = document.querySelector('#ola');
botao.addEventListener('click', () => {
  alert('Oi!');
});
```

Repare: a função **não roda na hora**. Ela fica guardada, esperando o clique. Esse é o jeito de pensar mais importante deste módulo.

## Um contador
Para lembrar de um número entre um clique e outro, ele precisa morar numa variável **fora** da função:

```js
let cliques = 0;
botao.addEventListener('click', () => {
  cliques = cliques + 1;
  document.querySelector('#total').textContent = cliques;
});
```

Se o `let` estivesse dentro da função, ele voltaria a ser `0` a cada clique.
=== desafio
- Clicar em **+1** três vezes mostra `3` no `#contador`
  await t.clicar('#mais'); await t.clicar('#mais'); await t.clicar('#mais'); return t.texto('#contador') === '3'
- O **−1** diminui um
  if (Number(t.texto('#contador')) === 0) await t.clicar('#mais'); const n = Number(t.texto('#contador')); await t.clicar('#menos'); return Number(t.texto('#contador')) === n - 1
- O **Zerar** volta para `0`

=== texto
O que a pessoa digitou fica na propriedade `.value` do campo. Ela **sempre vem como texto**, mesmo num `type="number"`. Para fazer contas, converta com `Number()`:

```js
const p1 = Number(document.querySelector('#p1').value);
```

Sem o `Number`, `'7' + '8'` daria `'78'`. Lembra do módulo 3?

## Formulários
Colocar os campos dentro de um `<form>` tem vantagens: o `Enter` envia, e o navegador confere os campos marcados com `required`. Mas o comportamento padrão de um formulário é **recarregar a página**, e você precisa impedir isso com `preventDefault()`:

```js
const form = document.querySelector('form');
form.addEventListener('submit', (e) => {
  e.preventDefault();     // não recarrega a página
  // ... o seu código
});
```

O `e` é o **evento**: um objeto com informações sobre o que aconteceu, que o navegador entrega para a sua função.

id: render
titulo: Desenhando listas com template strings
modo: html
=== texto
Template strings podem conter **HTML**. Junte isso com o `map` e você desenha uma lista inteira a partir dos dados:

```js
const materias = ['Cálculo I-A', 'Física I'];

const html = materias.map(m => `<li>${m}</li>`).join('');
document.querySelector('#lista').innerHTML = html;
```

- O `map` transforma cada matéria num pedaço de HTML.
- O `join('')` cola todos os pedaços num texto só.
- O `innerHTML` coloca esse HTML dentro do elemento, trocando o que tinha antes.

## A ideia mais importante do seu app
Os **dados** ficam numa variável. Uma função `render()` **redesenha** a tela a partir deles. Quando algo muda, você **muda os dados e chama `render()` de novo**. Você nunca mexe na tela "na mão".

```js
function render() {
  lista.innerHTML = materias.map(m => `<li>${m}</li>`).join('');
}

// para adicionar:
materias.push('Química');
render();
```

O Meu Espaço inteiro funciona assim: existe uma `function render()` lá no código, e quase toda ação termina chamando `render()`.

> Cuidado: o `innerHTML` interpreta o texto como HTML. Se alguém digitar `<b>oi</b>` como nome de matéria, vira negrito de verdade. O seu app usa uma função `esc()` para evitar isso, e o projeto final também vai usar.

- Digitar uma matéria e clicar em **Adicionar** coloca mais um item na lista
  const antes = t.$$('#lista li').length; await t.digitar('#nova', 'Química Geral'); await t.enviar('form'); return t.$$('#lista li').length === antes + 1 && t.$$('#lista li').some(li => li.textContent.includes('Química Geral'))

- O `#total` mostra quantas matérias existem, e acompanha as mudanças

id: delegacao
titulo: Um ouvinte para todos os botões
modo: html
=== texto
Quando a lista é redesenhada com `innerHTML`, os botões antigos vão para o lixo e botões novos são criados no lugar. Um `addEventListener` que estava preso num botão antigo some junto com ele.

O seu app resolve isso de um jeito elegante: **um único ouvinte no documento inteiro**, que descobre qual botão foi clicado olhando os atributos `data-*`:

```html
<button data-acao="remover" data-valor="2">Remover</button>
```

```js
document.addEventListener('click', (e) => {
  const botao = e.target.closest('[data-acao]');
  if (!botao) return;                 // clicou fora de um botão
  const acao = botao.dataset.acao;    // 'remover'
  const valor = botao.dataset.valor;  // '2' (sempre vem como texto!)
  // ... decida o que fazer
});
```

- `e.target` é o elemento exato que recebeu o clique.
- `closest(seletor)` sobe pelos "pais" até achar um que combine com o seletor. O clique pode ter acontecido num ícone dentro do botão, por exemplo.

Isso se chama **delegação de eventos**. No seu app está escrito assim: `const b = e.target.closest('[data-action]')`. As ações ficam num objeto `A`, e cada botão diz qual ação quer pelo `data-action`.

## Duas ferramentas novas
- O `map` também entrega a **posição** de cada item, como segundo parâmetro: `materias.map((m, i) => ...)`.
- Para tirar um item do array pela posição: `materias.splice(i, 1)` (a partir da posição `i`, remove 1 item).
=== desafio
- Cada `<li>` tem um botão com `data-acao="remover"` e `data-valor` igual à sua posição
  const lis = t.$$('#lista li'); const bs = t.$$('#lista li [data-acao="remover"]'); return lis.length > 0 && bs.length === lis.length && bs.every((b, i) => b.dataset.valor === String(i))
- Clicar em remover tira **aquele** item da lista, não outro
  const antes = t.$$('#lista li').map(li => li.textContent); const alvo = t.$$('#lista li')[1]; if (!alvo) t.falha('A lista precisa ter pelo menos 2 itens.'); const b = alvo.querySelector('[data-acao="remover"]'); if (!b) return false; await t.clicar(b); const depois = t.$$('#lista li').map(li => li.textContent); return depois.length === antes.length - 1 && !depois.includes(antes[1]) && depois.includes(antes[0])
- Existe um único `addEventListener('click', ...)`, e ele está no `document`
  (t.codigo.match(/addEventListener\(\s*['"]click['"]/g) || []).length === 1 && t.tem(/document\.addEventListener\(\s*['"]click['"]/)
- Um botão com `data-acao="concluir"` marca a matéria como concluída (classe `feita` no `<li>`)
  const li = t.$$('#lista li')[0]; if (!li) return false; const b = li.querySelector('[data-acao="concluir"]'); if (!b) return false; await t.clicar(b); return t.$$('#lista li')[0].classList.contains('feita')

<h1>Matérias do semestre</h1>

    { nome: 'Cálculo I-A', feita: false },
    { nome: 'Física I', feita: false },
    { nome: 'Geometria Analítica', feita: false },
    { nome: 'Programação de Computadores', feita: false },
  ];

  function render() {
    document.querySelector('#lista').innerHTML = materias.map((m, i) => `
      <li class="${m.feita ? 'feita' : ''}">
        <span>${m.nome}</span>
        <button data-acao="concluir" data-valor="${i}">Concluir</button>
        <button data-acao="remover" data-valor="${i}">Remover</button>
      </li>`).join('');
  }

  document.addEventListener('click', (e) => {
    const botao = e.target.closest('[data-acao]');
    if (!botao) return;
    const i = Number(botao.dataset.valor);
    if (botao.dataset.acao === 'remover') {
      materias.splice(i, 1);
    }
    if (botao.dataset.acao === 'concluir') {
      materias[i].feita = !materias[i].feita;
    }
    render();
  });

  render();
</script>

As ideias deste módulo são as que mais aparecem no código do seu app.
=== perguntas
? O que `document.querySelector('.card')` devolve?
+ O primeiro elemento com a classe `card`
- Todos os elementos com a classe `card`
- O texto de dentro do card
= Para pegar todos, use `querySelectorAll`. Se nenhum elemento combinar, o `querySelector` devolve `null`.

? Por que usar `Number(input.value)`?
+ Porque `.value` sempre vem como texto
- Porque o input só aceita números

? No padrão do seu app, o que acontece quando a pessoa adiciona uma matéria?
+ Os dados mudam e a `render()` redesenha a tela
- O código procura o lugar certo e encaixa um `<li>` na mão
- A página é recarregada
= Dados mudam e a tela é redesenhada a partir deles. É mais simples e evita que a tela e os dados fiquem diferentes.

? Para que serve `e.target.closest('[data-acao]')`?
+ Achar o botão com `data-acao` que contém o elemento clicado
- Fechar o botão mais próximo
- Criar um botão novo
= O `closest` sobe pelos pais do elemento clicado até encontrar um que combine com o seletor (ou devolve `null`).

id: storage
titulo: localStorage: a memória do navegador
modo: html
semente: {"nome": "Grace"}
=== texto
Recarregue qualquer exercício anterior e tudo volta ao começo: as variáveis só existem enquanto a página está aberta. Para **lembrar** das coisas, o navegador oferece o `localStorage`, um armário de gavetas com nome:

```js
localStorage.setItem('nome', 'Pachecuff');    // guarda
const nome = localStorage.getItem('nome');    // lê: 'Pachecuff'
localStorage.removeItem('nome');              // apaga
```

Ele só guarda **texto**. Para guardar arrays e objetos, transforme em texto com **JSON**:

```js
const materias = [{ nome: 'Física I', p1: 7 }];
